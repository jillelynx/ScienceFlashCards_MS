<body>
<div class="wrap">
<header>
  <div><div class="k" id="kicker"></div><h1 id="apptitle"></h1></div>
  <div class="hdr-r">
    <button type="button" class="pill who" id="whoBtn" hidden></button>
    <button type="button" class="pill" id="optBtn" aria-haspopup="dialog"></button>
    <div class="lang" role="group" id="langGrp"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="es" aria-pressed="false" lang="es">Español</button></div>
  </div>
</header>

<main id="home">
  <aside class="tipbox" role="note"><span class="ti" aria-hidden="true">✍️</span><div><b id="tipT"></b><div id="tipP"></div></div></aside>
  <p class="intro" id="intro"></p>
  <p class="streak" id="streakLine" hidden></p>
  <div class="gradebar" id="gradebar" role="group" aria-label="Grade"></div>
  <p class="estnote" id="estnote" hidden></p>
  <div class="grid" id="tiles"></div>
  <details class="help" id="help"><summary id="helpS"></summary><div id="helpBody"></div></details>
  <footer id="foot"></footer>
</main>

<main id="study" hidden>
  <div class="bar">
    <button type="button" class="back" id="backBtn"></button>
    <h2 class="deckname" id="deckname"></h2>
    <div class="count" id="count"></div>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
  </div>
  <div class="stdsel" id="stdWrap" hidden><label><span class="sr" id="stdLab"></span><select id="stdSel"></select></label></div>
  <div class="stage">
    <button type="button" class="card" id="card"><div class="cin">
      <div class="face front" id="faceF"><div class="tag"><span id="fU"></span><span id="fS"></span></div><div class="body"><div class="term" id="fT"></div><div class="en" id="fE" lang="en"></div></div><div class="hint" id="fH"></div></div>
      <div class="face backf" id="faceB" aria-hidden="true"><div class="tag"><span id="bU"></span><span id="bS"></span></div><div class="body"><div class="t2" id="bT"></div><div class="ans" id="bA"></div><div class="fig" id="bF" hidden></div></div><div class="hint" id="bH"></div></div>
    </div></button>
  </div>
  <div class="ctrls">
    <button type="button" class="btn prev" id="prev" disabled></button>
    <button type="button" class="btn again" id="again" disabled></button>
    <button type="button" class="btn good" id="good" disabled></button>
    <button type="button" class="btn" id="skip"></button>
  </div>
  <div class="readrow" id="readRow" hidden><button type="button" class="btn speak" id="speak" aria-pressed="false"></button></div>
</main>

<main id="finish" hidden>
  <div class="done"><h2 class="big" id="dscore"></h2><div class="rec" id="recBox" hidden><div class="pct" id="recPct"></div><div class="pb" id="recPB"></div><div class="stk" id="recStk"></div></div><p id="dtext"></p>
  <div class="ctrls"><button type="button" class="btn good" id="nextset" hidden></button><button type="button" class="btn again" id="redo"></button><button type="button" class="btn" id="restart"></button><button type="button" class="btn" id="home2"></button></div></div>
</main>
<div class="sr" aria-live="polite" id="live"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" id="panel">
    <div class="ph"><h2 id="pTitle"></h2><button type="button" class="obtn" id="pClose"></button></div>
    <h3 id="hStudent"></h3>
    <div class="orow"><label class="olab" for="profSel" id="lProf"></label><select id="profSel"></select></div>
    <div class="orow"><span class="olab" id="lProfAct"></span><div class="ogrp"><button type="button" class="obtn" id="profAdd"></button><button type="button" class="obtn" id="profRen"></button><button type="button" class="obtn" id="profDel"></button></div></div>
    <h3 id="hReading"></h3>
    <div class="orow"><span class="olab" id="lSize"></span><div class="ogrp"><button type="button" class="obtn" id="szDn">A−</button><span class="oval" id="szVal"></span><button type="button" class="obtn" id="szUp">A+</button></div></div>
    <div class="orow"><span class="olab" id="lSimple"></span><button type="button" class="obtn" id="tSimple"></button></div>
    <div class="orow"><span class="olab" id="lPics"></span><button type="button" class="obtn" id="tPics"></button></div>
    <div class="orow"><span class="olab" id="lDys"></span><button type="button" class="obtn" id="tDys"></button></div>
    <div class="orow"><span class="olab" id="lHc"></span><button type="button" class="obtn" id="tHc"></button></div>
    <h3 id="hRead"></h3>
    <div class="orow"><span class="olab" id="lAuto"></span><button type="button" class="obtn" id="tAuto"></button></div>
    <div class="orow"><label class="olab" for="rate" id="lRate"></label><select id="rate"><option value="0.75"></option><option value="1"></option><option value="1.25"></option></select></div>
    <div class="orow vrow"><label class="olab" for="vEn" id="lVEn"></label><div class="ogrp"><select id="vEn"></select><button type="button" class="obtn" id="tstEn"></button></div></div>
    <div class="orow vrow"><label class="olab" for="vEs" id="lVEs"></label><div class="ogrp"><select id="vEs"></select><button type="button" class="obtn" id="tstEs"></button></div></div>
    <details class="vtips" id="vTips"><summary id="vtS"></summary><ul class="keys" id="vtL"></ul></details>
    <h3 id="hStudy"></h3>
    <div class="orow"><span class="olab" id="lScores"></span><button type="button" class="obtn" id="tScores"></button></div>
    <div class="orow"><span class="olab" id="lClearRec"></span><button type="button" class="obtn" id="clearRec"></button></div>
    <div class="orow"><span class="olab" id="lSet"></span><div class="ogrp" id="setGrp" role="group"><button type="button" class="obtn" data-set="0"></button><button type="button" class="obtn" data-set="10">10</button><button type="button" class="obtn" data-set="5">5</button></div></div>
    <h3 id="hKeys"></h3>
    <ul class="keys" id="keysList"></ul>
    <div class="orow" style="margin-top:12px"><span class="olab" id="lReset"></span><button type="button" class="obtn" id="resetBtn"></button></div>
  </div>
</div>

<script>
const UNITS = [{"n": 11, "grade": 8, "u": 1, "color": "#BE185D", "ink": "#a1144f", "glow": "#ed1e74", "title": {"en": "Cells and Body Systems", "es": "Las células y los sistemas del cuerpo"}, "cards": [{"id": "11-1", "std": "3.1.6-8.A", "en": ["Cell", "The smallest unit that can be said to be alive. All living things are made of one or more cells."], "es": ["Célula", "La unidad más pequeña que se puede considerar viva. Todos los seres vivos están formados por una o más células."], "ens": "Smallest living unit; all living things have cells.", "ess": "La unidad viva más pequeña; todo ser vivo tiene células.", "fig": null}, {"id": "11-2", "std": "3.1.6-8.A", "en": ["How can you tell a living thing from a nonliving thing?", "Living things are made of cells. Nonliving things, like a rock or a plastic toy, are not made of cells."], "es": ["¿Cómo distingues un ser vivo de algo sin vida?", "Los seres vivos están formados por células. Las cosas sin vida, como una roca o un juguete de plástico, no están formadas por células."], "ens": "Living things have cells; nonliving things do not.", "ess": "Los seres vivos tienen células; las cosas sin vida no.", "fig": null}, {"id": "11-3", "std": "3.1.6-8.A", "en": ["Unicellular", "Made of only one cell. Bacteria are unicellular organisms."], "es": ["Unicelular", "Formado por una sola célula. Las bacterias son organismos unicelulares."], "ens": "Made of just one cell, like bacteria.", "ess": "Formado por una sola célula, como las bacterias.", "fig": null}, {"id": "11-4", "std": "3.1.6-8.A", "en": ["Multicellular", "Made of many cells, often of different types and numbers. Humans, trees, and dogs are multicellular."], "es": ["Multicelular", "Formado por muchas células, a menudo de distintos tipos y en distintas cantidades. Los humanos, los árboles y los perros son multicelulares."], "ens": "Made of many cells of different types.", "ess": "Formado por muchas células de distintos tipos.", "fig": null}, {"id": "11-5", "std": "3.1.6-8.B", "en": ["How do the parts of a cell work together?", "A cell works as a whole system. Each part has a special job, and all the jobs together keep the cell alive."], "es": ["¿Cómo trabajan juntas las partes de una célula?", "La célula funciona como un sistema completo. Cada parte tiene una función especial, y todas juntas mantienen viva a la célula."], "ens": "Each part has a job; together they keep the cell alive.", "ess": "Cada parte tiene una función; juntas mantienen viva la célula.", "fig": null}, {"id": "11-6", "std": "3.1.6-8.B", "en": ["Cell membrane", "The thin boundary around every cell. It controls what enters and leaves the cell."], "es": ["Membrana celular", "El límite delgado que rodea a toda célula. Controla lo que entra y sale de la célula."], "ens": "Boundary that controls what enters and leaves the cell.", "ess": "Límite que controla lo que entra y sale de la célula.", "fig": null}, {"id": "11-7", "std": "3.1.6-8.B", "en": ["Cell wall", "A stiff layer outside the cell membrane of plant cells. It supports and protects the cell, helping plants stand up."], "es": ["Pared celular", "Una capa rígida fuera de la membrana celular de las células vegetales. Sostiene y protege la célula, y ayuda a las plantas a mantenerse erguidas."], "ens": "Stiff outer layer that supports and protects plant cells.", "ess": "Capa rígida que sostiene y protege las células vegetales.", "fig": null}, {"id": "11-8", "std": "3.1.6-8.B", "en": ["Cell membrane vs. cell wall", "All cells have a membrane that controls what goes in and out. Plant cells also have a stiff wall outside it for support."], "es": ["Membrana celular vs. pared celular", "Todas las células tienen una membrana que controla lo que entra y sale. Las células vegetales también tienen una pared rígida por fuera que les da soporte."], "ens": "Membrane controls traffic; wall gives plant cells support.", "ess": "La membrana controla el paso; la pared da soporte a plantas.", "fig": null}, {"id": "11-9", "std": "3.1.6-8.B", "en": ["Nucleus", "The part of the cell that holds its genetic information and controls the cell's activities."], "es": ["Núcleo", "La parte de la célula que guarda su información genética y controla las actividades de la célula."], "ens": "Holds genetic information and controls the cell.", "ess": "Guarda la información genética y controla la célula.", "fig": null}, {"id": "11-10", "std": "3.1.6-8.B", "en": ["Chloroplast", "The part of a plant cell that uses light energy to make food for the cell. Animal cells do not have chloroplasts."], "es": ["Cloroplasto", "La parte de la célula vegetal que usa la energía de la luz para producir alimento para la célula. Las células animales no tienen cloroplastos."], "ens": "Plant cell part that uses light to make food.", "ess": "Parte de la célula vegetal que usa luz para hacer alimento.", "fig": null}, {"id": "11-11", "std": "3.1.6-8.B", "en": ["Mitochondria", "Cell parts that release energy from food so the whole cell can do its work. Both plant and animal cells have them."], "es": ["Mitocondrias", "Partes de la célula que liberan la energía de los alimentos para que toda la célula pueda trabajar. Las células vegetales y animales las tienen."], "ens": "Release energy from food for the cell.", "ess": "Liberan la energía de los alimentos para la célula.", "fig": null}, {"id": "11-12", "std": "3.1.6-8.C", "en": ["Tissue", "A group of similar cells that work together to do a job. Example: muscle tissue."], "es": ["Tejido", "Un grupo de células parecidas que trabajan juntas para realizar una función. Ejemplo: el tejido muscular."], "ens": "Group of similar cells working together.", "ess": "Grupo de células parecidas que trabajan juntas.", "fig": null}, {"id": "11-13", "std": "3.1.6-8.C", "en": ["Organ", "A structure made of different tissues working together for a special body function. Examples: heart, lungs, stomach."], "es": ["Órgano", "Una estructura formada por distintos tejidos que trabajan juntos para una función especial del cuerpo. Ejemplos: corazón, pulmones, estómago."], "ens": "Different tissues working together, like the heart.", "ess": "Distintos tejidos que trabajan juntos, como el corazón.", "fig": null}, {"id": "11-14", "std": "3.1.6-8.C", "en": ["How is the body organized from cells?", "Cells form tissues, tissues form organs, and organs work together in body systems."], "es": ["¿Cómo se organiza el cuerpo a partir de las células?", "Las células forman tejidos, los tejidos forman órganos y los órganos trabajan juntos en sistemas del cuerpo."], "ens": "Cells, then tissues, then organs, then body systems.", "ess": "Células, luego tejidos, luego órganos, luego sistemas.", "fig": null}, {"id": "11-15", "std": "3.1.6-8.C", "en": ["Subsystem", "A smaller system that is part of a bigger one. Each body system is a subsystem of the whole body."], "es": ["Subsistema", "Un sistema más pequeño que forma parte de uno más grande. Cada sistema del cuerpo es un subsistema del cuerpo entero."], "ens": "A smaller system inside a bigger system.", "ess": "Un sistema más pequeño dentro de uno más grande.", "fig": null}, {"id": "11-16", "std": "3.1.6-8.C", "en": ["Circulatory system", "The heart and blood vessels. It moves blood that carries oxygen and nutrients to all body cells."], "es": ["Sistema circulatorio", "El corazón y los vasos sanguíneos. Mueve la sangre, que lleva oxígeno y nutrientes a todas las células del cuerpo."], "ens": "Heart and blood vessels move blood around the body.", "ess": "Corazón y vasos sanguíneos mueven la sangre por el cuerpo.", "fig": null}, {"id": "11-17", "std": "3.1.6-8.C", "en": ["Respiratory system", "The lungs and airways. It takes in oxygen and gets rid of carbon dioxide."], "es": ["Sistema respiratorio", "Los pulmones y las vías respiratorias. Toma oxígeno y elimina el dióxido de carbono."], "ens": "Lungs take in oxygen and release carbon dioxide.", "ess": "Los pulmones toman oxígeno y sacan dióxido de carbono.", "fig": null}, {"id": "11-18", "std": "3.1.6-8.C", "en": ["Digestive system", "Organs like the stomach and intestines. It breaks food down so the body can absorb nutrients."], "es": ["Sistema digestivo", "Órganos como el estómago y los intestinos. Descompone los alimentos para que el cuerpo pueda absorber los nutrientes."], "ens": "Breaks down food so the body gets nutrients.", "ess": "Descompone los alimentos para obtener nutrientes.", "fig": null}, {"id": "11-19", "std": "3.1.6-8.C", "en": ["Excretory system", "Organs like the kidneys and bladder. It removes wastes from the body."], "es": ["Sistema excretor", "Órganos como los riñones y la vejiga. Elimina los desechos del cuerpo."], "ens": "Kidneys and bladder remove body wastes.", "ess": "Los riñones y la vejiga eliminan los desechos.", "fig": null}, {"id": "11-20", "std": "3.1.6-8.C", "en": ["Muscular system", "The muscles of the body. They contract to move the body and to pump blood (heart muscle)."], "es": ["Sistema muscular", "Los músculos del cuerpo. Se contraen para mover el cuerpo y para bombear la sangre (músculo del corazón)."], "ens": "Muscles that move the body.", "ess": "Los músculos que mueven el cuerpo.", "fig": null}, {"id": "11-21", "std": "3.1.6-8.C", "en": ["Nervous system", "The brain, spinal cord, and nerves. It sends and processes signals that control the body."], "es": ["Sistema nervioso", "El cerebro, la médula espinal y los nervios. Envía y procesa señales que controlan el cuerpo."], "ens": "Brain and nerves send signals that control the body.", "ess": "El cerebro y los nervios envían señales que controlan el cuerpo.", "fig": null}, {"id": "11-22", "std": "3.1.6-8.C", "en": ["How do body systems work together?", "Systems depend on each other. During exercise, muscles need more oxygen, so breathing and heart rate both speed up."], "es": ["¿Cómo trabajan juntos los sistemas del cuerpo?", "Los sistemas dependen unos de otros. Al hacer ejercicio, los músculos necesitan más oxígeno, así que la respiración y el ritmo cardíaco aumentan."], "ens": "Systems depend on each other, like breathing and heartbeat.", "ess": "Los sistemas dependen entre sí, como respirar y el corazón.", "fig": null}, {"id": "11-23", "std": "3.1.6-8.G", "en": ["What happens to food inside an organism?", "Through chemical reactions, food molecules are broken apart and put back together to form new molecules."], "es": ["¿Qué le pasa al alimento dentro de un organismo?", "Mediante reacciones químicas, las moléculas de los alimentos se separan y se vuelven a unir para formar moléculas nuevas."], "ens": "Food molecules are broken apart and rebuilt into new ones.", "ess": "Las moléculas del alimento se separan y forman moléculas nuevas.", "fig": null}, {"id": "11-24", "std": "3.1.6-8.G", "en": ["How does food help an organism grow?", "Food is rearranged into new molecules that become part of the body, building new cells and tissues."], "es": ["¿Cómo ayuda el alimento a que un organismo crezca?", "El alimento se reorganiza en moléculas nuevas que pasan a formar parte del cuerpo y construyen células y tejidos nuevos."], "ens": "Food becomes new molecules that build the body.", "ess": "El alimento forma moléculas nuevas que construyen el cuerpo.", "fig": null}, {"id": "11-25", "std": "3.1.6-8.G", "en": ["How do organisms get energy from food?", "When food molecules are broken apart in chemical reactions, stored energy is released for the organism to use."], "es": ["¿Cómo obtienen energía los organismos de los alimentos?", "Cuando las moléculas de los alimentos se separan en reacciones químicas, se libera la energía almacenada para que el organismo la use."], "ens": "Breaking down food releases stored energy.", "ess": "Descomponer el alimento libera energía almacenada.", "fig": null}, {"id": "11-26", "std": "3.1.6-8.G", "en": ["Cellular respiration", "Chemical reactions in plant and animal cells where carbon-containing food molecules react with oxygen, releasing stored energy."], "es": ["Respiración celular", "Reacciones químicas en las células de plantas y animales en las que moléculas de alimento con carbono reaccionan con oxígeno y liberan energía almacenada."], "ens": "Food reacts with oxygen in cells to release energy.", "ess": "El alimento reacciona con oxígeno en las células y libera energía.", "fig": null}, {"id": "11-27", "std": "3.1.6-8.G", "en": ["What does cellular respiration produce?", "Carbon dioxide and other materials, plus released energy the organism can use."], "es": ["¿Qué produce la respiración celular?", "Dióxido de carbono y otros materiales, además de energía liberada que el organismo puede usar."], "ens": "Carbon dioxide, other materials, and energy.", "ess": "Dióxido de carbono, otros materiales y energía.", "fig": null}, {"id": "11-28", "std": "3.1.6-8.G", "en": ["Do plants carry out cellular respiration?", "Yes. Plants and animals both use cellular respiration to release energy stored in food."], "es": ["¿Las plantas realizan respiración celular?", "Sí. Tanto las plantas como los animales usan la respiración celular para liberar la energía almacenada en los alimentos."], "ens": "Yes, plants and animals both do it.", "ess": "Sí, tanto plantas como animales la realizan.", "fig": null}, {"id": "11-29", "std": "3.1.6-8.H", "en": ["Stimulus", "Something in the environment that causes a response, like light, sound, heat, or a smell. Plural: stimuli."], "es": ["Estímulo", "Algo del entorno que causa una respuesta, como la luz, el sonido, el calor o un olor."], "ens": "Something that causes a response, like light or sound.", "ess": "Algo que causa una respuesta, como la luz o el sonido.", "fig": null}, {"id": "11-30", "std": "3.1.6-8.H", "en": ["Sensory receptor", "A part of a sense organ that detects a stimulus and sends a signal along nerve cells to the brain."], "es": ["Receptor sensorial", "Una parte de un órgano de los sentidos que detecta un estímulo y envía una señal por las células nerviosas al cerebro."], "ens": "Detects a stimulus and signals the brain.", "ess": "Detecta un estímulo y envía una señal al cerebro.", "fig": null}, {"id": "11-31", "std": "3.1.6-8.H", "en": ["What kinds of inputs do sense receptors detect?", "Electromagnetic (light for eyes), mechanical (touch, sound), and chemical (smell, taste). Each receptor responds to its own input."], "es": ["¿Qué tipos de estímulos detectan los receptores sensoriales?", "Electromagnéticos (luz para los ojos), mecánicos (tacto, sonido) y químicos (olfato, gusto). Cada receptor responde a su propio tipo de estímulo."], "ens": "Light, touch or sound, and chemicals like smells.", "ess": "Luz, tacto o sonido, y sustancias químicas como olores.", "fig": null}, {"id": "11-32", "std": "3.1.6-8.H", "en": ["Nerve cell", "A cell that carries signals through the body, such as from sense receptors to the brain."], "es": ["Célula nerviosa", "Una célula que lleva señales por el cuerpo, por ejemplo, de los receptores sensoriales al cerebro."], "ens": "Cell that carries signals to the brain.", "ess": "Célula que lleva señales al cerebro.", "fig": null}, {"id": "11-33", "std": "3.1.6-8.H", "en": ["What does the brain do with signals from the senses?", "It processes them. The result can be an immediate behavior (covering your ears at a loud noise) or a stored memory."], "es": ["¿Qué hace el cerebro con las señales de los sentidos?", "Las procesa. El resultado puede ser una conducta inmediata (taparse los oídos ante un ruido fuerte) o un recuerdo guardado."], "ens": "Processes them into actions or memories.", "ess": "Las procesa y produce acciones o recuerdos.", "fig": null}, {"id": "11-34", "std": "3.1.6-8.H", "en": ["Memory", "Information the brain stores from sense signals so it can be used later, like remembering the smell of smoke means danger."], "es": ["Recuerdo (memoria)", "Información que el cerebro guarda a partir de las señales de los sentidos para usarla después, como recordar que el olor a humo significa peligro."], "ens": "Information the brain stores to use later.", "ess": "Información que el cerebro guarda para usar después.", "fig": null}]}, {"n": 12, "grade": 8, "u": 2, "color": "#9D174D", "ink": "#851341", "glow": "#c41c60", "title": {"en": "Reproduction and Heredity", "es": "Reproducción y herencia"}, "cards": [{"id": "12-1", "std": "3.1.6-8.D", "en": ["Reproduction", "The process by which organisms make offspring (new organisms of the same kind)."], "es": ["Reproducción", "El proceso por el cual los organismos producen descendencia (nuevos organismos de su misma especie)."], "ens": "How organisms make new organisms like themselves.", "ess": "Cómo los organismos producen nuevos organismos como ellos.", "fig": null}, {"id": "12-2", "std": "3.1.6-8.D", "en": ["Offspring", "The young, or new organisms, produced by a parent or parents."], "es": ["Descendencia", "Las crías, o nuevos organismos, que producen uno o dos progenitores."], "ens": "The young made by parents.", "ess": "Las crías que producen los progenitores.", "fig": null}, {"id": "12-3", "std": "3.1.6-8.D", "en": ["Characteristic animal behavior", "A typical behavior of a species that raises its odds of reproducing, like nest building or herding to protect young."], "es": ["Conducta característica de los animales", "Una conducta típica de una especie que aumenta sus probabilidades de reproducirse, como construir nidos o andar en manada para proteger a las crías."], "ens": "Typical behavior that helps animals reproduce.", "ess": "Conducta típica que ayuda a los animales a reproducirse.", "fig": null}, {"id": "12-4", "std": "3.1.6-8.D", "en": ["How do some animals attract mates?", "With behaviors and features like calls or songs (vocalization) and colorful feathers (plumage)."], "es": ["¿Cómo atraen pareja algunos animales?", "Con conductas y rasgos como llamados o cantos (vocalización) y plumas de colores (plumaje)."], "ens": "With songs, calls, and colorful feathers.", "ess": "Con cantos, llamados y plumas de colores.", "fig": null}, {"id": "12-5", "std": "3.1.6-8.D", "en": ["How do some animals protect their young?", "Building nests keeps young warm, and herding together protects young from predators. More young survive."], "es": ["¿Cómo protegen algunos animales a sus crías?", "Construir nidos mantiene calientes a las crías, y andar en manada las protege de los depredadores. Así sobreviven más crías."], "ens": "Nests keep them warm; herds protect them from predators.", "ess": "Los nidos las calientan; las manadas las protegen de depredadores.", "fig": null}, {"id": "12-6", "std": "3.1.6-8.D", "en": ["Specialized plant structure", "A plant part that helps it reproduce, like bright flowers, sweet nectar, strong odors, or hard nut shells."], "es": ["Estructura especializada de las plantas", "Una parte de la planta que la ayuda a reproducirse, como flores brillantes, néctar dulce, olores fuertes o cáscaras duras de nueces."], "ens": "Plant part that helps it reproduce, like a flower.", "ess": "Parte de la planta que la ayuda a reproducirse, como una flor.", "fig": null}, {"id": "12-7", "std": "3.1.6-8.D", "en": ["Pollen", "Tiny grains made by flowers. For many plants to make seeds, pollen must be carried to a flower, often on another plant."], "es": ["Polen", "Granos diminutos que producen las flores. Para que muchas plantas produzcan semillas, el polen debe llegar a una flor, a menudo de otra planta."], "ens": "Tiny flower grains needed to make seeds.", "ess": "Granos diminutos de las flores necesarios para hacer semillas.", "fig": null}, {"id": "12-8", "std": "3.1.6-8.D", "en": ["Nectar", "A sweet liquid in flowers that attracts insects and other animals, which carry pollen as they feed."], "es": ["Néctar", "Un líquido dulce de las flores que atrae a insectos y otros animales, que llevan polen mientras se alimentan."], "ens": "Sweet flower liquid that attracts pollen carriers.", "ess": "Líquido dulce de las flores que atrae a animales que llevan polen.", "fig": null}, {"id": "12-9", "std": "3.1.6-8.D", "en": ["How do animals help plants reproduce?", "They carry pollen between flowers and move seeds. Squirrels bury nuts, and some grow into new plants."], "es": ["¿Cómo ayudan los animales a que las plantas se reproduzcan?", "Llevan polen de una flor a otra y trasladan semillas. Las ardillas entierran nueces, y algunas se convierten en plantas nuevas."], "ens": "They carry pollen and move or bury seeds.", "ess": "Llevan polen y mueven o entierran semillas.", "fig": null}, {"id": "12-10", "std": "3.1.6-8.D", "en": ["Seed germination", "When a seed starts to sprout and grow into a new plant."], "es": ["Germinación de la semilla", "Cuando una semilla empieza a brotar y a crecer hasta convertirse en una planta nueva."], "ens": "When a seed starts to sprout.", "ess": "Cuando una semilla empieza a brotar.", "fig": null}, {"id": "12-11", "std": "3.1.6-8.E", "en": ["Genetic factor", "Inherited information (genes) from parents that affects growth. Example: large-breed cattle grow bigger than small breeds."], "es": ["Factor genético", "Información heredada (genes) de los progenitores que afecta el crecimiento. Ejemplo: el ganado de raza grande crece más que el de razas pequeñas."], "ens": "Inherited genes that affect growth.", "ess": "Genes heredados que afectan el crecimiento.", "fig": null}, {"id": "12-12", "std": "3.1.6-8.E", "en": ["Environmental factor", "A local condition that affects growth, such as the amount of food, light, space, or water."], "es": ["Factor ambiental", "Una condición local que afecta el crecimiento, como la cantidad de alimento, luz, espacio o agua."], "ens": "Local condition like food, light, space, or water.", "ess": "Condición local como alimento, luz, espacio o agua.", "fig": null}, {"id": "12-13", "std": "3.1.6-8.E", "en": ["How can the environment change how much an organism grows?", "Drought slows plant growth and fertilizer speeds it up. Fish grow larger in big ponds than in small ponds."], "es": ["¿Cómo puede el ambiente cambiar cuánto crece un organismo?", "La sequía reduce el crecimiento de las plantas y el fertilizante lo aumenta. Los peces crecen más en estanques grandes que en estanques pequeños."], "ens": "Drought slows growth; fertilizer and space help it.", "ess": "La sequía frena el crecimiento; el fertilizante y el espacio ayudan.", "fig": null}, {"id": "12-14", "std": "3.1.6-8.E", "en": ["Why might two plants in the same garden grow differently?", "They may have different genes (different seed varieties). Growth depends on both genetic factors and local conditions."], "es": ["¿Por qué dos plantas del mismo jardín pueden crecer distinto?", "Pueden tener genes distintos (variedades de semillas diferentes). El crecimiento depende de factores genéticos y de las condiciones locales."], "ens": "Different genes; growth depends on genes and environment.", "ess": "Genes distintos; el crecimiento depende de genes y ambiente.", "fig": null}, {"id": "12-15", "std": "3.1.6-8.M", "en": ["Trait", "A characteristic of an organism, such as eye color, height, or flower color."], "es": ["Rasgo", "Una característica de un organismo, como el color de ojos, la estatura o el color de las flores."], "ens": "A characteristic, like eye color.", "ess": "Una característica, como el color de ojos.", "fig": null}, {"id": "12-16", "std": "3.1.6-8.M", "en": ["Chromosome", "A structure in a cell that contains genes. Chromosomes come in pairs."], "es": ["Cromosoma", "Una estructura de la célula que contiene genes. Los cromosomas vienen en pares."], "ens": "Cell structure that holds genes; comes in pairs.", "ess": "Estructura de la célula con genes; vienen en pares.", "fig": null}, {"id": "12-17", "std": "3.1.6-8.M", "en": ["Gene", "A section of a chromosome that mainly controls the making of a specific protein, which affects a trait."], "es": ["Gen", "Una sección de un cromosoma que controla principalmente la producción de una proteína específica, la cual afecta un rasgo."], "ens": "Part of a chromosome that controls a protein.", "ess": "Parte de un cromosoma que controla una proteína.", "fig": null}, {"id": "12-18", "std": "3.1.6-8.M", "en": ["Protein", "A molecule a cell makes using instructions from a gene. Proteins affect an organism's structures, functions, and traits."], "es": ["Proteína", "Una molécula que la célula produce siguiendo las instrucciones de un gen. Las proteínas afectan las estructuras, funciones y rasgos del organismo."], "ens": "Molecule made from gene instructions; shapes traits.", "ess": "Molécula hecha según un gen; influye en los rasgos.", "fig": null}, {"id": "12-19", "std": "3.1.6-8.M", "en": ["How do genes affect traits?", "A gene controls the making of a protein, and that protein affects the organism's traits."], "es": ["¿Cómo afectan los genes a los rasgos?", "Un gen controla la producción de una proteína, y esa proteína afecta los rasgos del organismo."], "ens": "Genes control proteins; proteins affect traits.", "ess": "Los genes controlan proteínas; las proteínas afectan rasgos.", "fig": null}, {"id": "12-20", "std": "3.1.6-8.M", "en": ["Mutation", "A change in the structure of a gene. It may change a protein and therefore change a trait. Mutations are rare."], "es": ["Mutación", "Un cambio en la estructura de un gen. Puede cambiar una proteína y, por lo tanto, cambiar un rasgo. Las mutaciones son poco comunes."], "ens": "A change in a gene that may change a trait.", "ess": "Un cambio en un gen que puede cambiar un rasgo.", "fig": null}, {"id": "12-21", "std": "3.1.6-8.M", "en": ["Are mutations good or bad for an organism?", "It depends. A mutation can be beneficial (helpful), harmful, or neutral (no effect) to the organism."], "es": ["¿Las mutaciones son buenas o malas para un organismo?", "Depende. Una mutación puede ser beneficiosa (útil), perjudicial o neutra (sin efecto) para el organismo."], "ens": "They can be helpful, harmful, or have no effect.", "ess": "Pueden ser útiles, perjudiciales o no tener efecto.", "fig": null}, {"id": "12-22", "std": "3.1.6-8.N", "en": ["Asexual reproduction", "Reproduction with one parent. The offspring get identical genetic information, so they are copies of the parent."], "es": ["Reproducción asexual", "Reproducción con un solo progenitor. La descendencia recibe información genética idéntica, así que es una copia del progenitor."], "ens": "One parent; offspring are genetic copies.", "ess": "Un progenitor; la descendencia es una copia genética.", "fig": null}, {"id": "12-23", "std": "3.1.6-8.N", "en": ["Sexual reproduction", "Reproduction with two parents. Each parent gives half of the offspring's genes, so offspring have genetic variation."], "es": ["Reproducción sexual", "Reproducción con dos progenitores. Cada uno aporta la mitad de los genes de la descendencia, así que hay variación genética."], "ens": "Two parents; offspring get half their genes from each.", "ess": "Dos progenitores; cada uno aporta la mitad de los genes.", "fig": null}, {"id": "12-24", "std": "3.1.6-8.N", "en": ["Genetic variation", "Differences in genes between individuals. It causes differences in inherited traits."], "es": ["Variación genética", "Diferencias en los genes entre individuos. Causa diferencias en los rasgos heredados."], "ens": "Differences in genes between individuals.", "ess": "Diferencias en los genes entre individuos.", "fig": null}, {"id": "12-25", "std": "3.1.6-8.N", "en": ["Inherited trait", "A trait passed from parent(s) to offspring through genes, like the shape of a pea or a dog's fur color."], "es": ["Rasgo heredado", "Un rasgo que pasa de los progenitores a la descendencia por medio de los genes, como la forma de un guisante o el color del pelaje de un perro."], "ens": "Trait passed from parents through genes.", "ess": "Rasgo que pasa de padres a hijos por los genes.", "fig": null}, {"id": "12-26", "std": "3.1.6-8.N", "en": ["Allele", "One version of a gene. You have two alleles of each gene, one from each parent. They may be the same or different."], "es": ["Alelo", "Una versión de un gen. Tienes dos alelos de cada gen, uno de cada progenitor. Pueden ser iguales o distintos."], "ens": "A version of a gene; you get one from each parent.", "ess": "Una versión de un gen; recibes uno de cada progenitor.", "fig": null}, {"id": "12-27", "std": "3.1.6-8.N", "en": ["Why do offspring from two parents look different from them?", "Each parent passes on a random half of its chromosomes and genes, so offspring get a new mix of alleles."], "es": ["¿Por qué la descendencia de dos progenitores es distinta a ellos?", "Cada progenitor transmite al azar la mitad de sus cromosomas y genes, así que la descendencia recibe una mezcla nueva de alelos."], "ens": "Each parent gives a random half of its genes.", "ess": "Cada progenitor da al azar la mitad de sus genes.", "fig": null}, {"id": "12-28", "std": "3.1.6-8.N", "en": ["Punnett square", "A grid model that shows the possible allele combinations offspring can get from two parents."], "es": ["Cuadro de Punnett", "Un modelo en forma de cuadrícula que muestra las posibles combinaciones de alelos que la descendencia puede recibir de dos progenitores."], "ens": "Grid showing possible allele combinations in offspring.", "ess": "Cuadrícula con las posibles combinaciones de alelos.", "fig": null}, {"id": "12-29", "std": "3.1.6-8.N", "en": ["Asexual vs. sexual reproduction", "Asexual: one parent, offspring identical to parent. Sexual: two parents, offspring have genetic variation."], "es": ["Reproducción asexual vs. sexual", "Asexual: un progenitor, descendencia idéntica a él. Sexual: dos progenitores, descendencia con variación genética."], "ens": "Asexual makes copies; sexual makes variety.", "ess": "La asexual hace copias; la sexual produce variedad.", "fig": null}, {"id": "12-30", "std": "3.1.6-8.R", "en": ["Artificial selection", "When humans choose which organisms reproduce so that desired traits are passed on to offspring."], "es": ["Selección artificial", "Cuando los seres humanos eligen qué organismos se reproducen para que los rasgos deseados pasen a la descendencia."], "ens": "Humans choose parents to pass on desired traits.", "ess": "Los humanos eligen progenitores para transmitir rasgos deseados.", "fig": null}, {"id": "12-31", "std": "3.1.6-8.R", "en": ["Selective breeding", "Breeding parents with desired traits on purpose. Example: breeding cows that give the most milk."], "es": ["Cría selectiva", "Cruzar a propósito progenitores con los rasgos deseados. Ejemplo: cruzar las vacas que dan más leche."], "ens": "Breeding parents with traits people want.", "ess": "Cruzar progenitores con los rasgos que se desean.", "fig": null}, {"id": "12-32", "std": "3.1.6-8.R", "en": ["Animal husbandry", "Raising and breeding farm animals, often choosing parents with traits people want, like more wool or meat."], "es": ["Cría de animales (zootecnia)", "Criar y reproducir animales de granja, a menudo eligiendo progenitores con los rasgos que se desean, como más lana o carne."], "ens": "Raising and breeding farm animals.", "ess": "Criar y reproducir animales de granja.", "fig": null}, {"id": "12-33", "std": "3.1.6-8.R", "en": ["Genetic modification", "Using technology to directly change an organism's genes to give it a desired trait, like crops that resist insects."], "es": ["Modificación genética", "Usar tecnología para cambiar directamente los genes de un organismo y darle un rasgo deseado, como cultivos resistentes a insectos."], "ens": "Using technology to change an organism's genes.", "ess": "Usar tecnología para cambiar los genes de un organismo.", "fig": null}, {"id": "12-34", "std": "3.1.6-8.R", "en": ["Gene therapy", "A medical technology that changes or replaces genes in a person's cells to treat a disease."], "es": ["Terapia génica", "Una tecnología médica que cambia o reemplaza genes en las células de una persona para tratar una enfermedad."], "ens": "Changing genes in cells to treat disease.", "ess": "Cambiar genes en las células para tratar enfermedades.", "fig": null}, {"id": "12-35", "std": "3.1.6-8.R", "en": ["How do trait-changing technologies affect society?", "They can bring more food and new medical treatments, but people also debate their safety, cost, and fairness."], "es": ["¿Cómo afectan a la sociedad las tecnologías que cambian rasgos?", "Pueden dar más alimentos y nuevos tratamientos médicos, pero también se debate sobre su seguridad, costo y equidad."], "ens": "More food and medicine, but also debates about safety.", "ess": "Más alimentos y medicinas, pero también debates sobre seguridad.", "fig": null}]}, {"n": 13, "grade": 8, "u": 3, "color": "#7E22CE", "ink": "#6b1caf", "glow": "#9d2aff", "title": {"en": "Natural Selection and Evolution", "es": "Selección natural y evolución"}, "cards": [{"id": "13-1", "std": "3.1.6-8.O", "en": ["Fossil record", "All fossils found, placed in order of when they lived. It shows the history of life on Earth."], "es": ["Registro fósil", "Todos los fósiles encontrados, ordenados según cuándo vivieron. Muestra la historia de la vida en la Tierra."], "ens": "All fossils put in time order.", "ess": "Todos los fósiles ordenados en el tiempo.", "fig": null}, {"id": "13-2", "std": "3.1.6-8.O", "en": ["How do scientists put fossils in time order?", "By the sedimentary rock layer where they are found and by radioactive dating."], "es": ["¿Cómo ordenan los científicos los fósiles en el tiempo?", "Según la capa de roca sedimentaria donde se encuentran y mediante la datación radiactiva."], "ens": "By rock layers and radioactive dating.", "ess": "Por las capas de roca y la datación radiactiva.", "fig": null}, {"id": "13-3", "std": "3.1.6-8.O", "en": ["In undisturbed rock layers, where are the oldest fossils?", "Usually in the lowest (deepest) layers. Younger fossils are in layers above them."], "es": ["En capas de roca sin alterar, ¿dónde están los fósiles más antiguos?", "Por lo general, en las capas más bajas (más profundas). Los fósiles más recientes están en las capas de arriba."], "ens": "Usually in the deepest layers.", "ess": "Por lo general, en las capas más profundas.", "fig": null}, {"id": "13-4", "std": "3.1.6-8.O", "en": ["Radioactive dating", "A method that uses radioactive elements in rocks to estimate how old the rocks and their fossils are."], "es": ["Datación radiactiva", "Un método que usa los elementos radiactivos de las rocas para estimar la edad de las rocas y de sus fósiles."], "ens": "Uses radioactive elements to find a rock's age.", "ess": "Usa elementos radiactivos para saber la edad de una roca.", "fig": null}, {"id": "13-5", "std": "3.1.6-8.O", "en": ["Extinction", "When every member of a species has died out. The fossil record shows many extinct life forms."], "es": ["Extinción", "Cuando todos los miembros de una especie han desaparecido. El registro fósil muestra muchas formas de vida extintas."], "ens": "When a species dies out completely.", "ess": "Cuando una especie desaparece por completo.", "fig": null}, {"id": "13-6", "std": "3.1.6-8.O", "en": ["Diversity (of life)", "The variety of different kinds of living things. The fossil record shows diversity has changed over Earth's history."], "es": ["Diversidad (de la vida)", "La variedad de distintos tipos de seres vivos. El registro fósil muestra que la diversidad ha cambiado a lo largo de la historia de la Tierra."], "ens": "The variety of kinds of living things.", "ess": "La variedad de tipos de seres vivos.", "fig": null}, {"id": "13-7", "std": "3.1.6-8.O", "en": ["What patterns does the fossil record show?", "Life forms appeared, changed, and went extinct over time. Body structures generally became more complex in younger layers."], "es": ["¿Qué patrones muestra el registro fósil?", "Las formas de vida aparecieron, cambiaron y se extinguieron con el tiempo. En general, las estructuras del cuerpo son más complejas en las capas más recientes."], "ens": "Life changed over time; structures got more complex.", "ess": "La vida cambió con el tiempo; las estructuras se hicieron más complejas.", "fig": null}, {"id": "13-8", "std": "3.1.6-8.O", "en": ["Why can we use today's science to study ancient fossils?", "Scientists assume natural laws work the same today as they did in the past."], "es": ["¿Por qué sirve la ciencia de hoy para estudiar fósiles antiguos?", "Los científicos suponen que las leyes naturales funcionan hoy igual que en el pasado."], "ens": "Natural laws worked the same in the past.", "ess": "Las leyes naturales funcionaban igual en el pasado.", "fig": null}, {"id": "13-9", "std": "3.1.6-8.P", "en": ["Anatomical structure", "A body part of an organism, like a bone, wing, or fin."], "es": ["Estructura anatómica", "Una parte del cuerpo de un organismo, como un hueso, un ala o una aleta."], "ens": "A body part, like a bone or wing.", "ess": "Una parte del cuerpo, como un hueso o un ala.", "fig": null}, {"id": "13-10", "std": "3.1.6-8.P", "en": ["What do similar body structures suggest about organisms?", "They suggest the organisms are related. Human arms, bat wings, and whale flippers have similar bones."], "es": ["¿Qué sugieren las estructuras del cuerpo parecidas?", "Sugieren que los organismos están emparentados. Los brazos humanos, las alas de murciélago y las aletas de ballena tienen huesos parecidos."], "ens": "That the organisms are related.", "ess": "Que los organismos están emparentados.", "fig": null}, {"id": "13-11", "std": "3.1.6-8.P", "en": ["Evolutionary relationship", "How closely related organisms are through shared ancestors. More similar anatomy usually means a closer relationship."], "es": ["Relación evolutiva", "Qué tan emparentados están los organismos por tener antepasados en común. Más parecido anatómico suele indicar una relación más cercana."], "ens": "How closely organisms are related through ancestors.", "ess": "Qué tan emparentados están por sus antepasados.", "fig": null}, {"id": "13-12", "std": "3.1.6-8.P", "en": ["Common ancestry", "The idea that different species descended from the same ancestor long ago."], "es": ["Ascendencia común", "La idea de que distintas especies descienden de un mismo antepasado de hace mucho tiempo."], "ens": "Different species came from the same ancestor.", "ess": "Distintas especies vienen del mismo antepasado.", "fig": null}, {"id": "13-13", "std": "3.1.6-8.P", "en": ["How do fossils help show evolutionary history?", "Comparing anatomy of living organisms and fossils lets scientists infer lines of descent over time."], "es": ["¿Cómo ayudan los fósiles a mostrar la historia evolutiva?", "Comparar la anatomía de organismos actuales y fósiles permite a los científicos deducir las líneas de descendencia a lo largo del tiempo."], "ens": "Comparing anatomy shows lines of descent.", "ess": "Comparar la anatomía muestra líneas de descendencia.", "fig": null}, {"id": "13-14", "std": "3.1.6-8.Q", "en": ["Embryo", "An organism in its earliest stage of development, before it is fully formed."], "es": ["Embrión", "Un organismo en su etapa más temprana de desarrollo, antes de estar completamente formado."], "ens": "An organism in its earliest stage.", "ess": "Un organismo en su etapa más temprana.", "fig": null}, {"id": "13-15", "std": "3.1.6-8.Q", "en": ["Embryological development", "The changes an embryo goes through as it grows into a fully formed organism."], "es": ["Desarrollo embrionario", "Los cambios por los que pasa un embrión mientras crece hasta ser un organismo completamente formado."], "ens": "How an embryo grows into a full organism.", "ess": "Cómo un embrión crece hasta ser un organismo completo.", "fig": null}, {"id": "13-16", "std": "3.1.6-8.Q", "en": ["What can comparing embryos show?", "Embryos of different species can look alike early on, showing relationships not seen in the adults."], "es": ["¿Qué puede mostrar la comparación de embriones?", "Los embriones de distintas especies pueden parecerse al principio, lo que muestra relaciones que no se ven en los adultos."], "ens": "Early embryos look alike, showing hidden relationships.", "ess": "Los embriones se parecen y muestran relaciones ocultas.", "fig": null}, {"id": "13-17", "std": "3.1.6-8.S", "en": ["Natural selection", "Individuals with traits that fit their environment survive and reproduce more, so those traits become common."], "es": ["Selección natural", "Los individuos con rasgos adecuados a su ambiente sobreviven y se reproducen más, así que esos rasgos se vuelven comunes."], "ens": "Helpful traits survive and spread in a population.", "ess": "Los rasgos útiles sobreviven y se extienden en la población.", "fig": null}, {"id": "13-18", "std": "3.1.6-8.S", "en": ["Why do some individuals survive and reproduce more than others?", "Genetic variation means some have traits that help in their environment. Example: green beetles hide well on leaves."], "es": ["¿Por qué algunos individuos sobreviven y se reproducen más que otros?", "Por la variación genética, algunos tienen rasgos que los ayudan en su ambiente. Ejemplo: los escarabajos verdes se esconden bien entre las hojas."], "ens": "Some have traits that help in their environment.", "ess": "Algunos tienen rasgos que los ayudan en su ambiente.", "fig": null}, {"id": "13-19", "std": "3.1.6-8.S", "en": ["What does natural selection do to traits in a population?", "Helpful traits become predominant (more common) and less helpful traits are suppressed (become rare)."], "es": ["¿Qué hace la selección natural con los rasgos de una población?", "Los rasgos útiles se vuelven predominantes (más comunes) y los menos útiles se suprimen (se vuelven raros)."], "ens": "Helpful traits increase; others decrease.", "ess": "Los rasgos útiles aumentan; los otros disminuyen.", "fig": null}, {"id": "13-20", "std": "3.1.6-8.S", "en": ["How can probability describe natural selection?", "If 3 of 4 dark moths survive on dark bark but only 1 of 4 light moths do, dark moths have a higher chance."], "es": ["¿Cómo puede la probabilidad describir la selección natural?", "Si 3 de 4 polillas oscuras sobreviven en corteza oscura, pero solo 1 de 4 claras, las polillas oscuras tienen más probabilidad."], "ens": "Compare survival chances, like 3 of 4 vs. 1 of 4.", "ess": "Compara probabilidades de sobrevivir, como 3 de 4 vs. 1 de 4.", "fig": null}, {"id": "13-21", "std": "3.1.6-8.T", "en": ["Adaptation", "A trait that helps an organism survive and reproduce in its environment. Natural selection over generations builds adaptations."], "es": ["Adaptación", "Un rasgo que ayuda a un organismo a sobrevivir y reproducirse en su ambiente. La selección natural, a lo largo de generaciones, produce adaptaciones."], "ens": "A trait that helps survival and reproduction.", "ess": "Un rasgo que ayuda a sobrevivir y reproducirse.", "fig": null}, {"id": "13-22", "std": "3.1.6-8.T", "en": ["Generation", "One step in a family line: parents are one generation, and their offspring are the next."], "es": ["Generación", "Un paso en una línea familiar: los progenitores son una generación y su descendencia es la siguiente."], "ens": "Parents are one generation; offspring are the next.", "ess": "Los padres son una generación; sus hijos, la siguiente.", "fig": null}, {"id": "13-23", "std": "3.1.6-8.T", "en": ["How do species change when the environment changes?", "Over many generations, traits that help in the new environment become more common; others become less common."], "es": ["¿Cómo cambian las especies cuando cambia el ambiente?", "A lo largo de muchas generaciones, los rasgos útiles en el nuevo ambiente se vuelven más comunes y los demás, menos comunes."], "ens": "Helpful traits become more common over generations.", "ess": "Los rasgos útiles se hacen más comunes con las generaciones.", "fig": null}, {"id": "13-24", "std": "3.1.6-8.T", "en": ["Distribution of traits", "How common each trait is in a population. Natural selection changes this distribution over time."], "es": ["Distribución de rasgos", "Qué tan común es cada rasgo en una población. La selección natural cambia esta distribución con el tiempo."], "ens": "How common each trait is in a population.", "ess": "Qué tan común es cada rasgo en una población.", "fig": null}, {"id": "13-25", "std": "3.1.6-8.T", "en": ["How can math show a trait changing in a population?", "Track percentages over generations. Example: dark moths go from 10% to 40% to 70% of the population."], "es": ["¿Cómo puede la matemática mostrar el cambio de un rasgo?", "Sigue los porcentajes a lo largo de las generaciones. Ejemplo: las polillas oscuras pasan del 10% al 40% y al 70% de la población."], "ens": "Track trait percentages over generations.", "ess": "Sigue los porcentajes del rasgo en cada generación.", "fig": null}]}, {"n": 14, "grade": 8, "u": 4, "color": "#0E7490", "ink": "#0b627a", "glow": "#1191b4", "title": {"en": "Properties of Matter", "es": "Propiedades de la materia"}, "cards": [{"id": "14-1", "std": "3.2.6-8.A", "en": ["Substance", "A specific kind of matter, made from certain types of atoms. Water, salt, and oxygen are substances."], "es": ["Sustancia", "Un tipo específico de materia, formado por ciertos tipos de átomos. El agua, la sal y el oxígeno son sustancias."], "ens": "A specific kind of matter made of atoms.", "ess": "Un tipo específico de materia formado por átomos.", "fig": null}, {"id": "14-2", "std": "3.2.6-8.A", "en": ["Molecule", "Two or more atoms joined together. Molecules range in size from two atoms to thousands of atoms."], "es": ["Molécula", "Dos o más átomos unidos. Las moléculas pueden tener desde dos átomos hasta miles de átomos."], "ens": "Two or more atoms joined together.", "ess": "Dos o más átomos unidos.", "fig": null}, {"id": "14-3", "std": "3.2.6-8.A", "en": ["How do atoms make different substances?", "Different types of atoms combine in different ways. Changing which atoms or how they join makes a different substance."], "es": ["¿Cómo forman los átomos distintas sustancias?", "Distintos tipos de átomos se combinan de diferentes maneras. Cambiar qué átomos se unen o cómo se unen forma una sustancia distinta."], "ens": "Atoms combine in different ways to make substances.", "ess": "Los átomos se combinan de distintas formas para formar sustancias.", "fig": null}, {"id": "14-4", "std": "3.2.6-8.A", "en": ["Simple molecule", "A molecule made of just a few atoms. Ammonia has 1 nitrogen and 3 hydrogen atoms."], "es": ["Molécula simple", "Una molécula formada por pocos átomos. El amoníaco tiene 1 átomo de nitrógeno y 3 de hidrógeno."], "ens": "A molecule with only a few atoms.", "ess": "Una molécula con solo unos pocos átomos.", "fig": null}, {"id": "14-5", "std": "3.2.6-8.A", "en": ["Extended structure", "A solid made of a pattern of atoms (subunits) that repeats over and over. Examples: table salt and diamond."], "es": ["Estructura extendida", "Un sólido formado por un patrón de átomos (subunidades) que se repite una y otra vez. Ejemplos: la sal de mesa y el diamante."], "ens": "A solid with a repeating pattern of atoms.", "ess": "Un sólido con un patrón de átomos que se repite.", "fig": null}, {"id": "14-6", "std": "3.2.6-8.A", "en": ["Crystal", "A solid whose atoms or molecules are arranged in a repeating pattern. Salt and diamond are crystals."], "es": ["Cristal", "Un sólido cuyos átomos o moléculas están ordenados en un patrón que se repite. La sal y el diamante son cristales."], "ens": "A solid with a repeating pattern, like salt.", "ess": "Un sólido con un patrón que se repite, como la sal.", "fig": null}, {"id": "14-7", "std": "3.2.6-8.A", "en": ["What is diamond made of?", "Only carbon atoms, joined in a pattern that repeats in every direction."], "es": ["¿De qué está hecho el diamante?", "Solo de átomos de carbono, unidos en un patrón que se repite en todas direcciones."], "ens": "Carbon atoms in a repeating pattern.", "ess": "Átomos de carbono en un patrón que se repite.", "fig": null}, {"id": "14-8", "std": "3.2.6-8.A", "en": ["What is sodium chloride (table salt) made of?", "Sodium and chlorine, in a repeating pattern with one sodium for every one chlorine."], "es": ["¿De qué está hecho el cloruro de sodio (sal de mesa)?", "De sodio y cloro, en un patrón que se repite con un sodio por cada cloro."], "ens": "Sodium and chlorine in a repeating pattern.", "ess": "Sodio y cloro en un patrón que se repite.", "fig": null}, {"id": "14-9", "std": "3.2.6-8.A", "en": ["Ball-and-stick model", "A 3D model where balls stand for atoms and sticks show how they are joined. Different colors mean different atoms."], "es": ["Modelo de esferas y varillas", "Un modelo en 3D donde las esferas representan átomos y las varillas muestran cómo se unen. Los colores distintos indican átomos distintos."], "ens": "Balls are atoms; sticks show how they connect.", "ess": "Las esferas son átomos; las varillas muestran cómo se unen.", "fig": null}, {"id": "14-10", "std": "3.2.6-8.B", "en": ["Pure substance", "Matter made of only one kind of substance, like water, carbon dioxide, or helium."], "es": ["Sustancia pura", "Materia formada por un solo tipo de sustancia, como el agua, el dióxido de carbono o el helio."], "ens": "Only one kind of substance, like water.", "ess": "Un solo tipo de sustancia, como el agua.", "fig": null}, {"id": "14-11", "std": "3.2.6-8.B", "en": ["Particle", "A tiny piece of matter, such as a molecule or an atom, that is always moving."], "es": ["Partícula", "Un pedacito diminuto de materia, como una molécula o un átomo, que siempre está en movimiento."], "ens": "A tiny moving bit of matter, like a molecule.", "ess": "Un pedacito de materia en movimiento, como una molécula.", "fig": null}, {"id": "14-12", "std": "3.2.6-8.B", "en": ["Inert atom", "An atom that does not easily combine with other atoms, so it moves around alone. Helium is an example."], "es": ["Átomo inerte", "Un átomo que no se combina fácilmente con otros átomos, así que se mueve solo. El helio es un ejemplo."], "ens": "An atom that does not easily combine, like helium.", "ess": "Átomo que no se combina fácilmente, como el helio.", "fig": null}, {"id": "14-13", "std": "3.2.6-8.B", "en": ["Kinetic energy", "The energy of motion. Faster-moving particles have more kinetic energy."], "es": ["Energía cinética", "La energía del movimiento. Las partículas que se mueven más rápido tienen más energía cinética."], "ens": "Energy of motion.", "ess": "La energía del movimiento.", "fig": null}, {"id": "14-14", "std": "3.2.6-8.B", "en": ["Thermal energy", "The energy from the motion of the atoms or molecules inside a substance."], "es": ["Energía térmica", "La energía que viene del movimiento de los átomos o las moléculas dentro de una sustancia."], "ens": "Energy of moving particles in a substance.", "ess": "Energía de las partículas en movimiento de una sustancia.", "fig": null}, {"id": "14-15", "std": "3.2.6-8.B", "en": ["Heat", "In science, the thermal energy transferred from a warmer object to a cooler one because of a temperature difference."], "es": ["Calor", "En ciencias, la energía térmica que pasa de un objeto más caliente a uno más frío debido a una diferencia de temperatura."], "ens": "Thermal energy moving from warmer to cooler.", "ess": "Energía térmica que pasa de lo caliente a lo frío.", "fig": null}, {"id": "14-16", "std": "3.2.6-8.B", "en": ["Temperature", "A measure related to the average kinetic energy of a substance's particles. Faster particles mean a higher temperature."], "es": ["Temperatura", "Una medida relacionada con la energía cinética promedio de las partículas de una sustancia. Partículas más rápidas significan mayor temperatura."], "ens": "Measures how fast particles move on average.", "ess": "Mide qué tan rápido se mueven las partículas en promedio.", "fig": null}, {"id": "14-17", "std": "3.2.6-8.B", "en": ["Is temperature the same as thermal energy?", "No. A bathtub of warm water has more thermal energy than a cup at the same temperature, because it has more particles."], "es": ["¿La temperatura es lo mismo que la energía térmica?", "No. Una bañera de agua tibia tiene más energía térmica que una taza a la misma temperatura, porque tiene más partículas."], "ens": "No; more particles means more thermal energy.", "ess": "No; más partículas significan más energía térmica.", "fig": null}, {"id": "14-18", "std": "3.2.6-8.B", "en": ["How do particles move in a solid?", "They are packed closely and vibrate in place. They do not change places with each other."], "es": ["¿Cómo se mueven las partículas en un sólido?", "Están muy juntas y vibran en su lugar. No cambian de lugar entre sí."], "ens": "Packed close; they vibrate in place.", "ess": "Muy juntas; vibran en su lugar.", "fig": null}, {"id": "14-19", "std": "3.2.6-8.B", "en": ["How do particles move in a liquid?", "They stay in contact with each other but slide past one another."], "es": ["¿Cómo se mueven las partículas en un líquido?", "Se mantienen en contacto unas con otras, pero se deslizan entre sí."], "ens": "Touching, but sliding past each other.", "ess": "Se tocan, pero se deslizan entre sí.", "fig": null}, {"id": "14-20", "std": "3.2.6-8.B", "en": ["How do particles move in a gas?", "They are spread far apart and move freely, touching only when they happen to collide."], "es": ["¿Cómo se mueven las partículas en un gas?", "Están muy separadas y se mueven libremente; solo se tocan cuando chocan por casualidad."], "ens": "Far apart and moving freely.", "ess": "Muy separadas y moviéndose libremente.", "fig": null}, {"id": "14-21", "std": "3.2.6-8.B", "en": ["What happens to particles when thermal energy is added?", "They move faster (more kinetic energy) and temperature rises, until a change of state happens, like ice melting."], "es": ["¿Qué les pasa a las partículas cuando se agrega energía térmica?", "Se mueven más rápido (más energía cinética) y la temperatura sube, hasta que ocurre un cambio de estado, como el hielo al derretirse."], "ens": "They speed up until the state changes.", "ess": "Se mueven más rápido hasta que cambia el estado.", "fig": null}, {"id": "14-22", "std": "3.2.6-8.B", "en": ["What happens to particles when thermal energy is removed?", "They slow down (less kinetic energy) and temperature drops, until a change of state happens, like water freezing."], "es": ["¿Qué les pasa a las partículas cuando se quita energía térmica?", "Se mueven más despacio (menos energía cinética) y la temperatura baja, hasta que ocurre un cambio de estado, como el agua al congelarse."], "ens": "They slow down until the state changes.", "ess": "Se mueven más despacio hasta que cambia el estado.", "fig": null}, {"id": "14-23", "std": "3.2.6-8.B", "en": ["Change of state", "When matter changes between solid, liquid, and gas, such as melting, freezing, or boiling."], "es": ["Cambio de estado", "Cuando la materia cambia entre sólido, líquido y gas, como al derretirse, congelarse o hervir."], "ens": "Changing between solid, liquid, and gas.", "ess": "Cambiar entre sólido, líquido y gas.", "fig": null}, {"id": "14-24", "std": "3.2.6-8.B", "en": ["What can cause a change of state?", "Changing the temperature or the pressure. Example: heating ice melts it, and squeezing a gas under high pressure can turn it into a liquid."], "es": ["¿Qué puede causar un cambio de estado?", "Cambiar la temperatura o la presión. Ejemplo: calentar el hielo lo derrite, y comprimir un gas a alta presión puede convertirlo en líquido."], "ens": "Changing temperature or pressure.", "ess": "Cambiar la temperatura o la presión.", "fig": null}, {"id": "14-25", "std": "3.2.6-8.C", "en": ["Physical property", "A trait you can observe or measure without changing the substance, like density, melting point, or boiling point."], "es": ["Propiedad física", "Una característica que se puede observar o medir sin cambiar la sustancia, como la densidad, el punto de fusión o el punto de ebullición."], "ens": "Trait you can measure without changing the substance.", "ess": "Característica que se mide sin cambiar la sustancia.", "fig": null}, {"id": "14-26", "std": "3.2.6-8.C", "en": ["Chemical property", "A trait that shows how a substance reacts to form new substances, like flammability (ability to burn)."], "es": ["Propiedad química", "Una característica que muestra cómo una sustancia reacciona para formar sustancias nuevas, como la inflamabilidad (capacidad de arder)."], "ens": "How a substance reacts to form new substances.", "ess": "Cómo una sustancia reacciona y forma sustancias nuevas.", "fig": null}, {"id": "14-27", "std": "3.2.6-8.C", "en": ["How can properties identify a substance?", "Each pure substance has its own set of physical and chemical properties, like a fingerprint."], "es": ["¿Cómo pueden las propiedades identificar una sustancia?", "Cada sustancia pura tiene su propio conjunto de propiedades físicas y químicas, como una huella digital."], "ens": "Each substance has its own set of properties.", "ess": "Cada sustancia tiene su propio conjunto de propiedades.", "fig": null}, {"id": "14-28", "std": "3.2.6-8.C", "en": ["Natural resource", "A material from nature that people use, such as oil, plants, minerals, or water."], "es": ["Recurso natural", "Un material de la naturaleza que las personas usan, como el petróleo, las plantas, los minerales o el agua."], "ens": "Material from nature that people use.", "ess": "Material de la naturaleza que usan las personas.", "fig": null}, {"id": "14-29", "std": "3.2.6-8.C", "en": ["Synthetic material", "A material made by people through a chemical process using natural resources. Example: plastic made from oil."], "es": ["Material sintético", "Un material que las personas fabrican mediante un proceso químico a partir de recursos naturales. Ejemplo: el plástico hecho de petróleo."], "ens": "Human-made material from natural resources, like plastic.", "ess": "Material hecho por humanos con recursos naturales, como el plástico.", "fig": null}, {"id": "14-30", "std": "3.2.6-8.C", "en": ["Chemical process", "A process in which atoms of the starting substances regroup into new molecules with different properties."], "es": ["Proceso químico", "Un proceso en el que los átomos de las sustancias iniciales se reorganizan en moléculas nuevas con propiedades diferentes."], "ens": "Atoms regroup to make new substances.", "ess": "Los átomos se reorganizan y forman sustancias nuevas.", "fig": null}, {"id": "14-31", "std": "3.2.6-8.C", "en": ["How do synthetic materials affect society?", "They give us new medicines, foods, and alternative fuels, but making them uses natural resources."], "es": ["¿Cómo afectan los materiales sintéticos a la sociedad?", "Nos dan nuevas medicinas, alimentos y combustibles alternativos, pero fabricarlos usa recursos naturales."], "ens": "New medicines, foods, and fuels; uses resources.", "ess": "Nuevas medicinas, alimentos y combustibles; usan recursos.", "fig": null}]}, {"n": 15, "grade": 8, "u": 5, "color": "#B45309", "ink": "#994607", "glow": "#e1670b", "title": {"en": "Chemical Reactions", "es": "Reacciones químicas"}, "cards": [{"id": "15-1", "std": "3.2.6-8.D", "en": ["Chemical reaction", "A process where substances interact and their atoms regroup to form new substances with different properties."], "es": ["Reacción química", "Un proceso en el que las sustancias interactúan y sus átomos se reorganizan para formar sustancias nuevas con propiedades diferentes."], "ens": "Substances change into new substances.", "ess": "Las sustancias se transforman en sustancias nuevas.", "fig": null}, {"id": "15-2", "std": "3.2.6-8.D", "en": ["Reactant", "A starting substance in a chemical reaction. Example: sugar is a reactant when sugar burns."], "es": ["Reactivo", "Una sustancia inicial en una reacción química. Ejemplo: el azúcar es un reactivo cuando el azúcar se quema."], "ens": "A starting substance in a reaction.", "ess": "Una sustancia inicial en una reacción.", "fig": null}, {"id": "15-3", "std": "3.2.6-8.D", "en": ["How can you tell if a chemical reaction happened?", "Compare properties before and after. If the new substance has different properties, a reaction occurred."], "es": ["¿Cómo sabes si ocurrió una reacción química?", "Compara las propiedades antes y después. Si la sustancia nueva tiene propiedades distintas, ocurrió una reacción."], "ens": "Properties are different after than before.", "ess": "Las propiedades son distintas después que antes.", "fig": null}, {"id": "15-4", "std": "3.2.6-8.D", "en": ["Melting point", "The temperature at which a solid turns into a liquid. Each pure substance has its own melting point."], "es": ["Punto de fusión", "La temperatura a la que un sólido se convierte en líquido. Cada sustancia pura tiene su propio punto de fusión."], "ens": "Temperature where a solid becomes a liquid.", "ess": "Temperatura a la que un sólido se vuelve líquido.", "fig": null}, {"id": "15-5", "std": "3.2.6-8.D", "en": ["Boiling point", "The temperature at which a liquid boils and turns into a gas. Water boils at 100 °C at sea level."], "es": ["Punto de ebullición", "La temperatura a la que un líquido hierve y se convierte en gas. El agua hierve a 100 °C al nivel del mar."], "ens": "Temperature where a liquid boils into a gas.", "ess": "Temperatura a la que un líquido hierve y se vuelve gas.", "fig": null}, {"id": "15-6", "std": "3.2.6-8.D", "en": ["Solubility", "How well a substance dissolves in another, such as in water. Sugar is very soluble in water; sand is not."], "es": ["Solubilidad", "Qué tan bien se disuelve una sustancia en otra, por ejemplo en agua. El azúcar es muy soluble en agua; la arena no."], "ens": "How well something dissolves.", "ess": "Qué tan bien se disuelve algo.", "fig": null}, {"id": "15-7", "std": "3.2.6-8.D", "en": ["Flammability", "How easily a substance burns. Paper and wood are flammable; sand is not."], "es": ["Inflamabilidad", "Qué tan fácilmente arde una sustancia. El papel y la madera son inflamables; la arena no."], "ens": "How easily something burns.", "ess": "Qué tan fácilmente arde algo.", "fig": null}, {"id": "15-8", "std": "3.2.6-8.D", "en": ["Odor", "The smell of a substance. A new odor after substances mix can be evidence of a chemical reaction."], "es": ["Olor", "El aroma de una sustancia. Un olor nuevo después de mezclar sustancias puede ser evidencia de una reacción química."], "ens": "A smell; a new smell can mean a reaction.", "ess": "Un aroma; un olor nuevo puede indicar una reacción.", "fig": null}, {"id": "15-9", "std": "3.2.6-8.D", "en": ["How can density show that a reaction happened?", "Each substance has its own density. If the density after mixing differs from the starting substances, a new substance may have formed."], "es": ["¿Cómo puede la densidad mostrar que ocurrió una reacción?", "Cada sustancia tiene su propia densidad. Si la densidad después de mezclar es distinta a la de las sustancias iniciales, puede haber una sustancia nueva."], "ens": "A new density can mean a new substance.", "ess": "Una densidad nueva puede indicar una sustancia nueva.", "fig": null}, {"id": "15-10", "std": "3.2.6-8.E", "en": ["What happens to atoms in a chemical reaction?", "The atoms in the reactants regroup into different molecules. No atoms are created or destroyed."], "es": ["¿Qué les pasa a los átomos en una reacción química?", "Los átomos de los reactivos se reorganizan en moléculas diferentes. No se crean ni se destruyen átomos."], "ens": "They regroup; none are made or lost.", "ess": "Se reorganizan; no se crean ni se pierden.", "fig": null}, {"id": "15-11", "std": "3.2.6-8.E", "en": ["Does the number of atoms change in a chemical reaction?", "No. The total number of each type of atom is the same before and after the reaction."], "es": ["¿Cambia el número de átomos en una reacción química?", "No. El número total de cada tipo de átomo es el mismo antes y después de la reacción."], "ens": "No; each type of atom stays the same in number.", "ess": "No; cada tipo de átomo se mantiene en número.", "fig": null}, {"id": "15-12", "std": "3.2.6-8.E", "en": ["Law of conservation of matter", "In a chemical reaction, matter is not created or destroyed. Atoms are conserved, so mass stays the same."], "es": ["Ley de conservación de la materia", "En una reacción química, la materia no se crea ni se destruye. Los átomos se conservan, así que la masa no cambia."], "ens": "Matter is not created or destroyed.", "ess": "La materia no se crea ni se destruye.", "fig": null}, {"id": "15-13", "std": "3.2.6-8.E", "en": ["Why does mass stay the same in a chemical reaction?", "Because the same atoms are still there, just rearranged. Same atoms means same mass."], "es": ["¿Por qué la masa no cambia en una reacción química?", "Porque siguen estando los mismos átomos, solo que reorganizados. Los mismos átomos significan la misma masa."], "ens": "Same atoms, just rearranged, so same mass.", "ess": "Los mismos átomos reorganizados, así que la misma masa.", "fig": null}, {"id": "15-14", "std": "3.2.6-8.E", "en": ["If a gas escapes, why might a reaction seem to lose mass?", "The gas atoms leave the container but are not destroyed. In a sealed container, the mass stays the same."], "es": ["Si escapa un gas, ¿por qué parece que una reacción pierde masa?", "Los átomos del gas salen del recipiente, pero no se destruyen. En un recipiente cerrado, la masa no cambia."], "ens": "Gas atoms leave but are not destroyed.", "ess": "Los átomos del gas salen, pero no se destruyen.", "fig": null}, {"id": "15-15", "std": "3.2.6-8.F", "en": ["Do all chemical reactions give off energy?", "No. Some chemical reactions release energy, and others store (absorb) energy."], "es": ["¿Todas las reacciones químicas liberan energía?", "No. Algunas reacciones químicas liberan energía y otras la almacenan (la absorben)."], "ens": "No; some release energy and some store it.", "ess": "No; algunas liberan energía y otras la almacenan.", "fig": null}, {"id": "15-16", "std": "3.2.6-8.F", "en": ["What happens when a chemical process releases thermal energy?", "The surroundings warm up. Dissolving calcium chloride in water makes the water feel hot."], "es": ["¿Qué pasa cuando un proceso químico libera energía térmica?", "Los alrededores se calientan. Disolver cloruro de calcio en agua hace que el agua se sienta caliente."], "ens": "The surroundings get warmer.", "ess": "Los alrededores se calientan.", "fig": null}, {"id": "15-17", "std": "3.2.6-8.F", "en": ["What happens when a chemical process absorbs thermal energy?", "The surroundings cool down. Dissolving ammonium chloride in water makes the water feel cold."], "es": ["¿Qué pasa cuando un proceso químico absorbe energía térmica?", "Los alrededores se enfrían. Disolver cloruro de amonio en agua hace que el agua se sienta fría."], "ens": "The surroundings get colder.", "ess": "Los alrededores se enfrían.", "fig": null}, {"id": "15-18", "std": "3.2.6-8.F", "en": ["Concentration", "How much of a substance is mixed into a certain amount of another, like grams of salt per cup of water."], "es": ["Concentración", "Cuánta cantidad de una sustancia está mezclada en cierta cantidad de otra, como gramos de sal por taza de agua."], "ens": "How much substance is in a set amount of mixture.", "ess": "Cuánta sustancia hay en cierta cantidad de mezcla.", "fig": null}, {"id": "15-19", "std": "3.2.6-8.F", "en": ["How can you change how hot or cold a chemical device gets?", "Change the type of substance or its concentration. More substance can make a bigger temperature change."], "es": ["¿Cómo puedes cambiar cuánto se calienta o enfría un aparato químico?", "Cambia el tipo de sustancia o su concentración. Más sustancia puede producir un cambio de temperatura mayor."], "ens": "Change the substance type or concentration.", "ess": "Cambia el tipo de sustancia o su concentración.", "fig": null}, {"id": "15-20", "std": "3.2.6-8.F", "en": ["What do you measure when testing a hot or cold pack?", "The amount of substance, the time, and the temperature reached."], "es": ["¿Qué mides al probar una compresa fría o caliente?", "La cantidad de sustancia, el tiempo y la temperatura que se alcanza."], "ens": "Amount, time, and temperature.", "ess": "Cantidad, tiempo y temperatura.", "fig": null}, {"id": "15-21", "std": "3.2.6-8.F", "en": ["Why test and modify a design?", "Test results show what works and what doesn't, so you can change the design to improve it."], "es": ["¿Por qué probar y modificar un diseño?", "Los resultados de las pruebas muestran qué funciona y qué no, para que puedas cambiar el diseño y mejorarlo."], "ens": "Tests show how to improve the design.", "ess": "Las pruebas muestran cómo mejorar el diseño.", "fig": null}, {"id": "15-22", "std": "3.2.6-8.F", "en": ["Redesign", "Changing a design based on test results. You can combine the best features from different designs."], "es": ["Rediseño", "Cambiar un diseño según los resultados de las pruebas. Puedes combinar las mejores características de distintos diseños."], "ens": "Changing a design using the test results.", "ess": "Cambiar un diseño según los resultados de las pruebas.", "fig": null}, {"id": "15-23", "std": "3.2.6-8.F", "en": ["Iterative process", "Repeating the cycle of testing and modifying a design again and again to keep improving it."], "es": ["Proceso iterativo", "Repetir una y otra vez el ciclo de probar y modificar un diseño para seguir mejorándolo."], "ens": "Test, change, and repeat to improve.", "ess": "Probar, cambiar y repetir para mejorar.", "fig": null}, {"id": "15-24", "std": "3.2.6-8.F", "en": ["Optimal solution", "The best design possible after many rounds of testing and improving."], "es": ["Solución óptima", "El mejor diseño posible después de muchas rondas de pruebas y mejoras."], "ens": "The best design after testing and improving.", "ess": "El mejor diseño tras probar y mejorar.", "fig": null}]}];
