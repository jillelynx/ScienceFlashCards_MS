:root{--bg:#F4F6F8;--surface:#fff;--ink:#1F2328;--muted:#4f5964;--navy:#1F4E79;--green:#3D6B5A;--line:#D5DCE3;--soft:#EEF3EF;--shadow:0 6px 24px rgba(20,40,60,.12);--u:#1F4E79;--figbg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-hc="1"]){--bg:#11161c;--surface:#1b222a;--ink:#E7ECF1;--muted:#a9b3be;--navy:#8FB8E6;--green:#8CC7AE;--line:#2e3843;--soft:#1f2a26;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-hc="1"]{--bg:#000;--surface:#000;--ink:#fff;--muted:#fff;--navy:#FFE14D;--green:#7CFFB2;--line:#fff;--soft:#000;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.4}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Caladea,Cambria,Georgia,serif;color:var(--navy);margin:0}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
header .k{font-family:Caladea,serif;font-weight:700;color:var(--green);font-size:17px;letter-spacing:.04em}
header h1{font-size:clamp(30px,5vw,40px);line-height:1.1}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{border:1.5px solid var(--navy);background:var(--surface);color:var(--navy);border-radius:999px;padding:9px 18px;font-weight:700;font-size:18px;min-height:44px}
.who{border-style:dashed}
.lang{display:flex;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--navy);padding:9px 20px;font-weight:700;font-size:18px;min-height:44px}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.tipbox{display:flex;gap:14px;align-items:flex-start;background:var(--soft);border:1.5px solid var(--green);border-left:7px solid var(--green);border-radius:12px;padding:14px 18px;margin:0 0 16px}
.tipbox .ti{font-size:30px;line-height:1}
.tipbox b{font-family:Caladea,serif;color:var(--green);font-size:22px}
.tipbox p{margin:6px 0 0;font-size:18px}
.intro{color:var(--muted);margin:0 0 16px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;border:0;border-radius:14px;padding:16px 18px;background:var(--surface);box-shadow:var(--shadow);border-top:8px solid var(--u);color:var(--ink);transition:transform .15s}
button.tile:hover{transform:translateY(-3px)}
.tile .un{font-weight:700;color:var(--ui,var(--u));font-size:15px;letter-spacing:.04em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-hc="1"]) .tile .un{color:var(--ug,var(--u))}}
:root[data-hc="1"] .tile .un,:root[data-hc="1"] .deckname{color:#fff!important}
.tile .tt{font-family:Caladea,serif;font-weight:700;font-size:21px;color:var(--navy);line-height:1.15}
.tile .ct{color:var(--muted);font-size:16px}
.tile.wide{grid-column:1/-1}
.tile.tough{border-top-color:#C99700}
.tile.review{border-top:8px solid transparent;border-image:linear-gradient(90deg,#2E9E5B,#3A6FB0,#7B4FB8,#D9922B,#A23A5A,#1A9FBF) 1;border-radius:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--navy);background:transparent;color:var(--navy);border-radius:999px;padding:8px 16px;font-weight:700;min-height:44px}
.chip.solid{background:var(--navy);color:var(--surface)}
.chip:disabled{opacity:.45;cursor:default}
.chip.quiet{border-color:var(--muted);color:var(--muted)}
.gradebar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.gradebar .est{font-weight:400;font-size:13px;opacity:.85;margin-left:4px}
.estnote{font-size:15px;color:var(--muted);margin:-4px 0 14px}
details.help{margin-top:26px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 18px}
details.help>summary{cursor:pointer;font-family:Caladea,serif;font-weight:700;color:var(--navy);font-size:21px;padding:14px 0;list-style-position:inside}
.help h3{font-size:19px;margin:12px 0 6px}
.help p{margin:4px 0 8px;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.dl a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--navy));border-radius:10px;padding:10px 12px;min-height:44px}
.dl a:hover{border-color:var(--navy)}
footer{margin-top:28px;color:var(--muted);font-size:15px;text-align:center}
.ver{margin:24px 0 10px;color:var(--muted);font-size:11px;text-align:center;opacity:.7}
/* study */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.back{border:0;background:transparent;color:var(--navy);font-weight:700;padding:8px 0;min-height:44px;font-size:18px}
.deckname{font-family:Caladea,serif;font-weight:700;font-size:20px;color:var(--ui,var(--u))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-hc="1"]) .deckname{color:var(--ug,var(--u))}}
.count{color:var(--muted);font-size:16px}
.prog{flex-basis:100%;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog div{height:100%;width:0;background:var(--u);transition:width .3s}
.stdsel{display:flex;justify-content:center;margin:2px 0 8px}
.stdsel select{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:16px}
.stage{perspective:1600px;margin:6px auto 14px;max-width:900px}
.card{position:relative;display:block;width:100%;border:0;padding:0;background:transparent;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.3,1);text-align:center;color:var(--ink)}
.card.flip{transform:rotateY(180deg)}
.card.pop{animation:pop .38s ease-out}
@keyframes pop{0%{transform:scale(.85) translateY(18px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.pop{animation:none}}
.cin{display:grid;height:min(520px,max(400px,72vh));transform-style:preserve-3d}
.face{position:relative;grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.face .tag{display:flex;justify-content:space-between;background:var(--cu);color:#fff;font-weight:700;font-size:17px;padding:10px 20px}
.face .body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:18px 30px}
.face .body::before,.face .body::after{content:"";flex:1 0 0}
.front .term{font-family:Caladea,serif;font-weight:700;color:var(--navy);font-size:clamp(30px,6vw,50px);line-height:1.15}
.front .en{margin-top:14px;font-style:italic;color:var(--muted);font-size:clamp(19px,3.4vw,26px)}
.front .en b{font-style:normal;font-size:13px;background:var(--muted);color:var(--surface);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.face .hint{font-size:16px;color:var(--muted);padding:0 0 10px}
.backf{transform:rotateY(180deg)}
.backf .t2{font-family:Caladea,serif;font-weight:700;color:var(--navy);font-size:21px;margin-bottom:8px}
.backf .ans{font-size:clamp(21px,3.8vw,30px);line-height:1.38;text-align:left;max-width:760px}
.backf .fig{margin-top:12px;max-width:560px;width:100%;background:var(--figbg);border-radius:10px;padding:6px}
.backf .fig svg{width:100%;height:auto;max-height:210px;display:block}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border-radius:12px;padding:14px 24px;font-weight:700;font-size:19px;background:var(--surface);color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.08);border:1.5px solid var(--line);min-height:44px}
.btn.good{background:#2E7D4F;color:#fff;border-color:#2E7D4F}
.btn.again{background:#B3561E;color:#fff;border-color:#B3561E}
.btn:disabled{opacity:.4;cursor:default}
.btn.prev{font-size:15px;padding:8px 14px;align-self:center;box-shadow:none}
.readrow{display:flex;justify-content:center;margin-top:12px}
.btn.speak{font-size:17px;padding:8px 16px;border-radius:10px;background:var(--navy);color:var(--surface);border-color:var(--navy)}
.done{max-width:640px;margin:20px auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:26px;text-align:center}
.done .big{font-size:40px;font-family:Caladea,serif;font-weight:700;color:var(--u)}
/* options dialog */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--surface);color:var(--ink);width:min(460px,100%);height:100%;overflow:auto;padding:18px 22px 30px;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

.panel h3{font-size:18px;margin:18px 0 4px;color:var(--green);text-transform:uppercase;letter-spacing:.05em}
.orow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.olab{font-weight:700;font-size:17px;max-width:62%}
.olab small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.ogrp{display:flex;align-items:center;gap:6px}

.obtn[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.obtn:disabled{opacity:.4}
.oval{min-width:56px;text-align:center;font-weight:700}
.panel select,.panel input{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:17px;min-height:44px}
.keys{font-size:15px;color:var(--muted);margin:6px 0 0;padding-left:18px}
.vrow .ogrp{flex-wrap:wrap}
.vrow select{max-width:230px}
.vtips{margin:4px 0 0;padding:6px 0;border-top:1px solid var(--line)}
.vtips summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:16px;min-height:32px;display:flex;align-items:center}
/* dyslexia-friendly */
html.dys body,html.dys button,html.dys select,html.dys input,html.dys h1,html.dys h2,html.dys h3,html.dys .front .term,html.dys .tile .tt,html.dys .deckname,html.dys .backf .t2,html.dys .tipbox b,html.dys .done .big,html.dys summary{font-family:"LexendEmbed",Verdana,Arial,sans-serif!important}
html.dys body{letter-spacing:.035em;word-spacing:.14em;line-height:1.6}
html.dys .backf .ans{line-height:1.6}
html.dys i,html.dys em,html.dys .front .en{font-style:normal!important}
/* high contrast */
:root[data-hc="1"] .face,:root[data-hc="1"] .tile,:root[data-hc="1"] .tipbox,:root[data-hc="1"] .dl a,:root[data-hc="1"] .done,:root[data-hc="1"] details.help,:root[data-hc="1"] .panel{border:3px solid #fff!important}
:root[data-hc="1"] .face .tag{background:#000!important;border-bottom:3px solid #fff;color:#FFE14D}
:root[data-hc="1"] .btn{background:#000!important;color:#fff!important;border:3px solid #fff!important}
:root[data-hc="1"] .btn.good{color:#7CFFB2!important;border-color:#7CFFB2!important}
:root[data-hc="1"] .btn.again{color:#FFB36B!important;border-color:#FFB36B!important}
:root[data-hc="1"] .btn.speak{color:#FFE14D!important;border-color:#FFE14D!important}
:root[data-hc="1"] .front .term,:root[data-hc="1"] .backf .t2,:root[data-hc="1"] .tile .tt{color:#FFE14D}
:root[data-hc="1"] .front .en b{background:#fff;color:#000}
:root[data-hc="1"] .prog div{background:#FFE14D}
:root[data-hc="1"] :focus-visible{outline:4px solid #FFE14D}
.streak{margin:-6px 0 14px;font-weight:700;color:var(--navy);font-size:18px}
.tile .best{font-size:15px;font-weight:700;color:var(--green)}
.rec{margin:10px auto 6px;padding:12px 16px;border-radius:14px;background:var(--soft);border:1.5px solid var(--green);max-width:460px}
.rec .pct{font-family:Caladea,serif;font-weight:700;font-size:26px;color:var(--navy)}
.rec .pb{font-weight:700;font-size:20px;color:var(--green);margin-top:4px}
.rec .stk{font-size:17px;color:var(--muted);margin-top:4px}
:root[data-hc="1"] .rec{border:3px solid #fff}
[hidden]{display:none!important}
