objects in the solar system?", "From instruments on Earth, telescopes in space, and spacecraft. The data can be numbers, drawings, photographs, and models."], "es": ["¿Cómo obtienen datos los científicos sobre el sistema solar?", "Con instrumentos en la Tierra, telescopios en el espacio y naves espaciales. Los datos pueden ser números, dibujos, fotografías y modelos."], "ens": "From telescopes, spacecraft, and Earth instruments.", "ess": "Con telescopios, naves espaciales e instrumentos en la Tierra.", "fig": null}, {"id": "7-33", "std": "3.3.6-8.C", "en": ["Space-based telescope", "A telescope that orbits in space, above Earth's atmosphere, so it can collect clearer data about distant objects."], "es": ["Telescopio espacial", "Un telescopio que está en órbita en el espacio, por encima de la atmósfera de la Tierra, para obtener datos más claros de objetos lejanos."], "ens": "A telescope in space above the atmosphere.", "ess": "Un telescopio en el espacio, sobre la atmósfera.", "fig": null}, {"id": "7-34", "std": "3.3.6-8.C", "en": ["Spacecraft", "A vehicle sent into space. Spacecraft can travel to other planets and moons to take photos and measurements up close."], "es": ["Nave espacial", "Un vehículo enviado al espacio. Las naves espaciales pueden viajar a otros planetas y lunas para tomar fotos y medidas de cerca."], "ens": "A vehicle sent into space to collect data.", "ess": "Un vehículo enviado al espacio para reunir datos.", "fig": null}, {"id": "7-35", "std": "3.3.6-8.C", "en": ["Why compare data about different solar system objects?", "To find how they are alike and different, such as which planet has thicker layers, bigger volcanoes, or a larger orbit."], "es": ["¿Por qué comparar datos de distintos objetos del sistema solar?", "Para descubrir en qué se parecen y en qué se diferencian, como qué planeta tiene capas más gruesas, volcanes más grandes o una órbita más grande."], "ens": "To see how they are alike and different.", "ess": "Para ver en qué se parecen y en qué se diferencian.", "fig": null}]}, {"n": 8, "grade": 7, "u": 5, "color": "#0F766E", "ink": "#0c645d", "glow": "#129389", "title": {"en": "Earth's Resources and Human Impact", "es": "Recursos de la Tierra e impacto humano"}, "cards": [{"id": "8-1", "std": "3.3.6-8.K", "en": ["Natural resource", "Something from nature that people use, from Earth's land, ocean, atmosphere, or living things. Examples: minerals, fresh water, soil, and forests."], "es": ["Recurso natural", "Algo de la naturaleza que las personas usan, de la tierra, el océano, la atmósfera o los seres vivos. Ejemplos: minerales, agua dulce, suelo y bosques."], "ens": "Something from nature that people use.", "ess": "Algo de la naturaleza que las personas usan.", "fig": null}, {"id": "8-2", "std": "3.3.6-8.K", "en": ["Biosphere", "All the living things on Earth and the places where they live. People get biosphere resources from it, such as food and wood."], "es": ["Biosfera", "Todos los seres vivos de la Tierra y los lugares donde viven. De ella obtenemos recursos como alimentos y madera."], "ens": "All living things on Earth and where they live.", "ess": "Todos los seres vivos de la Tierra y donde viven.", "fig": null}, {"id": "8-3", "std": "3.3.6-8.K", "en": ["Nonrenewable resource", "A natural resource that cannot be replaced within a human lifetime once it is used up. Examples: petroleum and metal ores."], "es": ["Recurso no renovable", "Un recurso natural que no se puede reponer durante la vida de una persona una vez que se agota. Ejemplos: el petróleo y las menas metálicas."], "ens": "A resource that can't be replaced quickly.", "ess": "Un recurso que no se puede reponer pronto.", "fig": null}, {"id": "8-4", "std": "3.3.6-8.K", "en": ["Renewable resource", "A natural resource that can be replaced by nature within a human lifetime if it is used carefully. Example: trees that are replanted."], "es": ["Recurso renovable", "Un recurso natural que la naturaleza puede reponer durante la vida de una persona si se usa con cuidado. Ejemplo: árboles que se vuelven a plantar."], "ens": "A resource nature can replace in our lifetime.", "ess": "Un recurso que la naturaleza puede reponer en nuestra vida.", "fig": null}, {"id": "8-5", "std": "3.3.6-8.K", "en": ["Why are many natural resources limited?", "Earth has only so much of them, and many form far slower than people use them. Minerals, fresh water, and biosphere resources are all limited."], "es": ["¿Por qué muchos recursos naturales son limitados?", "La Tierra solo tiene cierta cantidad, y muchos se forman mucho más despacio de lo que los usamos. Los minerales, el agua dulce y los recursos de la biosfera son limitados."], "ens": "Earth has only so much, and they form slowly.", "ess": "La Tierra tiene poca cantidad y se forman despacio.", "fig": null}, {"id": "8-6", "std": "3.3.6-8.K", "en": ["Energy resource", "A natural resource people use to get energy. Example: petroleum (oil) found underground."], "es": ["Recurso energético", "Un recurso natural que las personas usan para obtener energía. Ejemplo: el petróleo que se encuentra bajo la tierra."], "ens": "A resource used to get energy, like oil.", "ess": "Un recurso que se usa para obtener energía, como el petróleo.", "fig": null}, {"id": "8-7", "std": "3.3.6-8.K", "en": ["Groundwater", "Fresh water stored underground in the spaces in soil and rock. People pump it up from wells to use."], "es": ["Agua subterránea", "Agua dulce guardada bajo tierra en los espacios del suelo y las rocas. Las personas la sacan con pozos para usarla."], "ens": "Fresh water stored underground.", "ess": "Agua dulce guardada bajo tierra.", "fig": null}, {"id": "8-8", "std": "3.3.6-8.K", "en": ["Aquifer", "An underground layer of rock or sediment that holds groundwater. People withdraw water from aquifers using wells."], "es": ["Acuífero", "Una capa subterránea de roca o sedimento que contiene agua subterránea. Las personas sacan agua de los acuíferos con pozos."], "ens": "Underground rock layer that holds water.", "ess": "Capa de roca bajo tierra que guarda agua.", "fig": null}, {"id": "8-9", "std": "3.3.6-8.K", "en": ["Why are Earth's resources found in some places but not others?", "Because of past and current geologic processes. Resources form only where the right conditions happened, so they are spread unevenly around Earth."], "es": ["¿Por qué hay recursos en unos lugares de la Tierra y no en otros?", "Por procesos geológicos pasados y actuales. Los recursos se forman solo donde se dieron las condiciones adecuadas, así que están repartidos de forma desigual."], "ens": "Geologic processes formed them only in some places.", "ess": "Los procesos geológicos los formaron solo en algunos lugares.", "fig": null}, {"id": "8-10", "std": "3.3.6-8.K", "en": ["Petroleum", "Oil formed from the remains of ocean life buried in sediment long ago. It is found where rock layers trapped it underground."], "es": ["Petróleo", "Combustible líquido que se formó de restos de seres marinos enterrados en sedimentos hace mucho tiempo. Se encuentra donde las capas de roca lo atraparon bajo tierra."], "ens": "Oil formed from buried ancient ocean life.", "ess": "Combustible formado de seres marinos antiguos enterrados.", "fig": null}, {"id": "8-11", "std": "3.3.6-8.K", "en": ["Metal ore", "Rock that contains enough metal to be worth mining. Many ores are found where hot water and volcanoes were active long ago near subduction zones."], "es": ["Mena metálica", "Roca que contiene suficiente metal para que valga la pena extraerlo. Muchas menas están donde hace mucho hubo actividad volcánica y de agua caliente cerca de zonas de subducción."], "ens": "Rock with enough metal to mine.", "ess": "Roca con suficiente metal para extraerlo.", "fig": null}, {"id": "8-12", "std": "3.3.6-8.K", "en": ["Subduction zone", "A place where one tectonic plate sinks under another. Volcanoes and hot water there can leave behind metal ores in the rock."], "es": ["Zona de subducción", "Un lugar donde una placa tectónica se hunde debajo de otra. Los volcanes y el agua caliente allí pueden dejar menas metálicas en la roca."], "ens": "Where one plate sinks under another plate.", "ess": "Donde una placa tectónica se hunde debajo de otra.", "fig": null}, {"id": "8-13", "std": "3.3.6-8.K", "en": ["Soil", "A mix of weathered rock bits, minerals, and decayed living matter. It forms where rock is actively weathered or where sediment is deposited."], "es": ["Suelo", "Una mezcla de pedacitos de roca meteorizada, minerales y materia de seres vivos descompuesta. Se forma donde la roca se meteoriza o donde se depositan sedimentos."], "ens": "Mix of rock bits and decayed living matter.", "ess": "Mezcla de pedacitos de roca y materia descompuesta.", "fig": null}, {"id": "8-14", "std": "3.3.6-8.K", "en": ["How are humans changing where resources are found?", "By removing them. As people mine, drill, and pump resources, the amounts left and where they are found change a lot."], "es": ["¿Cómo cambian los seres humanos dónde se encuentran los recursos?", "Al sacarlos. Cuando las personas extraen minerales, perforan pozos y bombean agua, cambian mucho las cantidades que quedan y dónde se encuentran."], "ens": "People remove them by mining, drilling, and pumping.", "ess": "Las personas los sacan con minas, perforaciones y bombas.", "fig": null}, {"id": "8-15", "std": "3.3.6-8.M", "en": ["Human impact", "A change that people cause in the environment. Examples: using water, building on land, and causing pollution."], "es": ["Impacto humano", "Un cambio que las personas causan en el medio ambiente. Ejemplos: usar agua, construir en la tierra y causar contaminación."], "ens": "A change people cause in the environment.", "ess": "Un cambio que las personas causan en el medio ambiente.", "fig": null}, {"id": "8-16", "std": "3.3.6-8.M", "en": ["Habitat", "The natural home of a living thing, where it finds food, water, and shelter. Human activities can damage or destroy habitats."], "es": ["Hábitat", "El hogar natural de un ser vivo, donde encuentra alimento, agua y refugio. Las actividades humanas pueden dañar o destruir los hábitats."], "ens": "The natural home of a living thing.", "ess": "El hogar natural de un ser vivo.", "fig": null}, {"id": "8-17", "std": "3.3.6-8.M", "en": ["Extinction", "When every member of a species has died out. Human activities, such as destroying habitats, have caused the extinction of some species."], "es": ["Extinción", "Cuando todos los miembros de una especie han muerto. Las actividades humanas, como destruir hábitats, han causado la extinción de algunas especies."], "ens": "When a species dies out completely.", "ess": "Cuando una especie desaparece por completo.", "fig": null}, {"id": "8-18", "std": "3.3.6-8.M", "en": ["Pollution", "Harmful materials added to the air, water, or land. Example: smoke from factories polluting the air."], "es": ["Contaminación", "Materiales dañinos que se agregan al aire, el agua o la tierra. Ejemplo: el humo de las fábricas que contamina el aire."], "ens": "Harmful stuff added to air, water, or land.", "ess": "Cosas dañinas que se agregan al aire, agua o tierra.", "fig": null}, {"id": "8-19", "std": "3.3.6-8.M", "en": ["How can people's water use affect the environment?", "Taking water from streams and aquifers, or building dams and levees, changes how water flows and how much is left for living things."], "es": ["¿Cómo puede afectar al medio ambiente el uso del agua?", "Sacar agua de arroyos y acuíferos, o construir represas y diques, cambia cómo fluye el agua y cuánta queda para los seres vivos."], "ens": "It changes water flow and how much is left.", "ess": "Cambia cómo fluye el agua y cuánta queda.", "fig": null}, {"id": "8-20", "std": "3.3.6-8.M", "en": ["Dam", "A wall built across a river or stream to hold back water. Dams store water but change the river and its habitats."], "es": ["Represa", "Un muro construido a través de un río o arroyo para retener el agua. Las represas guardan agua pero cambian el río y sus hábitats."], "ens": "A wall across a river that holds back water.", "ess": "Un muro en un río que retiene el agua.", "fig": null}, {"id": "8-21", "std": "3.3.6-8.M", "en": ["Levee", "A raised wall of earth built along a river to keep it from flooding nearby land."], "es": ["Dique", "Un muro de tierra elevado construido a lo largo de un río para evitar que inunde las tierras cercanas."], "ens": "A raised bank that keeps a river from flooding.", "ess": "Un muro de tierra que evita que un río inunde.", "fig": null}, {"id": "8-22", "std": "3.3.6-8.M", "en": ["How can people's land use affect the environment?", "Building cities, farming, and removing wetlands replace natural habitats and change how water and soil move."], "es": ["¿Cómo puede afectar al medio ambiente el uso de la tierra?", "Construir ciudades, cultivar y eliminar humedales reemplazan los hábitats naturales y cambian cómo se mueven el agua y el suelo."], "ens": "It replaces natural habitats.", "ess": "Reemplaza los hábitats naturales.", "fig": null}, {"id": "8-23", "std": "3.3.6-8.M", "en": ["Urban development", "Building and growing cities and towns, with roads, buildings, and parking lots. It is one kind of human land use."], "es": ["Desarrollo urbano", "Construir y hacer crecer ciudades y pueblos, con calles, edificios y estacionamientos. Es un tipo de uso humano de la tierra."], "ens": "Building and growing cities and towns.", "ess": "Construir y hacer crecer ciudades y pueblos.", "fig": null}, {"id": "8-24", "std": "3.3.6-8.M", "en": ["Are changes to the environment always bad for living things?", "No. A change can hurt some living things and help others. Example: a new lake from a dam helps some fish but floods land animals' homes."], "es": ["¿Los cambios ambientales siempre son malos para los seres vivos?", "No. Un cambio puede perjudicar a algunos seres vivos y ayudar a otros. Ejemplo: un lago nuevo por una represa ayuda a algunos peces pero inunda los hogares de animales terrestres."], "ens": "No. Changes can help some and hurt others.", "ess": "No. Los cambios pueden ayudar a unos y perjudicar a otros.", "fig": null}, {"id": "8-25", "std": "3.3.6-8.M", "en": ["How can people monitor and reduce their impact on the environment?", "Examine the impact, measure it over time, then design and test solutions that could reduce it, checking which ones are possible to do."], "es": ["¿Cómo podemos vigilar y reducir nuestro impacto en el ambiente?", "Examinar el impacto, medirlo con el tiempo y luego diseñar y probar soluciones que puedan reducirlo, revisando cuáles se pueden realizar."], "ens": "Measure the impact, then design and test solutions.", "ess": "Medir el impacto y luego diseñar y probar soluciones.", "fig": null}, {"id": "8-26", "std": "3.3.6-8.N", "en": ["Human population growth", "An increase in the number of people living on Earth or in an area. More people usually means more natural resources are used."], "es": ["Crecimiento de la población humana", "Un aumento en el número de personas que viven en la Tierra o en un área. Más personas por lo general significa que se usan más recursos naturales."], "ens": "More people living on Earth or in an area.", "ess": "Más personas viviendo en la Tierra o en un área.", "fig": null}, {"id": "8-27", "std": "3.3.6-8.N", "en": ["Consumption (of natural resources)", "Using up natural resources, such as fresh water, minerals, energy, and food."], "es": ["Consumo (de recursos naturales)", "Gastar recursos naturales, como agua dulce, minerales, energía y alimentos."], "ens": "Using up natural resources.", "ess": "Gastar recursos naturales.", "fig": null}, {"id": "8-28", "std": "3.3.6-8.N", "en": ["Per capita consumption", "The amount of a resource used per person. Example: total water used in a town divided by the number of people who live there."], "es": ["Consumo per cápita", "La cantidad de un recurso que usa cada persona. Ejemplo: el agua total que usa un pueblo dividida entre el número de personas que viven allí."], "ens": "How much of a resource each person uses.", "ess": "Cuánto de un recurso usa cada persona.", "fig": null}, {"id": "8-29", "std": "3.3.6-8.N", "en": ["What happens when population and per capita consumption go up?", "Negative impacts on Earth usually increase, unless the activities and technologies involved are engineered to reduce them."], "es": ["¿Qué pasa cuando aumentan la población y el consumo per cápita?", "Por lo general aumentan los impactos negativos en la Tierra, a menos que las actividades y tecnologías se diseñen para reducirlos."], "ens": "Harm to Earth usually increases.", "ess": "El daño a la Tierra por lo general aumenta.", "fig": null}, {"id": "8-30", "std": "3.3.6-8.N", "en": ["How can more people using more resources change Earth's systems?", "It can change how Earth's systems look, what they are made of, and how their parts are arranged, and it can speed up how fast they change."], "es": ["¿Cómo cambian los sistemas de la Tierra si más gente usa más recursos?", "Puede cambiar cómo se ven los sistemas de la Tierra, de qué están hechos y cómo están organizadas sus partes, y puede acelerar la rapidez con que cambian."], "ens": "It changes their look, makeup, and rate of change.", "ess": "Cambia su aspecto, su composición y su rapidez de cambio.", "fig": null}, {"id": "8-31", "std": "3.3.6-8.N", "en": ["Does science decide what society should do about human impacts?", "No. Science describes the effects of more people and more resource use, but society makes the decisions about what actions to take."], "es": ["¿La ciencia decide qué debe hacer la sociedad ante el impacto humano?", "No. La ciencia describe los efectos de tener más personas y usar más recursos, pero la sociedad toma las decisiones sobre qué acciones tomar."], "ens": "No. Science describes; society decides.", "ess": "No. La ciencia describe; la sociedad decide.", "fig": null}]}, {"n": 16, "grade": 7, "u": 6, "color": "#3F7D20", "ink": "#356a1b", "glow": "#4e9c28", "title": {"en": "Environmental Literacy and Sustainability", "es": "Educación ambiental y sostenibilidad"}, "cards": [{"id": "16-1", "std": "3.4.6-8.A", "en": ["Agriculture", "Farming: growing crops and raising animals for food, fiber, and energy. It is also a major way people use land."], "es": ["Agricultura", "La labranza: cultivar plantas y criar animales para obtener alimentos, fibras y energía. También es una forma importante en que las personas usan la tierra."], "ens": "Growing crops and raising animals.", "ess": "Cultivar plantas y criar animales.", "fig": null}, {"id": "16-2", "std": "3.4.6-8.A", "en": ["Food system", "All the steps that get food to people: producing it on farms, processing it, moving and selling it, eating it, and handling the waste."], "es": ["Sistema alimentario", "Todos los pasos para que los alimentos lleguen a las personas: producirlos en granjas, procesarlos, transportarlos y venderlos, comerlos y manejar los desechos."], "ens": "All the steps that bring food to people.", "ess": "Todos los pasos que llevan los alimentos a las personas.", "fig": null}, {"id": "16-3", "std": "3.4.6-8.A", "en": ["Fiber (agricultural product)", "Plant or animal material made into products like cloth. Examples: cotton from plants and wool from sheep."], "es": ["Fibra (producto agrícola)", "Material de plantas o animales que se convierte en productos como la tela. Ejemplos: el algodón de las plantas y la lana de las ovejas."], "ens": "Farm material made into cloth, like cotton.", "ess": "Material de granja que se hace tela, como el algodón.", "fig": null}, {"id": "16-4", "std": "3.4.6-8.A", "en": ["Processing (food and fiber)", "Changing raw farm products into things people use. Examples: grinding wheat into flour or spinning cotton into thread."], "es": ["Procesamiento (de alimentos y fibras)", "Transformar productos agrícolas en cosas que las personas usan. Ejemplos: moler trigo para hacer harina o hilar algodón para hacer hilo."], "ens": "Turning farm products into things people use.", "ess": "Convertir productos de granja en cosas que usamos.", "fig": null}, {"id": "16-5", "std": "3.4.6-8.A", "en": ["Inputs (in a system)", "What goes into a system. On a farm, inputs include water, soil, energy, seeds, and fertilizer."], "es": ["Entradas (en un sistema)", "Lo que entra en un sistema. En una granja, las entradas incluyen agua, suelo, energía, semillas y fertilizante."], "ens": "What goes into a system.", "ess": "Lo que entra en un sistema.", "fig": null}, {"id": "16-6", "std": "3.4.6-8.A", "en": ["Outputs (in a system)", "What comes out of a system. On a farm, outputs include food, fiber, and waste."], "es": ["Salidas (en un sistema)", "Lo que sale de un sistema. En una granja, las salidas incluyen alimentos, fibras y desechos."], "ens": "What comes out of a system.", "ess": "Lo que sale de un sistema.", "fig": null}, {"id": "16-7", "std": "3.4.6-8.A", "en": ["Life cycle of a product", "All the stages of a product from start to finish. Example for a T-shirt: grow cotton, make cloth, sew, use it, then throw away or recycle."], "es": ["Ciclo de vida de un producto", "Todas las etapas de un producto de principio a fin. Ejemplo de una camiseta: cultivar algodón, hacer tela, coserla, usarla y luego desecharla o reciclarla."], "ens": "All the stages of a product, start to finish.", "ess": "Todas las etapas de un producto, de principio a fin.", "fig": null}, {"id": "16-8", "std": "3.4.6-8.A", "en": ["Sustainability", "Using natural resources in a way that meets people's needs now while leaving enough for the future."], "es": ["Sostenibilidad", "Usar los recursos naturales de manera que se cubran las necesidades de hoy y quede suficiente para el futuro."], "ens": "Meeting needs now and saving resources for later.", "ess": "Cubrir las necesidades de hoy y guardar recursos para el futuro.", "fig": null}, {"id": "16-9", "std": "3.4.6-8.B", "en": ["Society", "A large group of people who live together and share economic and social systems. Example: a country."], "es": ["Sociedad", "Un grupo grande de personas que viven juntas y comparten sistemas económicos y sociales. Ejemplo: un país."], "ens": "A large group of people living together.", "ess": "Un grupo grande de personas que viven juntas.", "fig": null}, {"id": "16-10", "std": "3.4.6-8.B", "en": ["Culture", "The shared beliefs, customs, and ways of life of a group of people. Culture can affect how people use and care for natural resources."], "es": ["Cultura", "Las creencias, costumbres y formas de vida que comparte un grupo de personas. La cultura puede influir en cómo se usan y cuidan los recursos naturales."], "ens": "A group's shared beliefs and ways of life.", "ess": "Las creencias y formas de vida de un grupo.", "fig": null}, {"id": "16-11", "std": "3.4.6-8.B", "en": ["Economic system", "The way a society makes, buys, sells, and shares goods and services. It affects how natural resources are used."], "es": ["Sistema económico", "La forma en que una sociedad produce, compra, vende y reparte bienes y servicios. Influye en cómo se usan los recursos naturales."], "ens": "How a society makes and trades goods.", "ess": "Cómo una sociedad produce e intercambia bienes.", "fig": null}, {"id": "16-12", "std": "3.4.6-8.B", "en": ["Social system", "The way people in a society are organized and interact, including their rules, groups, and traditions."], "es": ["Sistema social", "La forma en que las personas de una sociedad se organizan y se relacionan, incluidas sus reglas, grupos y tradiciones."], "ens": "How people in a society are organized.", "ess": "Cómo se organizan las personas de una sociedad.", "fig": null}, {"id": "16-13", "std": "3.4.6-8.B", "en": ["Recycling", "Collecting used materials, like paper, metal, and plastic, so they can be made into new products instead of thrown away."], "es": ["Reciclaje", "Recoger materiales usados, como papel, metal y plástico, para convertirlos en productos nuevos en lugar de tirarlos."], "ens": "Turning used materials into new products.", "ess": "Convertir materiales usados en productos nuevos.", "fig": null}, {"id": "16-14", "std": "3.4.6-8.B", "en": ["Waste management", "How a community collects, moves, and gets rid of or reuses its trash, such as by landfills or recycling."], "es": ["Manejo de residuos", "Cómo una comunidad recoge, transporta y elimina o reutiliza su basura, por ejemplo con rellenos sanitarios o reciclaje."], "ens": "How a community handles its trash.", "ess": "Cómo una comunidad maneja su basura.", "fig": null}, {"id": "16-15", "std": "3.4.6-8.B", "en": ["Land development", "Changing natural land for human use, such as building homes, roads, or businesses."], "es": ["Desarrollo del terreno", "Cambiar la tierra natural para el uso humano, como construir casas, carreteras o negocios."], "ens": "Changing natural land for people to use.", "ess": "Cambiar la tierra natural para el uso humano.", "fig": null}, {"id": "16-16", "std": "3.4.6-8.B", "en": ["Why do societies use and manage natural resources differently?", "Their economic and social systems and cultures differ. Comparing data from two or more societies shows differences in farming, recycling, or fuel use."], "es": ["¿Por qué cada sociedad maneja los recursos naturales de otra forma?", "Sus sistemas económicos y sociales y sus culturas son distintos. Comparar datos de dos o más sociedades muestra diferencias en la agricultura, el reciclaje o el uso de combustibles."], "ens": "Their economies, social systems, and cultures differ.", "ess": "Sus economías, sistemas sociales y culturas son distintos.", "fig": null}, {"id": "16-17", "std": "3.4.6-8.D", "en": ["Sediment load", "The amount of soil and sediment carried by a stream or river. Too much makes water muddy and can bury habitats, a problem in many PA waterways."], "es": ["Carga de sedimentos", "La cantidad de suelo y sedimentos que lleva un arroyo o río. Demasiada carga enturbia el agua y puede enterrar hábitats, un problema en muchas aguas de PA."], "ens": "The amount of sediment a stream carries.", "ess": "La cantidad de sedimento que lleva un arroyo.", "fig": null}, {"id": "16-18", "std": "3.4.6-8.D", "en": ["Nutrient load", "The amount of nutrients, such as from fertilizer, washed into a waterway. Too many nutrients can harm the living things in streams and rivers."], "es": ["Carga de nutrientes", "La cantidad de nutrientes, por ejemplo de fertilizantes, que llegan a un cuerpo de agua. Demasiados nutrientes pueden dañar a los seres vivos de arroyos y ríos."], "ens": "The amount of nutrients washed into water.", "ess": "La cantidad de nutrientes que llegan al agua.", "fig": null}, {"id": "16-19", "std": "3.4.6-8.D", "en": ["Air quality", "How clean or polluted the air is, indoors or outdoors. Poor air quality can harm people's health and other living things."], "es": ["Calidad del aire", "Qué tan limpio o contaminado está el aire, adentro o afuera. La mala calidad del aire puede dañar la salud de las personas y de otros seres vivos."], "ens": "How clean or polluted the air is.", "ess": "Qué tan limpio o contaminado está el aire.", "fig": null}, {"id": "16-20", "std": "3.4.6-8.D", "en": ["Urban heat island", "A city area that is hotter than the land around it because pavement and buildings soak up heat and there are fewer trees."], "es": ["Isla de calor urbana", "Una zona de una ciudad que es más caliente que sus alrededores porque el pavimento y los edificios absorben calor y hay menos árboles."], "ens": "A city area hotter than places around it.", "ess": "Zona de ciudad más caliente que sus alrededores.", "fig": null}, {"id": "16-21", "std": "3.4.6-8.D", "en": ["Why are ecosystems called dynamic?", "Because they are always changing. Their characteristics can vary over time, and a disruption to one part can shift all of its populations."], "es": ["¿Por qué se dice que los ecosistemas son dinámicos?", "Porque siempre están cambiando. Sus características pueden variar con el tiempo, y una alteración en una parte puede cambiar todas sus poblaciones."], "ens": "They are always changing over time.", "ess": "Siempre están cambiando con el tiempo.", "fig": null}, {"id": "16-22", "std": "3.4.6-8.D", "en": ["How can a PA environmental issue affect people and nature?", "It can affect both human and natural systems. Example: extra sediment in a stream harms fish and can make drinking water harder to clean."], "es": ["¿Cómo afecta un problema ambiental de PA a la gente y la naturaleza?", "Puede afectar tanto a los sistemas humanos como a los naturales. Ejemplo: el exceso de sedimento en un arroyo daña a los peces y hace más difícil limpiar el agua potable."], "ens": "It affects both people and nature.", "ess": "Afecta tanto a las personas como a la naturaleza.", "fig": null}, {"id": "16-23", "std": "3.4.6-8.D", "en": ["Why gather information from multiple sources?", "Different sources give different facts and views. Putting them together (synthesizing) gives a fuller, more reliable picture of an issue."], "es": ["¿Por qué reunir información de varias fuentes?", "Distintas fuentes dan distintos datos y puntos de vista. Juntarlos (sintetizar) da una idea más completa y confiable de un problema."], "ens": "Combining sources gives a fuller picture.", "ess": "Combinar fuentes da una idea más completa.", "fig": null}, {"id": "16-24", "std": "3.4.6-8.E", "en": ["Environmental data", "Measurements and observations about an environment. Examples: weather data, stream studies, air quality readings, and biodiversity counts."], "es": ["Datos ambientales", "Medidas y observaciones sobre un medio ambiente. Ejemplos: datos del tiempo atmosférico, estudios de arroyos, medidas de calidad del aire y conteos de biodiversidad."], "ens": "Measurements and observations about an environment.", "ess": "Medidas y observaciones sobre un medio ambiente.", "fig": null}, {"id": "16-25", "std": "3.4.6-8.E", "en": ["Stream study", "An investigation where students collect data at a stream, such as water temperature, clarity, and the living things found there."], "es": ["Estudio de arroyo", "Una investigación en la que los estudiantes reúnen datos en un arroyo, como la temperatura y la claridad del agua y los seres vivos que hay allí."], "ens": "Collecting data about a stream.", "ess": "Reunir datos sobre un arroyo.", "fig": null}, {"id": "16-26", "std": "3.4.6-8.E", "en": ["Biodiversity assessment", "A study that counts and identifies the different kinds of living things in an area to measure its biodiversity."], "es": ["Evaluación de la biodiversidad", "Un estudio que cuenta e identifica los distintos tipos de seres vivos de un área para medir su biodiversidad."], "ens": "Counting the kinds of living things in an area.", "ess": "Contar los tipos de seres vivos de un área.", "fig": null}, {"id": "16-27", "std": "3.4.6-8.E", "en": ["Why collect data to describe a local environment?", "Measuring and observing an outdoor area lets you describe it accurately with evidence instead of guesses."], "es": ["¿Por qué reunir datos para describir un medio ambiente local?", "Medir y observar un área al aire libre te permite describirla con precisión usando evidencia en vez de suposiciones."], "ens": "To describe it accurately with evidence.", "ess": "Para describirlo con precisión usando evidencia.", "fig": null}, {"id": "16-28", "std": "3.4.6-8.E", "en": ["What do organisms depend on in their environment?", "On interactions with other living things and with nonliving factors, such as water, sunlight, and temperature."], "es": ["¿De qué dependen los organismos en su medio ambiente?", "De sus interacciones con otros seres vivos y con factores sin vida, como el agua, la luz del sol y la temperatura."], "ens": "Other living things and nonliving factors.", "ess": "De otros seres vivos y de factores sin vida.", "fig": null}, {"id": "16-29", "std": "3.4.6-8.E", "en": ["What influences the weather and climate of a place?", "Interactions among sunlight, ocean, atmosphere, ice, landforms, and living things. Latitude, altitude, and local geography also matter."], "es": ["¿Qué influye en el tiempo atmosférico y el clima de un lugar?", "Las interacciones entre la luz del sol, el océano, la atmósfera, el hielo, las formas del terreno y los seres vivos. También importan la latitud, la altitud y la geografía local."], "ens": "Sunlight, ocean, air, land, latitude, and altitude.", "ess": "Luz del sol, océano, aire, terreno, latitud y altitud.", "fig": null}, {"id": "16-30", "std": "3.4.6-8.F", "en": ["Pest", "A living thing that causes problems for people, crops, or buildings. Examples: insects that eat crops or mice in a school."], "es": ["Plaga", "Un ser vivo que causa problemas a las personas, los cultivos o los edificios. Ejemplos: insectos que se comen los cultivos o ratones en una escuela."], "ens": "A living thing that causes problems.", "ess": "Un ser vivo que causa problemas.", "fig": null}, {"id": "16-31", "std": "3.4.6-8.F", "en": ["Invasive species", "A species brought to a new area where it spreads quickly and causes harm, often crowding out native living things."], "es": ["Especie invasora", "Una especie llevada a un área nueva donde se extiende rápido y causa daño, muchas veces desplazando a los seres vivos nativos."], "ens": "A harmful species spreading in a new area.", "ess": "Una especie dañina que se extiende en un área nueva.", "fig": null}, {"id": "16-32", "std": "3.4.6-8.F", "en": ["Integrated pest management (IPM)", "Controlling pests by combining several methods (biological, cultural, mechanical, chemical) to protect people and the environment."], "es": ["Manejo integrado de plagas (MIP)", "Controlar las plagas combinando varios métodos (biológicos, culturales, mecánicos y químicos) para proteger a las personas y el medio ambiente."], "ens": "Using several methods together to control pests.", "ess": "Usar varios métodos juntos para controlar plagas.", "fig": null}, {"id": "16-33", "std": "3.4.6-8.F", "en": ["Biological methods (IPM)", "Using living things or natural conditions to control pests. Examples: ladybugs that eat aphids, or managing indoor air quality so pests and mold can't thrive."], "es": ["Métodos biológicos (MIP)", "Usar seres vivos o condiciones naturales para controlar las plagas. Ejemplos: mariquitas que comen pulgones, o manejar la calidad del aire en interiores para que las plagas y el moho no prosperen."], "ens": "Using living things and natural conditions.", "ess": "Usar seres vivos y condiciones naturales.", "fig": null}, {"id": "16-34", "std": "3.4.6-8.F", "en": ["Cultural methods (IPM)", "Changing how people grow crops to prevent pests. Examples: planting crops that resist local pests, or crop rotation."], "es": ["Métodos culturales (MIP)", "Cambiar la forma de cultivar para evitar las plagas. Ejemplos: sembrar cultivos que resisten las plagas locales o rotar los cultivos."], "ens": "Changing farming practices to prevent pests.", "ess": "Cambiar la forma de cultivar para evitar plagas.", "fig": null}, {"id": "16-35", "std": "3.4.6-8.F", "en": ["Crop rotation", "Planting different crops in the same field in different seasons or years. It breaks up pests' food supply."], "es": ["Rotación de cultivos", "Sembrar distintos cultivos en el mismo campo en diferentes temporadas o años. Así se interrumpe el alimento de las plagas."], "ens": "Changing which crop grows in a field.", "ess": "Cambiar el cultivo que se siembra en un campo.", "fig": null}, {"id": "16-36", "std": "3.4.6-8.F", "en": ["Mechanical methods (IPM)", "Physically removing or blocking pests. Example: trapping pests."], "es": ["Métodos mecánicos (MIP)", "Sacar o bloquear las plagas físicamente. Ejemplo: atrapar las plagas con trampas."], "ens": "Physically removing pests, like with traps.", "ess": "Sacar plagas físicamente, como con trampas.", "fig": null}, {"id": "16-37", "std": "3.4.6-8.F", "en": ["Chemical methods (IPM)", "Using chemical products to control pests. Example: cleaning surfaces in schools."], "es": ["Métodos químicos (MIP)", "Usar productos químicos para controlar las plagas. Ejemplo: limpiar superficies en las escuelas."], "ens": "Using chemical products to control pests.", "ess": "Usar productos químicos para controlar plagas.", "fig": null}, {"id": "16-38", "std": "3.4.6-8.F", "en": ["How can IPM improve indoor and outdoor environments?", "It controls pests and invasive species while keeping schools' surfaces and air clean and helping maintain biodiversity."], "es": ["¿Cómo puede el MIP mejorar los ambientes interiores y exteriores?", "Controla las plagas y las especies invasoras, a la vez que mantiene limpias las superficies y el aire de las escuelas y ayuda a conservar la biodiversidad."], "ens": "Controls pests and helps keep biodiversity.", "ess": "Controla plagas y ayuda a conservar la biodiversidad.", "fig": null}, {"id": "16-39", "std": "3.4.6-8.G", "en": ["Best management practices (BMPs)", "Proven ways of managing resources to protect the environment. They cover stormwater, forests, land use, wildlife, and waste."], "es": ["Mejores prácticas de manejo", "Formas comprobadas de manejar los recursos para proteger el medio ambiente. Incluyen el manejo de aguas pluviales, bosques, uso de la tierra, vida silvestre y residuos."], "ens": "Proven ways to manage resources and protect nature.", "ess": "Formas comprobadas de manejar recursos y proteger la naturaleza.", "fig": null}, {"id": "16-40", "std": "3.4.6-8.G", "en": ["Stormwater", "Rain or melted snow that runs off roofs, roads, and parking lots instead of soaking into the ground. It can carry pollution into streams."], "es": ["Aguas pluviales", "Lluvia o nieve derretida que corre por techos, calles y estacionamientos en vez de filtrarse en el suelo. Puede llevar contaminación a los arroyos."], "ens": "Rainwater running off hard surfaces.", "ess": "Agua de lluvia que corre por superficies duras.", "fig": null}, {"id": "16-41", "std": "3.4.6-8.G", "en": ["Stormwater management", "Ways to slow down, soak up, or clean stormwater so it causes less flooding and pollution. Example: a rain garden."], "es": ["Manejo de aguas pluviales", "Formas de frenar, absorber o limpiar las aguas pluviales para que causen menos inundaciones y contaminación. Ejemplo: un jardín de lluvia."], "ens": "Controlling rainwater to reduce floods and pollution.", "ess": "Controlar el agua de lluvia para reducir inundaciones y contaminación.", "fig": null}, {"id": "16-42", "std": "3.4.6-8.G", "en": ["Forest management", "Caring for forests so they stay healthy and keep providing wood, habitats, and clean water. Example: replanting trees after cutting."], "es": ["Manejo forestal", "Cuidar los bosques para que sigan sanos y den madera, hábitats y agua limpia. Ejemplo: volver a plantar árboles después de cortarlos."], "ens": "Caring for forests to keep them healthy.", "ess": "Cuidar los bosques para que sigan sanos.", "fig": null}, {"id": "16-43", "std": "3.4.6-8.G", "en": ["Wildlife management", "Caring for wild animal populations and their habitats so they stay healthy. Example: setting hunting and fishing limits."], "es": ["Manejo de la vida silvestre", "Cuidar las poblaciones de animales silvestres y sus hábitats para que se mantengan sanos. Ejemplo: poner límites a la caza y la pesca."], "ens": "Caring for wild animals and their habitats.", "ess": "Cuidar los animales silvestres y sus hábitats.", "fig": null}, {"id": "16-44", "std": "3.4.6-8.G", "en": ["Environmental law", "A rule made by a government to protect the environment, such as limits on pollution."], "es": ["Ley ambiental", "Una regla hecha por un gobierno para proteger el medio ambiente, como límites a la contaminación."], "ens": "A government rule that protects the environment.", "ess": "Una regla del gobierno que protege el medio ambiente.", "fig": null}, {"id": "16-45", "std": "3.4.6-8.G", "en": ["At what levels are environmental laws made?", "International (between countries), federal (the whole U.S.), state (like Pennsylvania), and local (your town or county)."], "es": ["¿En qué niveles se hacen las leyes ambientales?", "Internacional (entre países), federal (todo EE. UU.), estatal (como Pensilvania) y local (tu pueblo o condado)."], "ens": "International, federal, state, and local.", "ess": "Internacional, federal, estatal y local.", "fig": null}, {"id": "16-46", "std": "3.4.6-8.G", "en": ["What are BMPs and environmental laws meant to achieve?", "Environmental sustainability: protecting resources and habitats so people and other living things can keep using them in the future."], "es": ["¿Qué buscan lograr las mejores prácticas y las leyes ambientales?", "La sostenibilidad ambiental: proteger los recursos y hábitats para que las personas y otros seres vivos puedan seguir usándolos en el futuro."], "ens": "Sustainability: protecting resources for the future.", "ess": "Sostenibilidad: proteger los recursos para el futuro.", "fig": null}, {"id": "16-47", "std": "3.4.6-8.H", "en": ["Environmental issue", "A problem caused by changes to the environment that affects people or other living things. Example: litter polluting a local stream."], "es": ["Problema ambiental", "Un problema causado por cambios en el medio ambiente que afecta a las personas o a otros seres vivos. Ejemplo: basura que contamina un arroyo local."], "ens": "A problem with the environment.", "ess": "Un problema con el medio ambiente.", "fig": null}, {"id": "16-48", "std": "3.4.6-8.H", "en": ["Stewardship", "Taking responsibility for caring for the environment and its resources. People who do this are called stewards of the environment."], "es": ["Cuidado responsable del medio ambiente", "Hacerse responsable de cuidar el medio ambiente y sus recursos. Las personas que lo hacen se llaman guardianes del medio ambiente."], "ens": "Taking responsibility for caring for the environment.", "ess": "Hacerse responsable de cuidar el medio ambiente.", "fig": null}, {"id": "16-49", "std": "3.4.6-8.H", "en": ["How can students act as stewards of the environment?", "By designing and carrying out solutions to environmental issues. Examples: drawing a plan to plant trees, then doing the project."], "es": ["¿Cómo pueden los estudiantes ser guardianes del medio ambiente?", "Diseñando y realizando soluciones a problemas ambientales. Ejemplos: dibujar un plan para plantar árboles y luego hacer el proyecto."], "ens": "By planning and doing projects that help nature.", "ess": "Planeando y haciendo proyectos que ayudan a la naturaleza.", "fig": null}, {"id": "16-50", "std": "3.4.6-8.H", "en": ["How do you evaluate possible solutions to a problem?", "Use a step-by-step process to check how well each solution meets the criteria and constraints, then choose the best one."], "es": ["¿Cómo se evalúan las posibles soluciones a un problema?", "Usa un proceso paso a paso para revisar qué tan bien cumple cada solución los criterios y las restricciones, y luego elige la mejor."], "ens": "Check each against criteria and constraints.", "ess": "Revisa cada una con los criterios y restricciones.", "fig": null}, {"id": "16-51", "std": "3.4.6-8.I", "en": ["Environmental justice", "The idea that all people, no matter their race, income, or where they live, deserve a healthy environment and fair protection from pollution."], "es": ["Justicia ambiental", "La idea de que todas las personas, sin importar su raza, sus ingresos o dónde viven, merecen un medio ambiente sano y protección justa contra la contaminación."], "ens": "Everyone deserves a healthy environment.", "ess": "Todas las personas merecen un medio ambiente sano.", "fig": null}, {"id": "16-52", "std": "3.4.6-8.I", "en": ["Social equity", "Fairness in how resources, opportunities, and harms are shared among people, such as clean air, clean water, and parks."], "es": ["Equidad social", "Justicia en cómo se reparten los recursos, oportunidades y daños entre las personas, como el aire limpio, el agua limpia y los parques."], "ens": "Fair sharing of resources and harms.", "ess": "Repartir con justicia los recursos y los daños.", "fig": null}, {"id": "16-53", "std": "3.4.6-8.I", "en": ["Systemic inequality", "Unfairness built into a society's systems over time. It can leave some communities with more pollution or fewer parks than others."], "es": ["Desigualdad sistémica", "Injusticia que se ha formado en los sistemas de una sociedad con el tiempo. Puede dejar a algunas comunidades con más contaminación o menos parques que otras."], "ens": "Unfairness built into a society's systems.", "ess": "Injusticia que forma parte de los sistemas de una sociedad.", "fig": null}, {"id": "16-54", "std": "3.4.6-8.I", "en": ["Superfund site", "A place so polluted by hazardous waste that the U.S. government (EPA) lists it for cleanup. It can harm the health of people living nearby."], "es": ["Sitio Superfund", "Un lugar tan contaminado por desechos peligrosos que el gobierno de EE. UU. (la EPA) lo incluye en una lista para limpiarlo. Puede dañar la salud de quienes viven cerca."], "ens": "A badly polluted place listed for cleanup.", "ess": "Un lugar muy contaminado que está en la lista para limpieza.", "fig": null}, {"id": "16-55", "std": "3.4.6-8.I", "en": ["Acid mine drainage", "Acidic water that flows out of old mines, often carrying metals. It can turn streams orange and harm the living things in them; common in PA."], "es": ["Drenaje ácido de minas", "Agua ácida que sale de minas viejas y muchas veces lleva metales. Puede volver anaranjados los arroyos y dañar a los seres vivos que hay en ellos; es común en PA."], "ens": "Acidic water from old mines that harms streams.", "ess": "Agua ácida de minas viejas que daña los arroyos.", "fig": null}, {"id": "16-56", "std": "3.4.6-8.I", "en": ["Green space", "An area of grass, trees, or other plants in or near a community, such as a park. Not all neighborhoods have equal access to green space."], "es": ["Espacio verde", "Un área con pasto, árboles u otras plantas en una comunidad o cerca de ella, como un parque. No todos los vecindarios tienen el mismo acceso a espacios verdes."], "ens": "A park or area with plants.", "ess": "Un parque o área con plantas.", "fig": null}, {"id": "16-57", "std": "3.4.6-8.I", "en": ["Water quality", "How clean and safe water is for people and other living things to use."], "es": ["Calidad del agua", "Qué tan limpia y segura es el agua para que la usen las personas y otros seres vivos."], "ens": "How clean and safe water is.", "ess": "Qué tan limpia y segura es el agua.", "fig": null}, {"id": "16-58", "std": "3.4.6-8.I", "en": ["How can environmental conditions affect environmental justice?", "Some communities, now and in the past, have faced worse air, polluted water, or more heat, which harms health. That unfairness is an environmental justice issue."], "es": ["¿Cómo afectan las condiciones ambientales la justicia ambiental?", "Algunas comunidades, hoy y en el pasado, han tenido peor aire, agua contaminada o más calor, lo que daña la salud. Esa injusticia es un problema de justicia ambiental."], "ens": "Some communities face more pollution, which is unfair.", "ess": "Algunas comunidades sufren más contaminación, lo cual es injusto.", "fig": null}, {"id": "16-59", "std": "3.4.6-8.I", "en": ["How can changes in biodiversity affect people?", "They can affect resources people need, like food, energy, and medicines, and ecosystem services such as cleaning and recycling water."], "es": ["¿Cómo pueden los cambios en la biodiversidad afectar a las personas?", "Pueden afectar recursos que necesitamos, como alimentos, energía y medicinas, y servicios de los ecosistemas como limpiar y reciclar el agua."], "ens": "They affect food, medicine, and clean water.", "ess": "Afectan los alimentos, las medicinas y el agua limpia.", "fig": null}]}, {"n": 9, "grade": 7, "u": 7, "color": "#475569", "ink": "#3c4859", "glow": "#586a83", "title": {"en": "Engineering Design", "es": "Diseño de ingeniería"}, "cards": [{"id": "9-1", "std": "3.5.6-8.Q", "en": ["Design thinking process", "A step-by-step way to solve design problems: generate ideas, build possible solutions, test them, and redesign. Designers often go back and repeat steps."], "es": ["Proceso de pensamiento de diseño", "Una forma paso a paso de resolver problemas de diseño: generar ideas, construir posibles soluciones, probarlas y rediseñar. A menudo se repiten pasos."], "ens": "Steps to solve a design problem: ideas, build, test, redesign.", "ess": "Pasos para resolver un problema de diseño: ideas, construir, probar, rediseñar.", "fig": null}, {"id": "9-2", "std": "3.5.6-8.R", "en": ["Problem finding", "Spotting a need or want that a new product or system could solve. Ideas often come from problems in your own life or your family's lives."], "es": ["Identificación de problemas", "Detectar una necesidad o un deseo que un nuevo producto o sistema podría resolver. Las ideas suelen venir de problemas en tu vida o la de tu familia."], "ens": "Noticing a need or want that a design could solve.", "ess": "Notar una necesidad o un deseo que un diseño podría resolver.", "fig": null}, {"id": "9-3", "std": "3.5.6-8.R", "en": ["Why do people develop new products and systems?", "To solve problems and extend what people can do, based on the needs and wants of a person or a group. Example: a teen designed a filter to remove a livestock antibiotic from water."], "es": ["¿Por qué la gente crea nuevos productos y sistemas?", "Para resolver problemas y ampliar lo que la gente puede hacer, según las necesidades y deseos de una persona o grupo. Ejemplo: una joven diseñó un filtro para quitar del agua un antibiótico usado en el ganado."], "ens": "To solve problems and meet people's needs and wants.", "ess": "Para resolver problemas y cubrir necesidades y deseos de la gente.", "fig": null}, {"id": "9-4", "std": "3.5.6-8.W", "en": ["Criteria", "What a design solution must do to be successful. Example: a backpack must hold 5 books."], "es": ["Criterios", "Lo que una solución de diseño debe lograr para tener éxito. Ejemplo: una mochila debe poder cargar 5 libros."], "ens": "What a solution needs to do.", "ess": "Lo que una solución tiene que lograr.", "fig": null}, {"id": "9-5", "std": "3.5.6-8.W", "en": ["Constraints", "Limits on a design solution, such as cost, time, materials, scientific principles, or effects on people and the environment."], "es": ["Restricciones", "Límites de una solución de diseño, como el costo, el tiempo, los materiales, los principios científicos o los efectos en las personas y el medio ambiente."], "ens": "Limits on a solution, like money.", "ess": "Límites de una solución, como el dinero.", "fig": null}, {"id": "9-6", "std": "3.5.6-8.W", "en": ["Why define criteria and constraints precisely?", "The more clearly a design task's criteria and constraints are defined, the more likely the solution will be successful."], "es": ["¿Por qué definir con precisión los criterios y las restricciones?", "Cuanto más claramente se definan los criterios y las restricciones de un diseño, más probable es que la solución tenga éxito."], "ens": "Clear goals and limits make success more likely.", "ess": "Metas y límites claros hacen más probable el éxito.", "fig": null}, {"id": "9-7", "std": "3.5.6-8.W", "en": ["What can limit the possible solutions to a design problem?", "Scientific principles (like the laws of physics) and possible impacts on people and the natural environment."], "es": ["¿Qué puede limitar las soluciones posibles a un problema de diseño?", "Los principios científicos (como las leyes de la física) y los posibles impactos en las personas y el medio ambiente natural."], "ens": "Science rules and effects on people and nature.", "ess": "Las reglas de la ciencia y los efectos en las personas y la naturaleza.", "fig": null}, {"id": "9-8", "std": "3.5.6-8.II", "en": ["Why predict outcomes at the start of a design?", "Careful designers think about possible results of a product before it is finished, so they can avoid problems and make better choices early."], "es": ["¿Por qué predecir los resultados al comienzo de un diseño?", "Los buenos diseñadores piensan en los posibles resultados de un producto antes de terminarlo, para evitar problemas y tomar mejores decisiones desde el principio."], "ens": "To spot problems early, before the product is done.", "ess": "Para detectar problemas temprano, antes de terminar el producto.", "fig": null}, {"id": "9-9", "std": "3.5.6-8.II", "en": ["Ideation", "Coming up with many ideas for solving a problem. It is an early part of the design process."], "es": ["Generación de ideas", "Proponer muchas ideas para resolver un problema. Es una parte temprana del proceso de diseño."], "ens": "Coming up with lots of ideas.", "ess": "Proponer muchas ideas.", "fig": null}, {"id": "9-10", "std": "3.5.6-8.S", "en": ["Design approach", "The method or strategy a designer chooses to solve a problem. Different approaches have different benefits and opportunities."], "es": ["Enfoque de diseño", "El método o la estrategia que un diseñador elige para resolver un problema. Distintos enfoques tienen distintos beneficios y oportunidades."], "ens": "The strategy a designer picks to solve a problem.", "ess": "La estrategia que un diseñador elige para resolver un problema.", "fig": null}, {"id": "9-11", "std": "3.5.6-8.S", "en": ["How should a designer choose a final approach?", "By carefully weighing the benefits and opportunities of each possible approach before picking one."], "es": ["¿Cómo debe un diseñador elegir el enfoque final?", "Comparando con cuidado los beneficios y las oportunidades de cada enfoque posible antes de elegir uno."], "ens": "Compare the benefits of each approach first.", "ess": "Primero compara los beneficios de cada enfoque.", "fig": null}, {"id": "9-12", "std": "3.5.6-8.Q", "en": ["Design fixation", "Getting stuck on just one solution. Going back to earlier steps of the design process helps designers avoid it."], "es": ["Fijación en el diseño", "Quedarse atascado en una sola solución. Volver a pasos anteriores del proceso de diseño ayuda a evitarlo."], "ens": "Getting stuck on only one idea.", "ess": "Quedarse atascado en una sola idea.", "fig": null}, {"id": "9-13", "std": "3.5.6-8.T", "en": ["Human factors", "Things about people that affect how a design should work, such as how easy it is to use and how well it fits the body."], "es": ["Factores humanos", "Aspectos de las personas que afectan cómo debe funcionar un diseño, como qué tan fácil es de usar y qué tan bien se adapta al cuerpo."], "ens": "How people's needs affect a design.", "ess": "Cómo las necesidades de las personas afectan un diseño.", "fig": null}, {"id": "9-14", "std": "3.5.6-8.T", "en": ["Ease of use", "How simple a product is for people to understand and operate. Example: a can opener that works without much strength."], "es": ["Facilidad de uso", "Qué tan sencillo es para las personas entender y manejar un producto. Ejemplo: un abrelatas que funciona sin mucha fuerza."], "ens": "How simple a product is to use.", "ess": "Qué tan sencillo es usar un producto.", "fig": null}, {"id": "9-15", "std": "3.5.6-8.T", "en": ["Ergonomics", "Designing things to fit the human body so they are comfortable and safe. Example: a computer mouse shaped to fit your hand."], "es": ["Ergonomía", "Diseñar cosas que se adapten al cuerpo humano para que sean cómodas y seguras. Ejemplo: un ratón de computadora con forma que se ajusta a la mano."], "ens": "Designing things to fit the body comfortably.", "ess": "Diseñar cosas que se adapten cómodamente al cuerpo.", "fig": null}, {"id": "9-16", "std": "3.5.6-8.T", "en": ["Unintended consequence", "A result of a design that the designer did not plan or expect. It can be helpful or harmful."], "es": ["Consecuencia no intencionada", "Un resultado de un diseño que el diseñador no planeó ni esperaba. Puede ser útil o perjudicial."], "ens": "A result nobody planned.", "ess": "Un resultado que nadie planeó.", "fig": null}, {"id": "9-17", "std": "3.5.6-8.M", "en": ["How do models help engineers?", "Models of all kinds, such as drawings, physical models, and computer models, let engineers test solutions and collect data."], "es": ["¿Cómo ayudan los modelos a los ingenieros?", "Los modelos de todo tipo, como dibujos, modelos físicos y modelos de computadora, permiten a los ingenieros probar soluciones y reunir datos."], "ens": "Models let engineers test ideas and get data.", "ess": "Los modelos permiten probar ideas y obtener datos.", "fig": null}, {"id": "9-18", "std": "3.5.6-8.M", "en": ["Iterative testing", "Testing a design, changing it based on the results, then testing again, over and over. Each round improves the design."], "es": ["Pruebas iterativas", "Probar un diseño, cambiarlo según los resultados y volver a probarlo, una y otra vez. Cada ronda mejora el diseño."], "ens": "Test, change, and test again to improve.", "ess": "Probar, cambiar y volver a probar para mejorar.", "fig": null}, {"id": "9-19", "std": "3.5.6-8.M", "en": ["Optimal design", "The best possible solution for the problem. It is reached by repeatedly testing the most promising designs and refining them."], "es": ["Diseño óptimo", "La mejor solución posible para el problema. Se logra probando y mejorando una y otra vez los diseños más prometedores."], "ens": "The best possible solution.", "ess": "La mejor solución posible.", "fig": null}, {"id": "9-20", "std": "3.5.6-8.V", "en": ["Trade-off", "A compromise in which one thing is given up to get something else that is wanted. Example: a stronger bridge may cost more."], "es": ["Compensación (trade-off)", "Un acuerdo en el que se renuncia a algo para obtener otra cosa que se desea. Ejemplo: un puente más fuerte puede costar más."], "ens": "Giving up one thing to get another.", "ess": "Renunciar a una cosa para obtener otra.", "fig": null}, {"id": "9-21", "std": "3.5.6-8.V", "en": ["Optimization", "Making a design as good as it can be within its criteria and constraints. It usually requires trade-offs."], "es": ["Optimización", "Hacer que un diseño sea lo mejor posible dentro de sus criterios y restricciones. Por lo general requiere compensaciones."], "ens": "Making a design as good as possible.", "ess": "Hacer que un diseño sea lo mejor posible.", "fig": null}, {"id": "9-22", "std": "3.5.6-8.V", "en": ["Refining a design", "Making small improvements to a design so it better meets its criteria and constraints."], "es": ["Perfeccionar un diseño", "Hacer pequeñas mejoras a un diseño para que cumpla mejor sus criterios y restricciones."], "ens": "Improving a design step by step.", "ess": "Mejorar un diseño paso a paso.", "fig": null}, {"id": "9-23", "std": "3.5.6-8.P", "en": ["Competing design solutions", "Different designs that try to solve the same problem. Engineers compare them to choose the best one."], "es": ["Soluciones de diseño en competencia", "Diseños diferentes que intentan resolver el mismo problema. Los ingenieros los comparan para elegir el mejor."], "ens": "Different designs for the same problem.", "ess": "Diseños diferentes para el mismo problema.", "fig": null}, {"id": "9-24", "std": "3.5.6-8.P", "en": ["How do engineers compare competing designs?", "They use a systematic (step-by-step) process to check how well each design meets the same criteria and constraints."], "es": ["¿Cómo comparan los ingenieros los diseños en competencia?", "Usan un proceso sistemático (paso a paso) para revisar qué tan bien cumple cada diseño los mismos criterios y restricciones."], "ens": "Check each design against the same criteria and constraints.", "ess": "Revisar cada diseño con los mismos criterios y restricciones.", "fig": null}, {"id": "9-25", "std": "3.5.6-8.N", "en": ["What if no design wins every test?", "Find which design did best on each test. Those best features can be used in the redesign."], "es": ["¿Qué pasa si ningún diseño gana todas las pruebas?", "Se identifica qué diseño funcionó mejor en cada prueba. Esas mejores características se pueden usar en el rediseño."], "ens": "Use the best feature from each test.", "ess": "Usa la mejor característica de cada prueba.", "fig": null}, {"id": "9-26", "std": "3.5.6-8.N", "en": ["Can parts of different designs be combined?", "Yes. Combining the best parts of different solutions can create a new solution that is better than any of the earlier ones."], "es": ["¿Se pueden combinar partes de diferentes diseños?", "Sí. Combinar las mejores partes de distintas soluciones puede crear una nueva solución mejor que cualquiera de las anteriores."], "ens": "Yes, mixing best parts can make a better design.", "ess": "Sí, combinar las mejores partes puede crear un mejor diseño.", "fig": null}, {"id": "9-27", "std": "3.5.6-8.JJ", "en": ["Redesign", "Changing a design based on test results to make it work better."], "es": ["Rediseño", "Cambiar un diseño según los resultados de las pruebas para que funcione mejor."], "ens": "Changing a design after testing.", "ess": "Cambiar un diseño después de probarlo.", "fig": null}, {"id": "9-28", "std": "3.5.6-8.JJ", "en": ["What can creative problem-solving improve?", "It can lead to greater efficiency, better performance, or lower environmental impact. Example: a more streamlined model rocket flies more accurately."], "es": ["¿Qué puede mejorar la resolución creativa de problemas?", "Puede lograr mayor eficiencia, mejor rendimiento o menor impacto ambiental. Ejemplo: un cohete modelo más aerodinámico vuela con más precisión."], "ens": "Efficiency, performance, and less harm to the environment.", "ess": "Eficiencia, rendimiento y menos daño al medio ambiente.", "fig": null}, {"id": "9-29", "std": "3.5.6-8.U", "en": ["Principles and elements of design", "The basic parts (elements, like shape and color) and guidelines (principles, like balance) used to create and judge the quality of a design."], "es": ["Principios y elementos del diseño", "Las partes básicas (elementos, como la forma y el color) y las pautas (principios, como el equilibrio) que se usan para crear y juzgar la calidad de un diseño."], "ens": "Basic parts and rules used to judge designs.", "ess": "Partes y reglas básicas para juzgar diseños.", "fig": null}, {"id": "9-30", "std": "3.5.6-8.U", "en": ["How can you tell if one design is better than another?", "Compare the strengths and weaknesses of each design using the principles and elements of design, then explain your reasons."], "es": ["¿Cómo saber si un diseño es mejor que otro?", "Compara las fortalezas y debilidades de cada diseño usando los principios y elementos del diseño, y luego explica tus razones."], "ens": "Compare strengths and weaknesses, then explain why.", "ess": "Compara fortalezas y debilidades, y explica por qué.", "fig": null}, {"id": "9-31", "std": "3.5.6-8.O", "en": ["Accuracy", "How close information or a measurement is to the true value. A water-purity tester gives fairly easy-to-check data."], "es": ["Exactitud", "Qué tan cerca está una información o una medición del valor real. Un medidor de pureza del agua da datos bastante fáciles de verificar."], "ens": "How close data is to the truth.", "ess": "Qué tan cerca están los datos de la verdad.", "fig": null}, {"id": "9-32", "std": "3.5.6-8.O", "en": ["Credibility", "How trustworthy and believable a source of information is."], "es": ["Credibilidad", "Qué tan confiable y creíble es una fuente de información."], "ens": "How much you can trust a source.", "ess": "Cuánto puedes confiar en una fuente.", "fig": null}, {"id": "9-33", "std": "3.5.6-8.O", "en": ["Relevance", "How closely information connects to the question or problem you are working on."], "es": ["Pertinencia", "Qué tan relacionada está la información con la pregunta o el problema en el que trabajas."], "ens": "How related information is to your question.", "ess": "Qué tan relacionada está la información con tu pregunta.", "fig": null}, {"id": "9-34", "std": "3.5.6-8.O", "en": ["Why is public opinion data hard to judge for accuracy?", "Opinions can differ greatly from group to group, unlike readings from a physical measuring device."], "es": ["¿Por qué es difícil juzgar la exactitud de la opinión pública?", "Las opiniones pueden variar mucho de un grupo a otro, a diferencia de las lecturas de un instrumento de medición."], "ens": "Opinions change a lot between groups.", "ess": "Las opiniones cambian mucho entre grupos.", "fig": null}, {"id": "9-35", "std": "3.5.6-8.X", "en": ["Why should engineers defend their design decisions?", "Explaining and backing up choices with evidence builds flexible thinking and accountability, and helps others understand the design."], "es": ["¿Por qué los ingenieros deben defender sus decisiones de diseño?", "Explicar y respaldar las decisiones con evidencia desarrolla el pensamiento flexible y la responsabilidad, y ayuda a otros a entender el diseño."], "ens": "To explain choices with evidence and take responsibility.", "ess": "Para explicar decisiones con evidencia y asumir responsabilidad.", "fig": null}, {"id": "9-36", "std": "3.5.6-8.X", "en": ["Metacognition", "Being aware of and understanding your own thought processes, like noticing how you solved a problem."], "es": ["Metacognición", "Estar consciente de tus propios procesos de pensamiento y entenderlos, como notar cómo resolviste un problema."], "ens": "Thinking about your own thinking.", "ess": "Pensar sobre tu propio pensamiento.", "fig": null}, {"id": "9-37", "std": "3.5.6-8.X", "en": ["Habits of mind (in engineering)", "Ways of thinking engineers practice until they become habits, like predicting outcomes early, thinking flexibly, and reflecting on their own thinking."], "es": ["Hábitos mentales (en ingeniería)", "Formas de pensar que los ingenieros practican hasta que se vuelven hábitos, como predecir resultados desde el principio, pensar con flexibilidad y reflexionar sobre su propio pensamiento."], "ens": "Ways of thinking engineers practice until they are habits.", "ess": "Formas de pensar que los ingenieros practican hasta volverlas hábitos.", "fig": null}, {"id": "9-38", "std": "3.5.6-8.DD", "en": ["Research and development (R&D)", "A process of systematic testing and refining used to create new inventions or improve existing ones."], "es": ["Investigación y desarrollo (I+D)", "Un proceso de pruebas y mejoras sistemáticas que se usa para crear nuevos inventos o mejorar los que ya existen."], "ens": "Testing and improving to create or better a technology.", "ess": "Probar y mejorar para crear o perfeccionar una tecnología.", "fig": null}, {"id": "9-39", "std": "3.5.6-8.DD", "en": ["How has the light bulb changed since 1879?", "Edison's 1879 bulb burned for only about 13 hours. Many tests, design changes, and innovations since then have made bulbs last much longer."], "es": ["¿Cómo ha cambiado la bombilla desde 1879?", "La bombilla de Edison de 1879 duró solo unas 13 horas. Desde entonces, muchas pruebas, cambios de diseño e innovaciones han hecho que duren mucho más."], "ens": "Many improvements made bulbs last much longer.", "ess": "Muchas mejoras hicieron que las bombillas duren mucho más.", "fig": null}]}, {"n": 10, "grade": 7, "u": 8, "color": "#7C3A5C", "ink": "#69314e", "glow": "#9b4873", "title": {"en": "Technology, Systems, and Society", "es": "Tecnología, sistemas y sociedad"}, "cards": [{"id": "10-1", "std": "3.5.6-8.Y", "en": ["Science", "The systematic investigation of the natural world."], "es": ["Ciencia", "La investigación sistemática del mundo natural."], "ens": "Studying the natural world in an organized way.", "ess": "Estudiar el mundo natural de forma organizada.", "fig": null}, {"id": "10-2", "std": "3.5.6-8.Y", "en": ["Technology", "Any change people make to the environment to meet their needs and wants. Examples: a bridge, a phone, a water filter."], "es": ["Tecnología", "Cualquier cambio que las personas hacen al entorno para satisfacer sus necesidades y deseos. Ejemplos: un puente, un teléfono, un filtro de agua."], "ens": "Things people make to meet needs and wants.", "ess": "Cosas que la gente crea para cubrir necesidades y deseos.", "fig": null}, {"id": "10-3", "std": "3.5.6-8.Y", "en": ["Engineering", "The process of creating or changing technologies. It is limited by physical laws, cultural norms, and economic resources."], "es": ["Ingeniería", "El proceso de crear o modificar tecnologías. Está limitado por las leyes físicas, las normas culturales y los recursos económicos."], "ens": "The process of creating or improving technologies.", "ess": "El proceso de crear o mejorar tecnologías.", "fig": null}, {"id": "10-4", "std": "3.5.6-8.Y", "en": ["How do science, technology, engineering, and math work together?", "Each field adds something to building technological systems, and they overlap. Example: a design project may use science facts, math measurements, and engineering steps."], "es": ["¿Cómo se combinan ciencia, tecnología, ingeniería y matemáticas?", "Cada campo aporta algo para crear sistemas tecnológicos, y se superponen. Ejemplo: un proyecto de diseño puede usar datos científicos, mediciones matemáticas y pasos de ingeniería."], "ens": "Each field adds a different part to building technology.", "ess": "Cada campo aporta una parte diferente para crear tecnología.", "fig": null}, {"id": "10-5", "std": "3.5.6-8.BB", "en": ["How do other school subjects help in designing technology?", "Art skills help draw and show designs. Science helps too: Newton's laws of motion are used to build and test roller coasters or rockets."], "es": ["¿Cómo ayudan otras materias escolares a diseñar tecnología?", "Las destrezas de arte ayudan a dibujar y mostrar diseños. La ciencia también ayuda: las leyes del movimiento de Newton se usan para construir y probar montañas rusas o cohetes."], "ens": "Art, science, and history all help make better technology.", "ess": "El arte, la ciencia y la historia ayudan a crear mejor tecnología.", "fig": null}, {"id": "10-6", "std": "3.5.6-8.BB", "en": ["Why study the history of technology?", "It lets people learn from past successes and challenges when designing new products and systems."], "es": ["¿Por qué estudiar la historia de la tecnología?", "Permite aprender de los éxitos y retos del pasado al diseñar nuevos productos y sistemas."], "ens": "To learn from past successes and mistakes.", "ess": "Para aprender de éxitos y errores del pasado.", "fig": null}, {"id": "10-7", "std": "3.5.6-8.KK", "en": ["Invention", "A brand-new product, process, or idea that did not exist before. Example: Kevlar, a super-strong fiber."], "es": ["Invento", "Un producto, proceso o idea totalmente nuevo que no existía antes. Ejemplo: el Kevlar, una fibra muy resistente."], "ens": "Something completely new.", "ess": "Algo completamente nuevo.", "fig": null}, {"id": "10-8", "std": "3.5.6-8.KK", "en": ["Innovation", "An improvement to an existing product, process, or system, or a new use for it. Example: LED bulbs improving on older bulbs."], "es": ["Innovación", "Una mejora a un producto, proceso o sistema que ya existe, o un nuevo uso para él. Ejemplo: las bombillas LED que mejoran las bombillas antiguas."], "ens": "An improvement to something that already exists.", "ess": "Una mejora a algo que ya existe.", "fig": null}, {"id": "10-9", "std": "3.5.6-8.KK", "en": ["Invention vs. innovation", "An invention is something new that did not exist before. An innovation improves or finds a new use for something that already exists."], "es": ["Invento vs. innovación", "Un invento es algo nuevo que no existía antes. Una innovación mejora algo que ya existe o le encuentra un nuevo uso."], "ens": "Invention is new; innovation improves what exists.", "ess": "El invento es nuevo; la innovación mejora lo que existe.", "fig": null}, {"id": "10-10", "std": "3.5.6-8.KK", "en": ["Creativity (in technology)", "Using knowledge and experience from different subjects to make something new or to use something in a new way."], "es": ["Creatividad (en tecnología)", "Usar conocimientos y experiencias de distintas materias para crear algo nuevo o usar algo de una forma nueva."], "ens": "Making something new or using something a new way.", "ess": "Crear algo nuevo o usar algo de una forma nueva.", "fig": null}, {"id": "10-11", "std": "3.5.6-8.KK", "en": ["Can inventions happen by accident?", "Yes. Stephanie Kwolek was looking for a replacement for steel cords in tires when she accidentally invented Kevlar."], "es": ["¿Pueden ocurrir inventos por accidente?", "Sí. Stephanie Kwolek buscaba un reemplazo para los cables de acero de las llantas cuando inventó el Kevlar por accidente."], "ens": "Yes, like Kevlar, found while working on tires.", "ess": "Sí, como el Kevlar, descubierto mientras ella trabajaba en llantas.", "fig": null}, {"id": "10-12", "std": "3.5.6-8.G", "en": ["How does its context shape an invention or innovation?", "Economic, political, cultural, and environmental conditions affect how a technology is designed and whether people accept it."], "es": ["¿Cómo influye el contexto en un invento o una innovación?", "Las condiciones económicas, políticas, culturales y ambientales afectan cómo se diseña una tecnología y si la gente la acepta."], "ens": "The time and place shape how technology is designed.", "ess": "La época y el lugar influyen en cómo se diseña la tecnología.", "fig": null}, {"id": "10-13", "std": "3.5.6-8.G", "en": ["Why did LED bulbs largely replace older light bulbs?", "People wanted lighting that was more efficient, lasted longer, and was better for the environment than incandescent or compact fluorescent bulbs."], "es": ["¿Por qué las bombillas LED reemplazaron en gran parte a las antiguas?", "La gente quería una iluminación más eficiente, de mayor duración y mejor para el medio ambiente que las bombillas incandescentes o fluorescentes compactas."], "ens": "LEDs are efficient, last long, and are greener.", "ess": "Las LED son eficientes, duran mucho y dañan menos el ambiente.", "fig": null}, {"id": "10-14", "std": "3.5.6-8.CC", "en": ["How did natural resources affect early human shelters?", "Geography and the natural resources available in a place often decided what materials people used to build shelters."], "es": ["¿Cómo influyeron los recursos naturales en los primeros refugios?", "La geografía y los recursos naturales disponibles en un lugar a menudo decidían qué materiales usaba la gente para construir sus refugios."], "ens": "People built with materials found nearby.", "ess": "La gente construía con los materiales que tenía cerca.", "fig": null}, {"id": "10-15", "std": "3.5.6-8.CC", "en": ["What historical factors affect how technology develops?", "Things like geography, which natural resources were available, and people's needs at that time in history."], "es": ["¿Qué factores históricos afectan el desarrollo de la tecnología?", "Cosas como la geografía, los recursos naturales disponibles y las necesidades de las personas en esa época de la historia."], "ens": "Geography, resources, and needs of that time.", "ess": "La geografía, los recursos y las necesidades de esa época.", "fig": null}, {"id": "10-16", "std": "3.5.6-8.F", "en": ["How can technology change the way people live?", "Some technologies change how people think, interact, live, and communicate. Examples: smartphones and social media."], "es": ["¿Cómo puede la tecnología cambiar la forma de vivir?", "Algunas tecnologías cambian cómo las personas piensan, se relacionan, viven y se comunican. Ejemplos: los teléfonos inteligentes y las redes sociales."], "ens": "It changes how people live, think, and communicate.", "ess": "Cambia cómo la gente vive, piensa y se comunica.", "fig": null}, {"id": "10-17", "std": "3.5.6-8.F", "en": ["Why might a technology fit one society but not another?", "Different societies have different needs, resources, and ways of life, so a technology can be appropriate and sustainable in one place but not another."], "es": ["¿Por qué una tecnología puede servir en una sociedad y no en otra?", "Las sociedades tienen distintas necesidades, recursos y formas de vida, así que una tecnología puede ser adecuada y sostenible en un lugar pero no en otro."], "ens": "Societies have different needs and resources.", "ess": "Las sociedades tienen distintas necesidades y recursos.", "fig": null}, {"id": "10-18", "std": "3.5.6-8.Z", "en": ["How do technological systems connect with other systems?", "They interact with economic, environmental, and social systems. Example: a delivery truck's GPS sends data to the company and alerts customers."], "es": ["¿Cómo se conectan los sistemas tecnológicos con otros sistemas?", "Interactúan con sistemas económicos, ambientales y sociales. Ejemplo: el GPS de un camión de reparto envía datos a la empresa y avisa a los clientes."], "ens": "They affect money, the environment, and people.", "ess": "Afectan la economía, el medio ambiente y a las personas.", "fig": null}, {"id": "10-19", "std": "3.5.6-8.Z", "en": ["What drives improvements in technology?", "Economic, political, social, and cultural parts of society push people to improve products, processes, and systems."], "es": ["¿Qué impulsa las mejoras en la tecnología?", "Los aspectos económicos, políticos, sociales y culturales de la sociedad impulsan a mejorar productos, procesos y sistemas."], "ens": "Society's money, politics, and culture.", "ess": "La economía, la política y la cultura de la sociedad.", "fig": null}, {"id": "10-20", "std": "3.5.6-8.FF", "en": ["System", "A group of parts that work together to reach a goal. Examples: a transportation system or a communication system."], "es": ["Sistema", "Un grupo de partes que trabajan juntas para lograr una meta. Ejemplos: un sistema de transporte o un sistema de comunicación."], "ens": "Parts working together toward a goal.", "ess": "Partes que trabajan juntas para lograr una meta.", "fig": null}, {"id": "10-21", "std": "3.5.6-8.FF", "en": ["Systems thinking", "Looking at how every part of a system relates to the others, and how the whole system interacts with its environment and other systems."], "es": ["Pensamiento sistémico", "Observar cómo se relaciona cada parte de un sistema con las demás, y cómo todo el sistema interactúa con su entorno y con otros sistemas."], "ens": "Seeing how all parts and systems connect.", "ess": "Ver cómo se conectan todas las partes y sistemas.", "fig": null}, {"id": "10-22", "std": "3.5.6-8.FF", "en": ["What are two ways to analyze a system?", "Look at its individual parts (like the parts of one computer), or look at the whole system and how it relates to others (like a computer network)."], "es": ["¿Cuáles son dos formas de analizar un sistema?", "Observar sus partes individuales (como las piezas de una computadora) o el sistema completo y cómo se relaciona con otros (como una red de computadoras)."], "ens": "Study its parts, or study the whole system.", "ess": "Estudiar sus partes o estudiar el sistema completo.", "fig": null}, {"id": "10-23", "std": "3.5.6-8.EE", "en": ["What do all technological systems have in common?", "They are designed to reach goals, they turn inputs into outputs through processes, and they all use energy in some form."], "es": ["¿Qué tienen en común todos los sistemas tecnológicos?", "Están diseñados para lograr metas, transforman entradas en salidas mediante procesos y todos usan energía de alguna forma."], "ens": "They have goals, turn inputs to outputs, and use energy.", "ess": "Tienen metas, convierten entradas en salidas y usan energía.", "fig": null}, {"id": "10-24", "std": "3.5.6-8.EE", "en": ["Input", "The resources that flow into a technological system. Examples: fuel going into a car, or a person flipping a light switch."], "es": ["Entrada", "Los recursos que entran en un sistema tecnológico. Ejemplos: el combustible que entra en un carro o una persona que acciona un interruptor de luz."], "ens": "What goes into a system.", "ess": "Lo que entra en un sistema.", "fig": null},
