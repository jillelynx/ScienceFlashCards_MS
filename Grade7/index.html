{"id": "10-25", "std": "3.5.6-8.EE", "en": ["Process", "The actions a system takes to change inputs into an output. Example: electricity flowing through wires to a bulb."], "es": ["Proceso", "Las acciones que realiza un sistema para convertir las entradas en una salida. Ejemplo: la electricidad que fluye por los cables hasta una bombilla."], "ens": "The steps that turn inputs into outputs.", "ess": "Los pasos que convierten entradas en salidas.", "fig": null}, {"id": "10-26", "std": "3.5.6-8.EE", "en": ["Output", "The result of a technological system. It can have positive or negative impacts. Example: light filling a room."], "es": ["Salida", "El resultado de un sistema tecnológico. Puede tener impactos positivos o negativos. Ejemplo: la luz que ilumina un cuarto."], "ens": "The result a system produces.", "ess": "El resultado que produce un sistema.", "fig": null}, {"id": "10-27", "std": "3.5.6-8.EE", "en": ["Feedback", "Information used to monitor or control a system. Example: a car's fuel gauge tells the driver when to add fuel."], "es": ["Retroalimentación", "Información que se usa para vigilar o controlar un sistema. Ejemplo: el indicador de combustible de un carro avisa cuándo hay que cargar combustible."], "ens": "Information used to check or control a system.", "ess": "Información para revisar o controlar un sistema.", "fig": null}, {"id": "10-28", "std": "3.5.6-8.GG", "en": ["Open-loop system", "A system with no feedback path that needs a person to control it. Example: a light switch stays on until someone flips it off."], "es": ["Sistema de lazo abierto", "Un sistema sin retroalimentación que necesita que una persona lo controle. Ejemplo: una luz sigue encendida hasta que alguien la apaga con el interruptor."], "ens": "No feedback; a person must control it.", "ess": "Sin retroalimentación; una persona debe controlarlo.", "fig": null}, {"id": "10-29", "std": "3.5.6-8.GG", "en": ["Why is a room's light switch an open-loop system?", "It has no feedback. A person flips the switch (input), electricity flows to the bulb (process), and the room lights up (output)."], "es": ["¿Por qué un interruptor de luz es un sistema de lazo abierto?", "No tiene retroalimentación. Una persona acciona el interruptor (entrada), la electricidad llega a la bombilla (proceso) y el cuarto se ilumina (salida)."], "ens": "No feedback; a person must flip it.", "ess": "No tiene retroalimentación; una persona debe accionarlo.", "fig": null}, {"id": "10-30", "std": "3.5.6-8.HH", "en": ["Closed-loop system", "A system with a feedback path that controls itself automatically, with no person needed. Example: a home water heater."], "es": ["Sistema de lazo cerrado", "Un sistema con retroalimentación que se controla solo, de forma automática, sin necesidad de una persona. Ejemplo: un calentador de agua de una casa."], "ens": "Uses feedback to control itself.", "ess": "Usa retroalimentación para controlarse solo.", "fig": null}, {"id": "10-31", "std": "3.5.6-8.HH", "en": ["How does a thermostat make a water heater closed-loop?", "The thermostat senses the water temperature (feedback) and automatically turns the heater on or off as needed."], "es": ["¿Cómo hace el termostato que un calentador sea de lazo cerrado?", "El termostato detecta la temperatura del agua (retroalimentación) y enciende o apaga el calentador automáticamente según se necesite."], "ens": "It senses temperature and switches the heater automatically.", "ess": "Detecta la temperatura y enciende o apaga el calentador solo.", "fig": null}, {"id": "10-32", "std": "3.5.6-8.HH", "en": ["Open-loop vs. closed-loop system", "An open-loop system has no feedback and needs a person to control it. A closed-loop system uses feedback to control itself."], "es": ["Sistema de lazo abierto vs. de lazo cerrado", "Un sistema de lazo abierto no tiene retroalimentación y necesita que una persona lo controle. Uno de lazo cerrado usa retroalimentación para controlarse solo."], "ens": "Open needs a person; closed uses feedback.", "ess": "El abierto necesita una persona; el cerrado usa retroalimentación.", "fig": null}, {"id": "10-33", "std": "3.5.6-8.K", "en": ["Sensor", "A device that detects something, like light, heat, or motion, and sends that information to control a system. Robots use sensors."], "es": ["Sensor", "Un dispositivo que detecta algo, como luz, calor o movimiento, y envía esa información para controlar un sistema. Los robots usan sensores."], "ens": "A device that detects things to control a system.", "ess": "Un dispositivo que detecta cosas para controlar un sistema.", "fig": null}, {"id": "10-34", "std": "3.5.6-8.K", "en": ["Automation", "Using machines or computer controls to do tasks without a person doing each step. Example: a robot on an assembly line."], "es": ["Automatización", "Usar máquinas o controles de computadora para hacer tareas sin que una persona haga cada paso. Ejemplo: un robot en una línea de ensamblaje."], "ens": "Machines doing tasks on their own.", "ess": "Máquinas que hacen tareas por sí solas.", "fig": null}, {"id": "10-35", "std": "3.5.6-8.K", "en": ["Algorithmic thinking", "Planning a clear sequence of steps to solve a problem. It is used to create and test automated solutions."], "es": ["Pensamiento algorítmico", "Planear una secuencia clara de pasos para resolver un problema. Se usa para crear y probar soluciones automatizadas."], "ens": "Planning step-by-step instructions to solve a problem.", "ess": "Planear instrucciones paso a paso para resolver un problema.", "fig": null}, {"id": "10-36", "std": "3.5.6-8.K", "en": ["Safety device", "A part on a machine that protects the user from getting hurt. Example: a guard that covers a moving blade."], "es": ["Dispositivo de seguridad", "Una parte de una máquina que protege al usuario de lastimarse. Ejemplo: una protección que cubre una cuchilla en movimiento."], "ens": "A part that protects the user.", "ess": "Una parte que protege al usuario.", "fig": null}, {"id": "10-37", "std": "3.5.6-8.LL", "en": ["Do all technologies use the same processes?", "No. Different technologies use different sets of processes. Data processing and construction each have their own steps."], "es": ["¿Todas las tecnologías usan los mismos procesos?", "No. Las distintas tecnologías usan distintos conjuntos de procesos. El procesamiento de datos y la construcción tienen cada uno sus propios pasos."], "ens": "No, each technology has its own processes.", "ess": "No, cada tecnología tiene sus propios procesos.", "fig": null}, {"id": "10-38", "std": "3.5.6-8.LL", "en": ["Data processing", "Working with information: designing, summarizing, storing, retrieving, reproducing, evaluating, and communicating it."], "es": ["Procesamiento de datos", "Trabajar con información: diseñarla, resumirla, almacenarla, recuperarla, reproducirla, evaluarla y comunicarla."], "ens": "Summarizing, storing, and sharing information.", "ess": "Resumir, guardar y compartir información.", "fig": null}, {"id": "10-39", "std": "3.5.6-8.LL", "en": ["What processes are part of construction?", "Designing, developing, evaluating, making and producing, marketing, and managing."], "es": ["¿Qué procesos forman parte de la construcción?", "Diseñar, desarrollar, evaluar, fabricar y producir, comercializar y administrar."], "ens": "Designing, building, selling, and managing.", "ess": "Diseñar, construir, vender y administrar.", "fig": null}, {"id": "10-40", "std": "3.5.6-8.AA", "en": ["Technology transfer", "Adapting an existing product, system, or process to solve a problem in a different setting."], "es": ["Transferencia de tecnología", "Adaptar un producto, sistema o proceso existente para resolver un problema en un entorno diferente."], "ens": "Using an existing technology in a new way.", "ess": "Usar una tecnología existente de una nueva forma.", "fig": null}, {"id": "10-41", "std": "3.5.6-8.AA", "en": ["What is an example of technology transfer?", "An automatic pump built for the Mars Viking space probe was changed into an insulin pump that helps patients control blood sugar."], "es": ["¿Cuál es un ejemplo de transferencia de tecnología?", "Una bomba automática hecha para la sonda espacial Viking a Marte se transformó en una bomba de insulina que ayuda a los pacientes a controlar el azúcar en la sangre."], "ens": "A Mars probe pump became an insulin pump.", "ess": "Una bomba de una sonda a Marte se volvió bomba de insulina.", "fig": null}, {"id": "10-42", "std": "3.5.6-8.AA", "en": ["Microcontroller", "A tiny computer on a single chip that can be programmed to control a device. Students can use one to solve design problems."], "es": ["Microcontrolador", "Una pequeña computadora en un solo chip que se puede programar para controlar un dispositivo. Los estudiantes pueden usarlo para resolver problemas de diseño."], "ens": "A tiny programmable computer that controls a device.", "ess": "Una pequeña computadora programable que controla un dispositivo.", "fig": null}, {"id": "10-43", "std": "3.5.6-8.A", "en": ["Maintenance", "Taking care of a product or system so it keeps working properly. Example: cleaning a bike chain."], "es": ["Mantenimiento", "Cuidar un producto o sistema para que siga funcionando bien. Ejemplo: limpiar la cadena de una bicicleta."], "ens": "Caring for something so it keeps working.", "ess": "Cuidar algo para que siga funcionando.", "fig": null}, {"id": "10-44", "std": "3.5.6-8.A", "en": ["Troubleshooting", "Finding and fixing the cause of a problem in a product or system, step by step. Many manuals give troubleshooting tips."], "es": ["Solución de problemas", "Encontrar y arreglar la causa de un problema en un producto o sistema, paso a paso. Muchos manuales dan consejos para solucionar problemas."], "ens": "Finding and fixing what is wrong.", "ess": "Encontrar y arreglar lo que está mal.", "fig": null}, {"id": "10-45", "std": "3.5.6-8.A", "en": ["Where can you learn how to use and fix a product?", "Written and graphical information, like manuals and diagrams, explains how to use a product and check if it works properly."], "es": ["¿Dónde puedes aprender a usar y arreglar un producto?", "La información escrita y gráfica, como los manuales y diagramas, explica cómo usar un producto y verificar si funciona bien."], "ens": "In manuals, diagrams, and other sources.", "ess": "En manuales, diagramas y otras fuentes.", "fig": null}, {"id": "10-46", "std": "3.5.6-8.J", "en": ["Diagnose (a system)", "To figure out what is causing a problem in a system before adjusting or repairing it."], "es": ["Diagnosticar (un sistema)", "Averiguar qué está causando un problema en un sistema antes de ajustarlo o repararlo."], "ens": "Figuring out what causes a problem.", "ess": "Averiguar qué causa un problema.", "fig": null}, {"id": "10-47", "std": "3.5.6-8.J", "en": ["Why learn safety procedures before using tools?", "Tools and machines can be dangerous. Safety procedures, learned through teaching and demonstration, help you diagnose, adjust, and repair safely."], "es": ["¿Por qué aprender las normas de seguridad antes de usar herramientas?", "Las herramientas y máquinas pueden ser peligrosas. Las normas de seguridad, aprendidas con enseñanza y demostración, ayudan a diagnosticar, ajustar y reparar sin riesgos."], "ens": "To use tools and machines without getting hurt.", "ess": "Para usar herramientas y máquinas sin lastimarse.", "fig": null}, {"id": "10-48", "std": "3.5.6-8.J", "en": ["CNC machine", "A computer numerically controlled machine: a tool, like a lathe, that a computer controls to cut materials. Worn parts need adjusting."], "es": ["Máquina CNC", "Una máquina de control numérico por computadora: una herramienta, como un torno, que una computadora controla para cortar materiales. Las piezas gastadas necesitan ajuste."], "ens": "A cutting machine controlled by a computer.", "ess": "Una máquina de corte controlada por una computadora.", "fig": null}, {"id": "10-49", "std": "3.5.6-8.B", "en": ["How can instruments help judge a product?", "Instruments measure how well an everyday product performs, giving evidence to decide if it meets its criteria and constraints."], "es": ["¿Cómo ayudan los instrumentos a evaluar un producto?", "Los instrumentos miden qué tan bien funciona un producto cotidiano y dan evidencia para decidir si cumple sus criterios y restricciones."], "ens": "They measure performance to give evidence.", "ess": "Miden el rendimiento para dar evidencia.", "fig": null}, {"id": "10-50", "std": "3.5.6-8.B", "en": ["Photovoltaic system", "A system of solar panels that changes sunlight directly into electricity."], "es": ["Sistema fotovoltaico", "Un sistema de paneles solares que convierte la luz solar directamente en electricidad."], "ens": "Solar panels that make electricity from sunlight.", "ess": "Paneles solares que producen electricidad con la luz solar.", "fig": null}, {"id": "10-51", "std": "3.5.6-8.B", "en": ["Rated output", "The amount a product is designed to produce. Measuring a solar panel system's power shows if it is working at its rated output."], "es": ["Producción nominal", "La cantidad que un producto está diseñado para producir. Medir la potencia de un sistema de paneles solares muestra si funciona según su producción nominal."], "ens": "How much a product is designed to produce.", "ess": "Cuánto está diseñado para producir un producto.", "fig": null}, {"id": "10-52", "std": "3.5.6-8.L", "en": ["Performance test", "A test that measures how well a product works, such as its accuracy or speed."], "es": ["Prueba de rendimiento", "Una prueba que mide qué tan bien funciona un producto, como su exactitud o su velocidad."], "ens": "A test of how well something works.", "ess": "Una prueba de qué tan bien funciona algo.", "fig": null}, {"id": "10-53", "std": "3.5.6-8.L", "en": ["Destructive testing", "Testing a material until it bends or breaks to measure its strength and durability."], "es": ["Prueba destructiva", "Probar un material hasta que se doble o se rompa para medir su resistencia y durabilidad."], "ens": "Breaking a material to see how strong it is.", "ess": "Romper un material para ver qué tan resistente es.", "fig": null}, {"id": "10-54", "std": "3.5.6-8.L", "en": ["How can you gather data about a technological system?", "Design a test or use a device, like a water or air quality tester, and use digital tools to collect and analyze the data."], "es": ["¿Cómo puedes reunir datos sobre un sistema tecnológico?", "Diseña una prueba o usa un dispositivo, como un medidor de calidad del agua o del aire, y usa herramientas digitales para reunir y analizar los datos."], "ens": "Use tests, devices, and digital tools.", "ess": "Usa pruebas, dispositivos y herramientas digitales.", "fig": null}, {"id": "10-55", "std": "3.5.6-8.C", "en": ["Simulation", "Using a digital model of a system to see what happens. Changing the model shows how outcomes would change."], "es": ["Simulación", "Usar un modelo digital de un sistema para ver qué pasa. Cambiar el modelo muestra cómo cambiarían los resultados."], "ens": "Testing a system with a computer model.", "ess": "Probar un sistema con un modelo de computadora.", "fig": null}, {"id": "10-56", "std": "3.5.6-8.C", "en": ["How could choosing a different design change the outcomes?", "Focusing on different criteria could lead to different effects on people, cultures, and the environment, positive or negative."], "es": ["¿Cómo podría cambiar el resultado si se eligiera otro diseño?", "Dar prioridad a otros criterios podría causar efectos diferentes, positivos o negativos, en las personas, las culturas y el medio ambiente."], "ens": "Different choices lead to different effects.", "ess": "Decisiones diferentes llevan a efectos diferentes.", "fig": null}, {"id": "10-57", "std": "3.5.6-8.I", "en": ["Can a technology be helpful and harmful at the same time?", "Yes. Flush toilets improved health, but they also created a need for water treatment that uses lots of energy and fresh water."], "es": ["¿Puede una tecnología ser útil y dañina al mismo tiempo?", "Sí. Los inodoros con descarga mejoraron la salud, pero también crearon la necesidad de tratar el agua, lo que usa mucha energía y agua dulce."], "ens": "Yes: flush toilets improved health but need energy-hungry water treatment.", "ess": "Sí: los inodoros mejoraron la salud, pero tratar el agua usa mucha energía.", "fig": null}, {"id": "10-58", "std": "3.5.6-8.I", "en": ["What shapes the form and function of a technology?", "The criteria designers choose when developing it. Form is a product's shape; function is what it does."], "es": ["¿Qué determina la forma y la función de una tecnología?", "Los criterios que eligen los diseñadores al desarrollarla. La forma es la figura del producto; la función es lo que hace."], "ens": "The design criteria chosen.", "ess": "Los criterios de diseño elegidos.", "fig": null}, {"id": "10-59", "std": "3.5.6-8.E", "en": ["What effects can a new technology have on society?", "Positive and negative effects, both expected and unexpected. Example: a new phone may help people stay in touch but create electronic waste."], "es": ["¿Qué efectos puede tener una nueva tecnología en la sociedad?", "Efectos positivos y negativos, tanto esperados como inesperados. Ejemplo: un teléfono nuevo puede ayudar a comunicarse pero generar basura electrónica."], "ens": "Good and bad effects, expected and unexpected.", "ess": "Efectos buenos y malos, esperados e inesperados.", "fig": null}, {"id": "10-60", "std": "3.5.6-8.H", "en": ["Why do technology decisions need careful compromise?", "Every technology has benefits and consequences, and people see them from different perspectives, so competing factors must be balanced."], "es": ["¿Por qué las decisiones tecnológicas requieren concesiones cuidadosas?", "Toda tecnología tiene beneficios y consecuencias, y la gente los ve desde distintas perspectivas, así que hay que equilibrar factores en competencia."], "ens": "Every choice has good and bad sides to balance.", "ess": "Toda decisión tiene lados buenos y malos que equilibrar.", "fig": null}, {"id": "10-61", "std": "3.5.6-8.H", "en": ["Design for obsolescence", "Designing products to wear out or go out of date so people buy new ones. It adds to unsustainable rates of consumption."], "es": ["Diseño para la obsolescencia", "Diseñar productos para que se desgasten o pasen de moda y la gente compre otros nuevos. Contribuye a un consumo insostenible."], "ens": "Making products that get replaced quickly.", "ess": "Hacer productos que se reemplazan rápido.", "fig": null}, {"id": "10-62", "std": "3.5.6-8.D", "en": ["Renewable resource", "A resource that can be replaced naturally in a fairly short time if used carefully. Examples: trees, crops."], "es": ["Recurso renovable", "Un recurso que la naturaleza puede reponer en un tiempo relativamente corto si se usa con cuidado. Ejemplos: los árboles, los cultivos."], "ens": "A resource nature can replace fairly quickly.", "ess": "Un recurso que la naturaleza repone bastante rápido.", "fig": null}, {"id": "10-63", "std": "3.5.6-8.D", "en": ["Non-renewable resource", "A resource that cannot be replaced in a human lifetime once it is used up. Examples: oil, coal, metal ores."], "es": ["Recurso no renovable", "Un recurso que no se puede reponer durante una vida humana una vez que se agota. Ejemplos: el petróleo, el carbón, los minerales metálicos."], "ens": "A resource that can't be replaced once used up.", "ess": "Un recurso que no se repone una vez que se agota.", "fig": null}, {"id": "10-64", "std": "3.5.6-8.D", "en": ["Inexhaustible resource", "A resource that will not run out no matter how much people use it. Examples: sunlight and wind."], "es": ["Recurso inagotable", "Un recurso que no se acaba, sin importar cuánto lo use la gente. Ejemplos: la luz solar y el viento."], "ens": "A resource that never runs out.", "ess": "Un recurso que nunca se acaba.", "fig": null}, {"id": "10-65", "std": "3.5.6-8.D", "en": ["How do people get resources from Earth?", "By methods such as harvesting (crops, trees), mining (rocks, metals), and drilling (oil, natural gas)."], "es": ["¿Cómo obtiene la gente recursos de la Tierra?", "Con métodos como la cosecha (cultivos, árboles), la minería (rocas, metales) y la perforación (petróleo, gas natural)."], "ens": "Harvesting, mining, and drilling.", "ess": "Cosecha, minería y perforación.", "fig": null}, {"id": "10-66", "std": "3.5.6-8.D", "en": ["By-product", "Something extra made while producing or getting something else, often waste. Example: rock left over from mining."], "es": ["Subproducto", "Algo adicional que se genera al producir u obtener otra cosa, a menudo desechos. Ejemplo: la roca sobrante de la minería."], "ens": "Something extra made during production, often waste.", "ess": "Algo adicional que se genera al producir, a menudo desechos.", "fig": null}, {"id": "10-67", "std": "3.5.6-8.D", "en": ["Sustainable resource use", "Using resources in a way that meets people's needs now without using them up or harming the environment for the future."], "es": ["Uso sostenible de los recursos", "Usar los recursos de forma que se cubran las necesidades actuales sin agotarlos ni dañar el medio ambiente para el futuro."], "ens": "Using resources so they last into the future.", "ess": "Usar los recursos para que duren en el futuro.", "fig": null}, {"id": "10-68", "std": "3.5.6-8.D", "en": ["How can technology cause environmental challenges?", "Making and using technology uses up resources and creates waste. Some choices trade off the environment against the economy."], "es": ["¿Cómo puede la tecnología causar problemas ambientales?", "Fabricar y usar tecnología consume recursos y genera desechos. Algunas decisiones sacrifican el medio ambiente a cambio de beneficios económicos."], "ens": "It uses resources and makes waste.", "ess": "Consume recursos y genera desechos.", "fig": null}, {"id": "10-69", "std": "3.5.6-8.E", "en": ["Reduce", "Using less of something so less waste is made. Example: printing on both sides of paper."], "es": ["Reducir", "Usar menos de algo para generar menos desechos. Ejemplo: imprimir en ambos lados del papel."], "ens": "Use less to make less waste.", "ess": "Usar menos para generar menos desechos.", "fig": null}, {"id": "10-70", "std": "3.5.6-8.E", "en": ["Reuse", "Using an item again, for the same or a new purpose, instead of throwing it away. Example: refilling a water bottle."], "es": ["Reutilizar", "Volver a usar un objeto, para lo mismo o para otra cosa, en vez de tirarlo. Ejemplo: volver a llenar una botella de agua."], "ens": "Use something again instead of tossing it.", "ess": "Volver a usar algo en vez de tirarlo.", "fig": null}, {"id": "10-71", "std": "3.5.6-8.E", "en": ["Recycle", "Breaking down used materials so they can be made into new products. Example: turning old cans into new aluminum."], "es": ["Reciclar", "Procesar materiales usados para convertirlos en productos nuevos. Ejemplo: convertir latas viejas en aluminio nuevo."], "ens": "Turn used materials into new products.", "ess": "Convertir materiales usados en productos nuevos.", "fig": null}]}];
