:root{--bg:#F4F6F8;--surface:#fff;--ink:#1F2328;--muted:#4f5964;--navy:#1F4E79;--green:#3D6B5A;--line:#D5DCE3;--soft:#EEF3EF;--shadow:0 6px 24px rgba(20,40,60,.12);--u:#1F4E79;--figbg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-hc="1"]){--bg:#11161c;--surface:#1b222a;--ink:#E7ECF1;--muted:#a9b3be;--navy:#8FB8E6;--green:#8CC7AE;--line:#2e3843;--soft:#1f2a26;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-hc="1"]{--bg:#000;--surface:#000;--ink:#fff;--muted:#fff;--navy:#FFE14D;--green:#7CFFB2;--line:#fff;--soft:#000;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.4}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Caladea,Cambria,Georgia,serif;color:var(--navy);margin:0}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:18px}
header .k{font-family:Caladea,serif;font-weight:700;color:var(--green);font-size:17px;letter-spacing:.04em}
header h1{font-size:clamp(30px,5vw,40px);line-height:1.1}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{border:1.5px solid var(--navy);background:var(--surface);color:var(--navy);border-radius:999px;padding:9px 18px;font-weight:700;font-size:18px;min-height:44px}
.who{border-style:dashed}
.lang{display:flex;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--navy);padding:9px 20px;font-weight:700;font-size:18px;min-height:44px}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.tipbox{display:flex;gap:14px;align-items:flex-start;background:var(--soft);border:1.5px solid var(--green);border-left:7px solid var(--green);border-radius:12px;padding:14px 18px;margin:0 0 16px}
.tipbox .ti{font-size:30px;line-height:1}
.tipbox b{font-family:Caladea,serif;color:var(--green);font-size:22px}
.tipbox p{margin:6px 0 0;font-size:18px}
.intro{color:var(--muted);margin:0 0 16px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;border:0;border-radius:14px;padding:16px 18px;background:var(--surface);box-shadow:var(--shadow);border-top:8px solid var(--u);color:var(--ink);transition:transform .15s}
button.tile:hover{transform:translateY(-3px)}
.tile .un{font-weight:700;color:var(--ui,var(--u));font-size:15px;letter-spacing:.04em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-hc="1"]) .tile .un{color:var(--ug,var(--u))}}
:root[data-hc="1"] .tile .un,:root[data-hc="1"] .deckname{color:#fff!important}
.tile .tt{font-family:Caladea,serif;font-weight:700;font-size:21px;color:var(--navy);line-height:1.15}
.tile .ct{color:var(--muted);font-size:16px}
.tile.wide{grid-column:1/-1}
.tile.tough{border-top-color:#C99700}
.tile.review{border-top:8px solid transparent;border-image:linear-gradient(90deg,#2E9E5B,#3A6FB0,#7B4FB8,#D9922B,#A23A5A,#1A9FBF) 1;border-radius:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--navy);background:transparent;color:var(--navy);border-radius:999px;padding:8px 16px;font-weight:700;min-height:44px}
.chip.solid{background:var(--navy);color:var(--surface)}
.chip:disabled{opacity:.45;cursor:default}
.chip.quiet{border-color:var(--muted);color:var(--muted)}
.gradebar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.gradebar .est{font-weight:400;font-size:13px;opacity:.85;margin-left:4px}
.estnote{font-size:15px;color:var(--muted);margin:-4px 0 14px}
details.help{margin-top:26px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 18px}
details.help>summary{cursor:pointer;font-family:Caladea,serif;font-weight:700;color:var(--navy);font-size:21px;padding:14px 0;list-style-position:inside}
.help h3{font-size:19px;margin:12px 0 6px}
.help p{margin:4px 0 8px;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.dl a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--navy));border-radius:10px;padding:10px 12px;min-height:44px}
.dl a:hover{border-color:var(--navy)}
footer{margin-top:28px;color:var(--muted);font-size:15px;text-align:center}
.ver{margin:24px 0 10px;color:var(--muted);font-size:11px;text-align:center;opacity:.7}
/* study */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.back{border:0;background:transparent;color:var(--navy);font-weight:700;padding:8px 0;min-height:44px;font-size:18px}
.deckname{font-family:Caladea,serif;font-weight:700;font-size:20px;color:var(--ui,var(--u))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-hc="1"]) .deckname{color:var(--ug,var(--u))}}
.count{color:var(--muted);font-size:16px}
.prog{flex-basis:100%;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog div{height:100%;width:0;background:var(--u);transition:width .3s}
.stdsel{display:flex;justify-content:center;margin:2px 0 8px}
.stdsel select{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:16px}
.stage{perspective:1600px;margin:6px auto 14px;max-width:900px}
.card{position:relative;display:block;width:100%;border:0;padding:0;background:transparent;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.3,1);text-align:center;color:var(--ink)}
.card.flip{transform:rotateY(180deg)}
.card.pop{animation:pop .38s ease-out}
@keyframes pop{0%{transform:scale(.85) translateY(18px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.pop{animation:none}}
.cin{display:grid;height:min(520px,max(400px,72vh));transform-style:preserve-3d}
.face{position:relative;grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.face .tag{display:flex;justify-content:space-between;background:var(--cu);color:#fff;font-weight:700;font-size:17px;padding:10px 20px}
.face .body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:18px 30px}
.face .body::before,.face .body::after{content:"";flex:1 0 0}
.front .term{font-family:Caladea,serif;font-weight:700;color:var(--navy);font-size:clamp(30px,6vw,50px);line-height:1.15}
.front .en{margin-top:14px;font-style:italic;color:var(--muted);font-size:clamp(19px,3.4vw,26px)}
.front .en b{font-style:normal;font-size:13px;background:var(--muted);color:var(--surface);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.face .hint{font-size:16px;color:var(--muted);padding:0 0 10px}
.backf{transform:rotateY(180deg)}
.backf .t2{font-family:Caladea,serif;font-weight:700;color:var(--navy);font-size:21px;margin-bottom:8px}
.backf .ans{font-size:clamp(21px,3.8vw,30px);line-height:1.38;text-align:left;max-width:760px}
.backf .fig{margin-top:12px;max-width:560px;width:100%;background:var(--figbg);border-radius:10px;padding:6px}
.backf .fig svg{width:100%;height:auto;max-height:210px;display:block}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border-radius:12px;padding:14px 24px;font-weight:700;font-size:19px;background:var(--surface);color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.08);border:1.5px solid var(--line);min-height:44px}
.btn.good{background:#2E7D4F;color:#fff;border-color:#2E7D4F}
.btn.again{background:#B3561E;color:#fff;border-color:#B3561E}
.btn:disabled{opacity:.4;cursor:default}
.btn.prev{font-size:15px;padding:8px 14px;align-self:center;box-shadow:none}
.readrow{display:flex;justify-content:center;margin-top:12px}
.btn.speak{font-size:17px;padding:8px 16px;border-radius:10px;background:var(--navy);color:var(--surface);border-color:var(--navy)}
.done{max-width:640px;margin:20px auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:26px;text-align:center}
.done .big{font-size:40px;font-family:Caladea,serif;font-weight:700;color:var(--u)}
/* options dialog */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--surface);color:var(--ink);width:min(460px,100%);height:100%;overflow:auto;padding:18px 22px 30px;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.panel h2{font-size:24px}
.panel h3{font-size:18px;margin:18px 0 4px;color:var(--green);text-transform:uppercase;letter-spacing:.05em}
.orow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.olab{font-weight:700;font-size:17px;max-width:62%}
.olab small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.ogrp{display:flex;align-items:center;gap:6px}
.obtn{border:1.5px solid var(--navy);background:transparent;color:var(--navy);border-radius:10px;padding:8px 14px;font-weight:700;font-size:17px;min-width:52px;min-height:44px}
.obtn[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.obtn:disabled{opacity:.4}
.oval{min-width:56px;text-align:center;font-weight:700}
.panel select,.panel input{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:17px;min-height:44px}
.keys{font-size:15px;color:var(--muted);margin:6px 0 0;padding-left:18px}
.vrow .ogrp{flex-wrap:wrap}
.vrow select{max-width:230px}
.vtips{margin:4px 0 0;padding:6px 0;border-top:1px solid var(--line)}
.vtips summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:16px;min-height:32px;display:flex;align-items:center}
/* dyslexia-friendly */
html.dys body,html.dys button,html.dys select,html.dys input,html.dys h1,html.dys h2,html.dys h3,html.dys .front .term,html.dys .tile .tt,html.dys .deckname,html.dys .backf .t2,html.dys .tipbox b,html.dys .done .big,html.dys summary{font-family:"LexendEmbed",Verdana,Arial,sans-serif!important}
html.dys body{letter-spacing:.035em;word-spacing:.14em;line-height:1.6}
html.dys .backf .ans{line-height:1.6}
html.dys i,html.dys em,html.dys .front .en{font-style:normal!important}
/* high contrast */
:root[data-hc="1"] .face,:root[data-hc="1"] .tile,:root[data-hc="1"] .tipbox,:root[data-hc="1"] .dl a,:root[data-hc="1"] .done,:root[data-hc="1"] details.help,:root[data-hc="1"] .panel{border:3px solid #fff!important}
:root[data-hc="1"] .face .tag{background:#000!important;border-bottom:3px solid #fff;color:#FFE14D}
:root[data-hc="1"] .btn{background:#000!important;color:#fff!important;border:3px solid #fff!important}
:root[data-hc="1"] .btn.good{color:#7CFFB2!important;border-color:#7CFFB2!important}
:root[data-hc="1"] .btn.again{color:#FFB36B!important;border-color:#FFB36B!important}
:root[data-hc="1"] .btn.speak{color:#FFE14D!important;border-color:#FFE14D!important}
:root[data-hc="1"] .front .term,:root[data-hc="1"] .backf .t2,:root[data-hc="1"] .tile .tt{color:#FFE14D}
:root[data-hc="1"] .front .en b{background:#fff;color:#000}
:root[data-hc="1"] .prog div{background:#FFE14D}
:root[data-hc="1"] :focus-visible{outline:4px solid #FFE14D}
.streak{margin:-6px 0 14px;font-weight:700;color:var(--navy);font-size:18px}
.tile .best{font-size:15px;font-weight:700;color:var(--green)}
.rec{margin:10px auto 6px;padding:12px 16px;border-radius:14px;background:var(--soft);border:1.5px solid var(--green);max-width:460px}
.rec .pct{font-family:Caladea,serif;font-weight:700;font-size:26px;color:var(--navy)}
.rec .pb{font-weight:700;font-size:20px;color:var(--green);margin-top:4px}
.rec .stk{font-size:17px;color:var(--muted);margin-top:4px}
:root[data-hc="1"] .rec{border:3px solid #fff}
[hidden]{display:none!important}
</style></head>
<body>
<div class="wrap">
<header>
  <div><div class="k" id="kicker"></div><h1 id="apptitle"></h1></div>
  <div class="hdr-r">
    <button type="button" class="pill who" id="whoBtn" hidden></button>
    <button type="button" class="pill" id="optBtn" aria-haspopup="dialog"></button>
    <div class="lang" role="group" id="langGrp"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="es" aria-pressed="false" lang="es">Español</button></div>
  </div>
</header>

<main id="home">
  <aside class="tipbox" role="note"><span class="ti" aria-hidden="true">✍️</span><div><b id="tipT"></b><div id="tipP"></div></div></aside>
  <p class="intro" id="intro"></p>
  <p class="streak" id="streakLine" hidden></p>
  <div class="gradebar" id="gradebar" role="group" aria-label="Grade"></div>
  <p class="estnote" id="estnote" hidden></p>
  <div class="grid" id="tiles"></div>
  <details class="help" id="help"><summary id="helpS"></summary><div id="helpBody"></div></details>
  <footer id="foot"></footer>
</main>

<main id="study" hidden>
  <div class="bar">
    <button type="button" class="back" id="backBtn"></button>
    <h2 class="deckname" id="deckname"></h2>
    <div class="count" id="count"></div>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
  </div>
  <div class="stdsel" id="stdWrap" hidden><label><span class="sr" id="stdLab"></span><select id="stdSel"></select></label></div>
  <div class="stage">
    <button type="button" class="card" id="card"><div class="cin">
      <div class="face front" id="faceF"><div class="tag"><span id="fU"></span><span id="fS"></span></div><div class="body"><div class="term" id="fT"></div><div class="en" id="fE" lang="en"></div></div><div class="hint" id="fH"></div></div>
      <div class="face backf" id="faceB" aria-hidden="true"><div class="tag"><span id="bU"></span><span id="bS"></span></div><div class="body"><div class="t2" id="bT"></div><div class="ans" id="bA"></div><div class="fig" id="bF" hidden></div></div><div class="hint" id="bH"></div></div>
    </div></button>
  </div>
  <div class="ctrls">
    <button type="button" class="btn prev" id="prev" disabled></button>
    <button type="button" class="btn again" id="again" disabled></button>
    <button type="button" class="btn good" id="good" disabled></button>
    <button type="button" class="btn" id="skip"></button>
  </div>
  <div class="readrow" id="readRow" hidden><button type="button" class="btn speak" id="speak" aria-pressed="false"></button></div>
</main>

<main id="finish" hidden>
  <div class="done"><h2 class="big" id="dscore"></h2><div class="rec" id="recBox" hidden><div class="pct" id="recPct"></div><div class="pb" id="recPB"></div><div class="stk" id="recStk"></div></div><p id="dtext"></p>
  <div class="ctrls"><button type="button" class="btn good" id="nextset" hidden></button><button type="button" class="btn again" id="redo"></button><button type="button" class="btn" id="restart"></button><button type="button" class="btn" id="home2"></button></div></div>
</main>
<div class="sr" aria-live="polite" id="live"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" id="panel">
    <div class="ph"><h2 id="pTitle"></h2><button type="button" class="obtn" id="pClose"></button></div>
    <h3 id="hStudent"></h3>
    <div class="orow"><label class="olab" for="profSel" id="lProf"></label><select id="profSel"></select></div>
    <div class="orow"><span class="olab" id="lProfAct"></span><div class="ogrp"><button type="button" class="obtn" id="profAdd"></button><button type="button" class="obtn" id="profRen"></button><button type="button" class="obtn" id="profDel"></button></div></div>
    <h3 id="hReading"></h3>
    <div class="orow"><span class="olab" id="lSize"></span><div class="ogrp"><button type="button" class="obtn" id="szDn">A−</button><span class="oval" id="szVal"></span><button type="button" class="obtn" id="szUp">A+</button></div></div>
    <div class="orow"><span class="olab" id="lSimple"></span><button type="button" class="obtn" id="tSimple"></button></div>
    <div class="orow"><span class="olab" id="lPics"></span><button type="button" class="obtn" id="tPics"></button></div>
    <div class="orow"><span class="olab" id="lDys"></span><button type="button" class="obtn" id="tDys"></button></div>
    <div class="orow"><span class="olab" id="lHc"></span><button type="button" class="obtn" id="tHc"></button></div>
    <h3 id="hRead"></h3>
    <div class="orow"><span class="olab" id="lAuto"></span><button type="button" class="obtn" id="tAuto"></button></div>
    <div class="orow"><label class="olab" for="rate" id="lRate"></label><select id="rate"><option value="0.75"></option><option value="1"></option><option value="1.25"></option></select></div>
    <div class="orow vrow"><label class="olab" for="vEn" id="lVEn"></label><div class="ogrp"><select id="vEn"></select><button type="button" class="obtn" id="tstEn"></button></div></div>
    <div class="orow vrow"><label class="olab" for="vEs" id="lVEs"></label><div class="ogrp"><select id="vEs"></select><button type="button" class="obtn" id="tstEs"></button></div></div>
    <details class="vtips" id="vTips"><summary id="vtS"></summary><ul class="keys" id="vtL"></ul></details>
    <h3 id="hStudy"></h3>
    <div class="orow"><span class="olab" id="lScores"></span><button type="button" class="obtn" id="tScores"></button></div>
    <div class="orow"><span class="olab" id="lClearRec"></span><button type="button" class="obtn" id="clearRec"></button></div>
    <div class="orow"><span class="olab" id="lSet"></span><div class="ogrp" id="setGrp" role="group"><button type="button" class="obtn" data-set="0"></button><button type="button" class="obtn" data-set="10">10</button><button type="button" class="obtn" data-set="5">5</button></div></div>
    <h3 id="hKeys"></h3>
    <ul class="keys" id="keysList"></ul>
    <div class="orow" style="margin-top:12px"><span class="olab" id="lReset"></span><button type="button" class="obtn" id="resetBtn"></button></div>
  </div>
</div>

<script>
const UNITS = [{"n": 4, "grade": 7, "u": 1, "color": "#C2410C", "ink": "#a4370a", "glow": "#f2510f", "title": {"en": "Forces and Motion", "es": "Fuerzas y movimiento"}, "cards": [{"id": "4-1", "std": "3.2.6-8.H", "en": ["Force", "A push or a pull on an object. Every force has a strength and a direction."], "es": ["Fuerza", "Un empuje o un jalón sobre un objeto. Toda fuerza tiene una intensidad y una dirección."], "ens": "A push or a pull with strength and direction.", "ess": "Un empuje o jalón con intensidad y dirección.", "fig": null}, {"id": "4-2", "std": "3.2.6-8.H", "en": ["Mass", "The amount of matter in an object. More mass means it takes more force to change the object's motion."], "es": ["Masa", "La cantidad de materia en un objeto. Más masa significa que se necesita más fuerza para cambiar su movimiento."], "ens": "How much matter an object has.", "ess": "Cuánta materia tiene un objeto.", "fig": null}, {"id": "4-3", "std": "3.2.6-8.H", "en": ["Frame of reference", "The starting point and directions you choose to describe where things are and how they move. Example: \"3 m east of the door.\""], "es": ["Marco de referencia", "El punto de partida y las direcciones que eliges para describir dónde están las cosas y cómo se mueven. Ejemplo: \"3 m al este de la puerta\"."], "ens": "The point and directions you use to describe motion.", "ess": "El punto y las direcciones para describir el movimiento.", "fig": null}, {"id": "4-4", "std": "3.2.6-8.H", "en": ["Units", "Agreed-on sizes for measuring, like meters for distance or newtons for force. Always write the unit with a number."], "es": ["Unidades", "Tamaños acordados para medir, como metros para la distancia o newtons para la fuerza. Siempre escribe la unidad con el número."], "ens": "Standard sizes for measuring, like meters.", "ess": "Tamaños estándar para medir, como los metros.", "fig": null}, {"id": "4-5", "std": "3.2.6-8.H", "en": ["Why must you share your reference frame and units?", "Your choices of reference frame and units are up to you. Others need to know them to understand your positions, directions, and data."], "es": ["¿Por qué debes compartir tu marco de referencia y unidades?", "Tú eliges tu marco de referencia y tus unidades. Los demás necesitan conocerlos para entender tus posiciones, direcciones y datos."], "ens": "So others can understand your data.", "ess": "Para que otros puedan entender tus datos.", "fig": null}, {"id": "4-6", "std": "3.2.6-8.H", "en": ["Net force (sum of forces)", "All the forces on an object added together, counting their directions. Example: 5 N right and 3 N left make a net force of 2 N right."], "es": ["Fuerza neta (suma de fuerzas)", "Todas las fuerzas sobre un objeto sumadas, teniendo en cuenta sus direcciones. Ejemplo: 5 N a la derecha y 3 N a la izquierda dan 2 N a la derecha."], "ens": "All forces on an object added together.", "ess": "Todas las fuerzas sobre un objeto sumadas.", "fig": null}, {"id": "4-7", "std": "3.2.6-8.H", "en": ["Balanced forces", "Forces on an object that cancel out, so the net force is zero. The object's motion does not change."], "es": ["Fuerzas equilibradas", "Fuerzas sobre un objeto que se cancelan, así que la fuerza neta es cero. El movimiento del objeto no cambia."], "ens": "Forces cancel out; motion stays the same.", "ess": "Las fuerzas se cancelan; el movimiento no cambia.", "fig": null}, {"id": "4-8", "std": "3.2.6-8.H", "en": ["Unbalanced forces", "Forces on an object that do not cancel out, so the net force is not zero. The object speeds up, slows down, or changes direction."], "es": ["Fuerzas no equilibradas", "Fuerzas sobre un objeto que no se cancelan, así que la fuerza neta no es cero. El objeto acelera, frena o cambia de dirección."], "ens": "Forces don't cancel; motion changes.", "ess": "Las fuerzas no se cancelan; el movimiento cambia.", "fig": null}, {"id": "4-9", "std": "3.2.6-8.H", "en": ["Newton's first law", "If the forces on an object are balanced, its motion stays the same: an object at rest stays at rest, and a moving object keeps the same speed and direction."], "es": ["Primera ley de Newton", "Si las fuerzas sobre un objeto están equilibradas, su movimiento no cambia: un objeto en reposo sigue en reposo y uno en movimiento sigue igual de rápido y en la misma dirección."], "ens": "Balanced forces mean motion does not change.", "ess": "Con fuerzas equilibradas, el movimiento no cambia.", "fig": null}, {"id": "4-10", "std": "3.2.6-8.H", "en": ["Newton's second law", "An object's change in motion depends on the net force and its mass. More force means a bigger change; more mass means a smaller change."], "es": ["Segunda ley de Newton", "El cambio de movimiento de un objeto depende de la fuerza neta y de su masa. Más fuerza da un cambio mayor; más masa da un cambio menor."], "ens": "Change in motion depends on force and mass.", "ess": "El cambio de movimiento depende de la fuerza y la masa.", "fig": null}, {"id": "4-11", "std": "3.2.6-8.H", "en": ["How does a bigger force affect an object's motion?", "For the same object, a larger force causes a larger change in motion. Kicking a ball harder makes it speed up more."], "es": ["¿Cómo afecta una fuerza mayor al movimiento de un objeto?", "Para el mismo objeto, una fuerza mayor causa un cambio de movimiento mayor. Si pateas un balón más fuerte, acelera más."], "ens": "Bigger force, bigger change in motion.", "ess": "Más fuerza, mayor cambio de movimiento.", "fig": null}, {"id": "4-12", "std": "3.2.6-8.H", "en": ["How does mass affect the force needed to change motion?", "The greater the mass, the greater the force needed for the same change in motion. A full cart is harder to start than an empty one."], "es": ["¿Cómo afecta la masa a la fuerza necesaria para cambiar el movimiento?", "Cuanto mayor es la masa, mayor es la fuerza necesaria para el mismo cambio de movimiento. Un carrito lleno es más difícil de mover que uno vacío."], "ens": "More mass needs more force to change motion.", "ess": "Más masa necesita más fuerza para cambiar el movimiento.", "fig": null}, {"id": "4-13", "std": "3.2.6-8.G", "en": ["Newton's third law", "When two objects interact, they push or pull on each other with forces that are equal in strength and opposite in direction."], "es": ["Tercera ley de Newton", "Cuando dos objetos interactúan, se empujan o jalan entre sí con fuerzas de igual intensidad y en direcciones opuestas."], "ens": "Two objects push each other equally, in opposite directions.", "ess": "Dos objetos se empujan igual, en direcciones opuestas.", "fig": null}, {"id": "4-14", "std": "3.2.6-8.G", "en": ["Collision", "When two moving objects, or a moving and a still object, hit each other. Example: a car hitting a wall."], "es": ["Choque (colisión)", "Cuando dos objetos en movimiento, o uno en movimiento y otro quieto, se golpean. Ejemplo: un carro que choca contra una pared."], "ens": "When objects hit each other.", "ess": "Cuando dos objetos se golpean.", "fig": null}, {"id": "4-15", "std": "3.2.6-8.G", "en": ["When a car hits a wall, which pushes harder?", "Neither. By Newton's third law, the car pushes on the wall exactly as hard as the wall pushes on the car, in the opposite direction."], "es": ["Cuando un carro choca contra una pared, ¿cuál empuja más fuerte?", "Ninguno. Por la tercera ley de Newton, el carro empuja la pared con la misma fuerza con que la pared empuja al carro, en dirección opuesta."], "ens": "Neither; the forces are equal and opposite.", "ess": "Ninguno; las fuerzas son iguales y opuestas.", "fig": null}, {"id": "4-16", "std": "3.2.6-8.G", "en": ["How does Newton's third law help design for collisions?", "Each object in a collision gets an equal, opposite force. Engineers use this to design ways to reduce damage, like car bumpers or spacecraft shields against meteors."], "es": ["¿Cómo ayuda la tercera ley de Newton a diseñar para choques?", "Cada objeto en un choque recibe una fuerza igual y opuesta. Los ingenieros usan esto para diseñar formas de reducir el daño, como parachoques de carros o escudos de naves espaciales contra meteoros."], "ens": "Both objects get equal force, so engineers design to reduce damage.", "ess": "Ambos reciben igual fuerza; los ingenieros diseñan para reducir el daño.", "fig": null}, {"id": "4-17", "std": "3.2.6-8.I", "en": ["Electric charge", "A property of matter that causes electric forces. Objects with charge can push or pull on other charged objects."], "es": ["Carga eléctrica", "Una propiedad de la materia que causa fuerzas eléctricas. Los objetos con carga pueden empujar o jalar a otros objetos con carga."], "ens": "What causes electric forces between objects.", "ess": "Lo que causa fuerzas eléctricas entre objetos.", "fig": null}, {"id": "4-18", "std": "3.2.6-8.I", "en": ["Electric current", "A flow of electric charge, like in a wire. Electric currents can cause magnetic forces, as in an electromagnet."], "es": ["Corriente eléctrica", "Un flujo de carga eléctrica, como en un cable. Las corrientes eléctricas pueden causar fuerzas magnéticas, como en un electroimán."], "ens": "Moving electric charge, like in a wire.", "ess": "Carga eléctrica en movimiento, como en un cable.", "fig": null}, {"id": "4-19", "std": "3.2.6-8.I", "en": ["Electric force", "A push or pull between objects with electric charge. Example: a charged strip of tape pulling on another strip."], "es": ["Fuerza eléctrica", "Un empuje o jalón entre objetos con carga eléctrica. Ejemplo: una tira de cinta cargada que atrae a otra tira."], "ens": "Push or pull between charged objects.", "ess": "Empuje o jalón entre objetos con carga.", "fig": null}, {"id": "4-20", "std": "3.2.6-8.I", "en": ["Magnetic force", "A push or pull caused by magnets or by electric currents. Example: two magnets snapping together."], "es": ["Fuerza magnética", "Un empuje o jalón causado por imanes o por corrientes eléctricas. Ejemplo: dos imanes que se juntan de golpe."], "ens": "Push or pull from magnets or currents.", "ess": "Empuje o jalón de imanes o corrientes.", "fig": null}, {"id": "4-21", "std": "3.2.6-8.I", "en": ["Electromagnetic force", "The name for electric and magnetic forces together. These forces can attract or repel."], "es": ["Fuerza electromagnética", "El nombre de las fuerzas eléctricas y magnéticas juntas. Estas fuerzas pueden atraer o repeler."], "ens": "Electric and magnetic forces together.", "ess": "Las fuerzas eléctricas y magnéticas juntas.", "fig": null}, {"id": "4-22", "std": "3.2.6-8.I", "en": ["Attract", "To pull toward each other. Example: the opposite ends of two magnets attract."], "es": ["Atraer", "Jalar uno hacia el otro. Ejemplo: los extremos opuestos de dos imanes se atraen."], "ens": "To pull toward each other.", "ess": "Jalar uno hacia el otro.", "fig": null}, {"id": "4-23", "std": "3.2.6-8.I", "en": ["Repel", "To push away from each other. Example: the matching ends of two magnets repel."], "es": ["Repeler", "Empujar para alejarse uno del otro. Ejemplo: los extremos iguales de dos imanes se repelen."], "ens": "To push away from each other.", "ess": "Empujar para alejarse uno del otro.", "fig": null}, {"id": "4-24", "std": "3.2.6-8.I", "en": ["What makes electric and magnetic forces stronger?", "Bigger charges, bigger currents, or stronger magnets make the force stronger. So does moving the objects closer together."], "es": ["¿Qué hace más fuertes las fuerzas eléctricas y magnéticas?", "Cargas mayores, corrientes mayores o imanes más fuertes hacen la fuerza más fuerte. También acercar los objetos."], "ens": "More charge, current, or magnet strength; less distance.", "ess": "Más carga, corriente o imán; menos distancia.", "fig": null}, {"id": "4-25", "std": "3.2.6-8.I", "en": ["How does distance affect electric and magnetic forces?", "The farther apart the objects are, the weaker the force. Two magnets pull hard up close but barely at all when far apart."], "es": ["¿Cómo afecta la distancia a las fuerzas eléctricas y magnéticas?", "Cuanto más separados están los objetos, más débil es la fuerza. Dos imanes se atraen mucho de cerca, pero casi nada de lejos."], "ens": "Farther apart means a weaker force.", "ess": "Más separados, más débil es la fuerza.", "fig": null}, {"id": "4-26", "std": "3.2.6-8.I", "en": ["Electromagnet", "A magnet made by running electric current through a coil of wire. It can be turned on and off."], "es": ["Electroimán", "Un imán que se hace pasando corriente eléctrica por una bobina de alambre. Se puede encender y apagar."], "ens": "A magnet made with current in a wire coil.", "ess": "Un imán hecho con corriente en una bobina.", "fig": null}, {"id": "4-27", "std": "3.2.6-8.I", "en": ["How can you make an electromagnet stronger?", "Add more turns of wire to the coil or use more current. Both make its magnetic force stronger."], "es": ["¿Cómo puedes hacer más fuerte un electroimán?", "Agrega más vueltas de alambre a la bobina o usa más corriente. Ambas cosas hacen más fuerte su fuerza magnética."], "ens": "More wire turns or more current.", "ess": "Más vueltas de alambre o más corriente.", "fig": null}, {"id": "4-28", "std": "3.2.6-8.I", "en": ["Electric motor", "A device that uses electric and magnetic forces to make something spin. Stronger or more magnets can make it spin faster."], "es": ["Motor eléctrico", "Un aparato que usa fuerzas eléctricas y magnéticas para hacer girar algo. Imanes más fuertes o más imanes pueden hacerlo girar más rápido."], "ens": "Uses electric and magnetic forces to spin.", "ess": "Usa fuerzas eléctricas y magnéticas para girar.", "fig": null}, {"id": "4-29", "std": "3.2.6-8.I", "en": ["Generator", "A device that uses magnets and motion to produce an electric current."], "es": ["Generador", "Un aparato que usa imanes y movimiento para producir una corriente eléctrica."], "ens": "Uses magnets and motion to make current.", "ess": "Usa imanes y movimiento para producir corriente.", "fig": null}, {"id": "4-30", "std": "3.2.6-8.J", "en": ["Gravitational force (gravity)", "A force that pulls any two masses toward each other. Gravity is always attractive; it never pushes."], "es": ["Fuerza gravitacional (gravedad)", "Una fuerza que atrae dos masas cualesquiera entre sí. La gravedad siempre atrae; nunca empuja."], "ens": "A pull between any two masses.", "ess": "Una atracción entre dos masas cualesquiera.", "fig": null}, {"id": "4-31", "std": "3.2.6-8.J", "en": ["How does mass affect gravitational force?", "The more mass the objects have, the stronger the gravity between them. That is why the sun's pull holds the planets."], "es": ["¿Cómo afecta la masa a la fuerza gravitacional?", "Cuanta más masa tienen los objetos, más fuerte es la gravedad entre ellos. Por eso la atracción del Sol mantiene a los planetas."], "ens": "More mass means stronger gravity.", "ess": "Más masa significa más gravedad.", "fig": null}, {"id": "4-32", "std": "3.2.6-8.J", "en": ["Why don't you feel gravity between two pencils?", "There is gravity between any two masses, but it is very small unless one object has a large mass, like Earth or the sun."], "es": ["¿Por qué no sientes la gravedad entre dos lápices?", "Hay gravedad entre dos masas cualesquiera, pero es muy pequeña a menos que un objeto tenga mucha masa, como la Tierra o el Sol."], "ens": "It's tiny unless an object is huge.", "ess": "Es muy pequeña si los objetos no son enormes.", "fig": null}, {"id": "4-33", "std": "3.2.6-8.J", "en": ["Orbital period", "The time an object takes to go once around another object. Earth's orbital period around the sun is about 365 days."], "es": ["Período orbital", "El tiempo que tarda un objeto en dar una vuelta completa alrededor de otro. El período orbital de la Tierra alrededor del Sol es de unos 365 días."], "ens": "Time for one trip around another object.", "ess": "Tiempo de una vuelta alrededor de otro objeto.", "fig": null}, {"id": "4-34", "std": "3.2.6-8.K", "en": ["Force at a distance", "A force that acts without objects touching. Electric, magnetic, and gravitational forces act at a distance."], "es": ["Fuerza a distancia", "Una fuerza que actúa sin que los objetos se toquen. Las fuerzas eléctricas, magnéticas y gravitacionales actúan a distancia."], "ens": "A force that works without touching.", "ess": "Una fuerza que actúa sin tocar.", "fig": null}, {"id": "4-35", "std": "3.2.6-8.K", "en": ["Field", "A region in space around an object where it can push or pull on other objects without touching them."], "es": ["Campo", "Una región del espacio alrededor de un objeto donde puede empujar o jalar otros objetos sin tocarlos."], "ens": "Space where a force acts without touching.", "ess": "Espacio donde una fuerza actúa sin tocar.", "fig": null}, {"id": "4-36", "std": "3.2.6-8.K", "en": ["Electric field", "The field around a charged object. Example: a charged balloon pulls on a tiny pith ball before they touch."], "es": ["Campo eléctrico", "El campo alrededor de un objeto con carga. Ejemplo: un globo cargado atrae una bolita de médula antes de que se toquen."], "ens": "The field around a charged object.", "ess": "El campo alrededor de un objeto con carga.", "fig": null}, {"id": "4-37", "std": "3.2.6-8.K", "en": ["Magnetic field", "The field around a magnet or electric current. Example: a magnet moves a paper clip before they touch."], "es": ["Campo magnético", "El campo alrededor de un imán o de una corriente eléctrica. Ejemplo: un imán mueve un clip antes de tocarlo."], "ens": "The field around a magnet or current.", "ess": "El campo alrededor de un imán o corriente.", "fig": null}, {"id": "4-38", "std": "3.2.6-8.K", "en": ["Test object", "An object used to map a field by seeing how it is pushed or pulled at different spots. A small charged object can map an electric field."], "es": ["Objeto de prueba", "Un objeto que se usa para trazar un campo al ver cómo es empujado o atraído en distintos lugares. Un objeto pequeño con carga puede trazar un campo eléctrico."], "ens": "An object used to find and map a field.", "ess": "Un objeto para encontrar y trazar un campo.", "fig": null}, {"id": "4-39", "std": "3.2.6-8.K", "en": ["What evidence shows a field exists?", "Objects move or change without touching. Example: two charged strips of tape push apart while still separated."], "es": ["¿Qué evidencia muestra que existe un campo?", "Los objetos se mueven o cambian sin tocarse. Ejemplo: dos tiras de cinta con carga se separan sin tocarse."], "ens": "Objects push or pull without touching.", "ess": "Los objetos se empujan o atraen sin tocarse.", "fig": null}]}, {"n": 5, "grade": 7, "u": 2, "color": "#B7791F", "ink": "#9b661a", "glow": "#e49726", "title": {"en": "Energy", "es": "Energía"}, "cards": [{"id": "5-1", "std": "3.2.6-8.L", "en": ["Energy", "The ability to cause change, such as making something move or warm up."], "es": ["Energía", "La capacidad de causar cambios, como hacer que algo se mueva o se caliente."], "ens": "The ability to cause change.", "ess": "La capacidad de causar cambios.", "fig": null}, {"id": "5-2", "std": "3.2.6-8.L", "en": ["Kinetic energy", "The energy of motion (also called motion energy). Anything that is moving has kinetic energy."], "es": ["Energía cinética", "La energía del movimiento (también llamada energía de movimiento). Todo lo que se mueve tiene energía cinética."], "ens": "Energy of motion.", "ess": "Energía del movimiento.", "fig": null}, {"id": "5-3", "std": "3.2.6-8.L", "en": ["How does mass affect kinetic energy?", "At the same speed, more mass means more kinetic energy. Double the mass, double the kinetic energy. A tennis ball hits harder than a wiffle ball."], "es": ["¿Cómo afecta la masa a la energía cinética?", "A la misma rapidez, más masa significa más energía cinética. El doble de masa da el doble de energía cinética. Una pelota de tenis golpea más fuerte que una de wiffle."], "ens": "More mass, more kinetic energy.", "ess": "Más masa, más energía cinética.", "fig": null}, {"id": "5-4", "std": "3.2.6-8.L", "en": ["How does speed affect kinetic energy?", "Kinetic energy grows with the square of speed. Double the speed and the kinetic energy becomes 4 times as large."], "es": ["¿Cómo afecta la rapidez a la energía cinética?", "La energía cinética crece con el cuadrado de la rapidez. Si duplicas la rapidez, la energía cinética se hace 4 veces mayor."], "ens": "Twice as fast means 4 times the energy.", "ess": "El doble de rapidez da 4 veces la energía.", "fig": null}, {"id": "5-5", "std": "3.2.6-8.M", "en": ["Particles", "The tiny pieces, such as atoms, that all matter is made of. They are always moving."], "es": ["Partículas", "Los pedacitos diminutos, como los átomos, que forman toda la materia. Siempre están en movimiento."], "ens": "Tiny moving pieces that make up matter.", "ess": "Pedacitos diminutos en movimiento que forman la materia.", "fig": null}, {"id": "5-6", "std": "3.2.6-8.M", "en": ["Temperature (in science)", "A measure of the average kinetic energy of the particles in matter. Higher temperature means the particles move faster on average."], "es": ["Temperatura (en ciencias)", "Una medida de la energía cinética promedio de las partículas de la materia. Mayor temperatura significa que las partículas se mueven más rápido en promedio."], "ens": "Measures how fast particles move on average.", "ess": "Mide qué tan rápido se mueven las partículas en promedio.", "fig": null}, {"id": "5-7", "std": "3.2.6-8.M", "en": ["Thermal energy", "The total energy of the moving particles in a sample of matter. Adding thermal energy makes the particles move faster."], "es": ["Energía térmica", "La energía total de las partículas en movimiento de una muestra de materia. Agregar energía térmica hace que las partículas se muevan más rápido."], "ens": "Total energy of moving particles in matter.", "ess": "Energía total de las partículas en movimiento.", "fig": null}, {"id": "5-8", "std": "3.2.6-8.M", "en": ["Which way does thermal energy move on its own?", "From hotter objects or places to colder ones. A hot drink warms your cold hands."], "es": ["¿Hacia dónde se mueve sola la energía térmica?", "De los objetos o lugares más calientes a los más fríos. Una bebida caliente calienta tus manos frías."], "ens": "From hotter to colder.", "ess": "De lo más caliente a lo más frío.", "fig": null}, {"id": "5-9", "std": "3.2.6-8.M", "en": ["Thermal energy transfer", "The movement of thermal energy from one object or place to another, always from hotter to colder on its own."], "es": ["Transferencia de energía térmica", "El paso de energía térmica de un objeto o lugar a otro; por sí sola siempre va de lo más caliente a lo más frío."], "ens": "Thermal energy moving from hot to cold.", "ess": "Energía térmica que pasa de lo caliente a lo frío.", "fig": null}, {"id": "5-10", "std": "3.2.6-8.M", "en": ["Insulation", "Material that slows down thermal energy transfer. A Styrofoam cup or insulated box keeps things hot or cold longer."], "es": ["Aislamiento", "Material que hace más lenta la transferencia de energía térmica. Un vaso de poliestireno o una caja aislada mantiene las cosas calientes o frías más tiempo."], "ens": "Material that slows thermal energy transfer.", "ess": "Material que frena la transferencia de energía térmica.", "fig": null}, {"id": "5-11", "std": "3.2.6-8.M", "en": ["Solar cooker", "A device designed to collect energy from sunlight and keep it inside to heat food. It maximizes thermal energy transfer to the food."], "es": ["Horno solar", "Un aparato diseñado para captar la energía de la luz solar y mantenerla adentro para calentar comida. Maximiza la transferencia de energía térmica a la comida."], "ens": "Uses sunlight to heat food.", "ess": "Usa la luz del sol para calentar comida.", "fig": null}, {"id": "5-12", "std": "3.2.6-8.M", "en": ["Why define a design's criteria and constraints precisely?", "The more clearly you define what the design must do and its limits, the more likely your solution will succeed."], "es": ["¿Por qué definir con precisión los criterios y restricciones?", "Cuanto más claro defines lo que el diseño debe lograr y sus límites, más probable es que tu solución funcione."], "ens": "Clear goals and limits help designs succeed.", "ess": "Metas y límites claros ayudan al diseño.", "fig": null}, {"id": "5-13", "std": "3.2.6-8.M", "en": ["Why test a design solution?", "Testing shows how well it works. You then change, or modify, the design based on the results to improve it."], "es": ["¿Por qué poner a prueba una solución de diseño?", "Las pruebas muestran qué tan bien funciona. Luego cambias, o modificas, el diseño según los resultados para mejorarlo."], "ens": "To find out how to improve it.", "ess": "Para saber cómo mejorarlo.", "fig": null}, {"id": "5-14", "std": "3.2.6-8.M", "en": ["How do engineers evaluate solutions?", "They use a step-by-step (systematic) process to check how well each solution meets the criteria and constraints."], "es": ["¿Cómo evalúan las soluciones los ingenieros?", "Usan un proceso paso a paso (sistemático) para revisar qué tan bien cada solución cumple los criterios y las restricciones."], "ens": "Step by step, against criteria and constraints.", "ess": "Paso a paso, según criterios y restricciones.", "fig": null}, {"id": "5-15", "std": "3.2.6-8.N", "en": ["System", "The group of objects or matter you choose to study together. Example: a cup of water and the ice in it."], "es": ["Sistema", "El grupo de objetos o materia que eliges estudiar juntos. Ejemplo: un vaso de agua y el hielo que contiene."], "ens": "The group of things you study together.", "ess": "El grupo de cosas que estudias juntas.", "fig": null}, {"id": "5-16", "std": "3.2.6-8.N", "en": ["Are temperature and total energy the same thing?", "No. A system's total energy at a given temperature depends on the types, states, and amounts of matter in it."], "es": ["¿Son lo mismo la temperatura y la energía total?", "No. La energía total de un sistema a cierta temperatura depende de los tipos, estados y cantidades de materia que contiene."], "ens": "No; it depends on the type and amount of matter.", "ess": "No; depende del tipo y cantidad de materia.", "fig": null}, {"id": "5-17", "std": "3.2.6-8.N", "en": ["What affects the energy needed to change a temperature?", "The type of matter, the size (mass) of the sample, and the environment around it."], "es": ["¿Qué afecta la energía necesaria para cambiar una temperatura?", "El tipo de materia, el tamaño (masa) de la muestra y el ambiente que la rodea."], "ens": "Type of matter, mass, and environment.", "ess": "Tipo de materia, masa y ambiente.", "fig": null}, {"id": "5-18", "std": "3.2.6-8.N", "en": ["Same energy added: does a small or large mass warm more?", "The smaller mass of the same material warms more. A large mass needs more energy for the same temperature change."], "es": ["Con la misma energía, ¿se calienta más una masa pequeña o grande?", "La masa más pequeña del mismo material se calienta más. Una masa grande necesita más energía para el mismo cambio de temperatura."], "ens": "The smaller mass warms more.", "ess": "La masa más pequeña se calienta más.", "fig": null}, {"id": "5-19", "std": "3.2.6-8.N", "en": ["Do all materials change temperature the same way?", "No. Samples of different materials with the same mass change temperature by different amounts when heated or cooled."], "es": ["¿Todos los materiales cambian de temperatura igual?", "No. Muestras de distintos materiales con la misma masa cambian de temperatura en cantidades diferentes al calentarse o enfriarse."], "ens": "No; different materials change by different amounts.", "ess": "No; cada material cambia en distinta cantidad.", "fig": null}, {"id": "5-20", "std": "3.2.6-8.N", "en": ["Why does water get colder when ice melts in it?", "Thermal energy moves from the warmer water into the colder ice. More ice takes more energy, so the water ends up colder."], "es": ["¿Por qué el agua se enfría cuando el hielo se derrite en ella?", "La energía térmica pasa del agua más caliente al hielo más frío. Más hielo absorbe más energía, así que el agua termina más fría."], "ens": "Energy moves from the water into the ice.", "ess": "La energía pasa del agua al hielo.", "fig": null}, {"id": "5-21", "std": "3.2.6-8.O", "en": ["Energy transfer", "When energy moves from one object or place to another. Example: a moving ball hits a still ball and makes it move."], "es": ["Transferencia de energía", "Cuando la energía pasa de un objeto o lugar a otro. Ejemplo: una pelota en movimiento golpea a una quieta y la hace moverse."], "ens": "Energy moving from one thing to another.", "ess": "Energía que pasa de una cosa a otra.", "fig": null}, {"id": "5-22", "std": "3.2.6-8.O", "en": ["What happens when an object's kinetic energy changes?", "Energy is transferred to or from the object. Some other change in energy always happens at the same time."], "es": ["¿Qué pasa cuando cambia la energía cinética de un objeto?", "Se transfiere energía hacia el objeto o desde él. Siempre ocurre otro cambio de energía al mismo tiempo."], "ens": "Energy moves into or out of the object.", "ess": "La energía entra o sale del objeto.", "fig": null}, {"id": "5-23", "std": "3.2.6-8.O", "en": ["Conservation of energy", "Energy is not created or destroyed. It is transferred between objects or changes form."], "es": ["Conservación de la energía", "La energía no se crea ni se destruye. Se transfiere entre objetos o cambia de forma."], "ens": "Energy is never made or destroyed.", "ess": "La energía nunca se crea ni se destruye.", "fig": null}, {"id": "5-24", "std": "3.2.6-8.O", "en": ["How can you show energy before and after a transfer?", "Make an energy inventory: a list or diagram of where energy is before and after, using evidence like motion or temperature changes."], "es": ["¿Cómo puedes mostrar la energía antes y después de una transferencia?", "Haz un inventario de energía: una lista o diagrama de dónde está la energía antes y después, con evidencia como cambios de movimiento o temperatura."], "ens": "List where energy is before and after.", "ess": "Anota dónde está la energía antes y después.", "fig": null}, {"id": "5-25", "std": "3.2.6-8.P", "en": ["Potential energy", "Stored energy in a system that depends on the positions of the objects in it. Example: a book on a high shelf."], "es": ["Energía potencial", "Energía almacenada en un sistema que depende de las posiciones de sus objetos. Ejemplo: un libro en un estante alto."], "ens": "Stored energy based on position.", "ess": "Energía almacenada según la posición.", "fig": null}, {"id": "5-26", "std": "3.2.6-8.P", "en": ["How does height change stored energy with Earth?", "The higher an object is above the ground, the more potential energy the object-Earth system stores. A roller coaster cart has the most at the top of the hill."], "es": ["¿Cómo cambia la altura la energía almacenada con la Tierra?", "Cuanto más alto está un objeto, más energía potencial almacena el sistema objeto-Tierra. Un carro de montaña rusa tiene más en la cima."], "ens": "Higher up means more stored energy.", "ess": "Más alto, más energía almacenada.", "fig": null}, {"id": "5-27", "std": "3.2.6-8.P", "en": ["Can magnets store potential energy?", "Yes. Changing the distance between two magnets, or turning one around, changes how much potential energy is stored."], "es": ["¿Pueden los imanes almacenar energía potencial?", "Sí. Cambiar la distancia entre dos imanes, o girar uno, cambia cuánta energía potencial se almacena."], "ens": "Yes; it changes with distance and direction.", "ess": "Sí; cambia con la distancia y la dirección.", "fig": null}, {"id": "5-28", "std": "3.2.6-8.P", "en": ["What changes when a charged balloon nears someone's hair?", "As the distance changes, the amount of stored electric potential energy in the balloon-hair system changes."], "es": ["¿Qué cambia cuando un globo cargado se acerca al cabello?", "Al cambiar la distancia, cambia la cantidad de energía potencial eléctrica almacenada en el sistema globo-cabello."], "ens": "The stored energy changes with distance.", "ess": "La energía almacenada cambia con la distancia.", "fig": null}, {"id": "5-29", "std": "3.2.6-8.P", "en": ["How are forces and energy transfer connected?", "When two objects interact, each pushes or pulls on the other. These forces can transfer energy to or from the objects."], "es": ["¿Cómo se relacionan las fuerzas y la transferencia de energía?", "Cuando dos objetos interactúan, cada uno empuja o jala al otro. Estas fuerzas pueden transferir energía hacia los objetos o desde ellos."], "ens": "Forces between objects can transfer energy.", "ess": "Las fuerzas entre objetos pueden transferir energía.", "fig": null}]}, {"n": 6, "grade": 7, "u": 3, "color": "#6B46C1", "ink": "#5a3ba4", "glow": "#8557f1", "title": {"en": "Waves and Information", "es": "Ondas e información"}, "cards": [{"id": "6-1", "std": "3.2.6-8.Q", "en": ["Wave", "A repeating disturbance that carries energy from place to place. Examples: ripples on water or sound."], "es": ["Onda", "Una perturbación que se repite y lleva energía de un lugar a otro. Ejemplos: ondas en el agua o el sonido."], "ens": "A repeating pattern that carries energy.", "ess": "Un patrón que se repite y lleva energía.", "fig": null}, {"id": "6-2", "std": "3.2.6-8.Q", "en": ["Wavelength", "The distance from one point on a wave to the same point on the next wave, such as top to top."], "es": ["Longitud de onda", "La distancia desde un punto de una onda hasta el mismo punto de la siguiente, como de cresta a cresta."], "ens": "Distance from one wave to the next.", "ess": "Distancia de una onda a la siguiente.", "fig": null}, {"id": "6-3", "std": "3.2.6-8.Q", "en": ["Frequency", "How many waves pass a point each second. More waves per second means a higher frequency."], "es": ["Frecuencia", "Cuántas ondas pasan por un punto cada segundo. Más ondas por segundo significa mayor frecuencia."], "ens": "Number of waves passing each second.", "ess": "Número de ondas que pasan cada segundo.", "fig": null}, {"id": "6-4", "std": "3.2.6-8.Q", "en": ["Amplitude", "How big a wave is: the distance from its resting position to its highest point."], "es": ["Amplitud", "Qué tan grande es una onda: la distancia desde su posición de reposo hasta su punto más alto."], "ens": "How tall a wave is from its middle.", "ess": "Qué tan alta es una onda desde el centro.", "fig": null}, {"id": "6-5", "std": "3.2.6-8.Q", "en": ["How is a wave's amplitude related to its energy?", "A wave with a larger amplitude carries more energy. A big ocean wave hits harder than a small ripple."], "es": ["¿Cómo se relaciona la amplitud de una onda con su energía?", "Una onda con mayor amplitud lleva más energía. Una ola grande golpea más fuerte que una onda pequeña."], "ens": "Bigger amplitude, more energy.", "ess": "Mayor amplitud, más energía.", "fig": null}, {"id": "6-6", "std": "3.2.6-8.R", "en": ["Mechanical wave", "A wave that travels through matter, like sound through air or a wave along a rope."], "es": ["Onda mecánica", "Una onda que viaja a través de la materia, como el sonido en el aire o una onda en una cuerda."], "ens": "A wave that moves through matter.", "ess": "Una onda que viaja por la materia.", "fig": null}, {"id": "6-7", "std": "3.2.6-8.R", "en": ["Medium", "The matter a wave travels through, such as air, water, or a solid. Sound needs a medium."], "es": ["Medio", "La materia por la que viaja una onda, como el aire, el agua o un sólido. El sonido necesita un medio."], "ens": "The matter a wave travels through.", "ess": "La materia por la que viaja una onda.", "fig": null}, {"id": "6-8", "std": "3.2.6-8.R", "en": ["Can sound travel through empty space?", "No. A sound wave needs a medium, like air or water, to travel through."], "es": ["¿Puede el sonido viajar por el espacio vacío?", "No. Una onda de sonido necesita un medio, como el aire o el agua, para viajar."], "ens": "No; sound needs matter to travel.", "ess": "No; el sonido necesita materia para viajar.", "fig": null}, {"id": "6-9", "std": "3.2.6-8.R", "en": ["Reflection", "When a wave bounces off a surface. Example: light off a mirror or an echo off a wall."], "es": ["Reflexión", "Cuando una onda rebota en una superficie. Ejemplo: la luz en un espejo o un eco en una pared."], "ens": "When a wave bounces off something.", "ess": "Cuando una onda rebota en algo.", "fig": null}, {"id": "6-10", "std": "3.2.6-8.R", "en": ["Absorption", "When a material takes in a wave's energy. Example: a dark shirt absorbs light and warms up."], "es": ["Absorción", "Cuando un material toma la energía de una onda. Ejemplo: una camiseta oscura absorbe luz y se calienta."], "ens": "When a material takes in a wave's energy.", "ess": "Cuando un material toma la energía de una onda.", "fig": null}, {"id": "6-11", "std": "3.2.6-8.R", "en": ["Transmission", "When a wave passes through a material. Example: light passing through a window."], "es": ["Transmisión", "Cuando una onda pasa a través de un material. Ejemplo: la luz que pasa por una ventana."], "ens": "When a wave passes through something.", "ess": "Cuando una onda pasa a través de algo.", "fig": null}, {"id": "6-12", "std": "3.2.6-8.R", "en": ["What decides if light is reflected, absorbed, or transmitted?", "The object's material and the frequency (color) of the light."], "es": ["¿Qué decide si la luz se refleja, se absorbe o se transmite?", "El material del objeto y la frecuencia (color) de la luz."], "ens": "The material and the light's color.", "ess": "El material y el color de la luz.", "fig": null}, {"id": "6-13", "std": "3.2.6-8.R", "en": ["What does the color of light tell you about it?", "Color is tied to frequency. Different colors of light are waves with different frequencies."], "es": ["¿Qué te dice el color de la luz?", "El color está relacionado con la frecuencia. Los distintos colores de luz son ondas con frecuencias diferentes."], "ens": "Each color has a different frequency.", "ess": "Cada color tiene una frecuencia diferente.", "fig": null}, {"id": "6-14", "std": "3.2.6-8.R", "en": ["Transparent", "Describes a material that lets light pass through it so you can see through it, like air, water, or glass."], "es": ["Transparente", "Describe un material que deja pasar la luz para que puedas ver a través de él, como el aire, el agua o el vidrio."], "ens": "Light passes through; you can see through it.", "ess": "Deja pasar la luz; se ve a través.", "fig": null}, {"id": "6-15", "std": "3.2.6-8.R", "en": ["What path does light travel?", "Light travels in straight lines, except where it crosses from one transparent material to another."], "es": ["¿Qué camino sigue la luz?", "La luz viaja en línea recta, excepto donde pasa de un material transparente a otro."], "ens": "Straight lines.", "ess": "En línea recta.", "fig": null}, {"id": "6-16", "std": "3.2.6-8.R", "en": ["What happens to light going from air into water?", "Its path bends at the surface between the two materials. That is why a straw in water looks bent."], "es": ["¿Qué le pasa a la luz al pasar del aire al agua?", "Su camino se dobla en la superficie entre los dos materiales. Por eso un popote en el agua parece doblado."], "ens": "Its path bends at the surface.", "ess": "Su camino se dobla en la superficie.", "fig": null}, {"id": "6-17", "std": "3.2.6-8.R", "en": ["What does a wave model of light help explain?", "Brightness, color, and how light bends by different amounts at a surface depending on its frequency."], "es": ["¿Qué ayuda a explicar un modelo de onda de la luz?", "El brillo, el color y cómo la luz se dobla en distinta medida en una superficie según su frecuencia."], "ens": "Brightness, color, and bending of light.", "ess": "El brillo, el color y cómo se dobla la luz.", "fig": null}, {"id": "6-18", "std": "3.2.6-8.R", "en": ["Why can't light be a matter wave like sound?", "Light can travel through empty space, where there is no matter. Sound and water waves need matter."], "es": ["¿Por qué la luz no puede ser una onda de materia como el sonido?", "La luz puede viajar por el espacio vacío, donde no hay materia. Las ondas de sonido y de agua necesitan materia."], "ens": "Light travels through empty space.", "ess": "La luz viaja por el espacio vacío.", "fig": null}, {"id": "6-19", "std": "3.2.6-8.S", "en": ["Signal", "A wave or pattern used to carry information from one place to another, such as radio waves or light pulses."], "es": ["Señal", "Una onda o patrón que se usa para llevar información de un lugar a otro, como ondas de radio o pulsos de luz."], "ens": "A wave that carries information.", "ess": "Una onda que lleva información.", "fig": null}, {"id": "6-20", "std": "3.2.6-8.S", "en": ["Encode", "To change information into a form that can be sent or stored, like turning a voice into a signal."], "es": ["Codificar", "Cambiar información a una forma que se puede enviar o guardar, como convertir una voz en una señal."], "ens": "To turn information into a signal.", "ess": "Convertir información en una señal.", "fig": null}, {"id": "6-21", "std": "3.2.6-8.S", "en": ["Transmit", "To send a signal from one place to another, like through a cable or through the air."], "es": ["Transmitir", "Enviar una señal de un lugar a otro, como por un cable o por el aire."], "ens": "To send a signal.", "ess": "Enviar una señal.", "fig": null}, {"id": "6-22", "std": "3.2.6-8.S", "en": ["Analog signal", "A signal that changes smoothly and continuously to copy the original information, like a wave shaped like a sound."], "es": ["Señal analógica", "Una señal que cambia de forma suave y continua para copiar la información original, como una onda con la forma de un sonido."], "ens": "A smooth, continuous signal.", "ess": "Una señal suave y continua.", "fig": null}, {"id": "6-23", "std": "3.2.6-8.S", "en": ["Digital signal", "A signal sent as separate wave pulses, like on/off patterns of 0s and 1s. Also called a digitized signal."], "es": ["Señal digital", "Una señal enviada como pulsos de onda separados, como patrones de encendido/apagado de 0 y 1. También se llama señal digitalizada."], "ens": "A signal of separate on/off pulses.", "ess": "Una señal de pulsos separados de encendido y apagado.", "fig": null}, {"id": "6-24", "std": "3.2.6-8.S", "en": ["Wave pulse", "A single short burst of a wave. Digital signals are sent as series of wave pulses."], "es": ["Pulso de onda", "Una sola ráfaga corta de una onda. Las señales digitales se envían como series de pulsos de onda."], "ens": "One short burst of a wave.", "ess": "Una ráfaga corta de una onda.", "fig": null}, {"id": "6-25", "std": "3.2.6-8.S", "en": ["Binary pattern", "Information stored as a pattern of only two values, 0 and 1. Computers turn these patterns into sound or text."], "es": ["Patrón binario", "Información guardada como un patrón de solo dos valores, 0 y 1. Las computadoras convierten estos patrones en sonido o texto."], "ens": "A pattern of 0s and 1s.", "ess": "Un patrón de ceros y unos.", "fig": null}, {"id": "6-26", "std": "3.2.6-8.S", "en": ["Why are digital signals more reliable than analog?", "Each pulse only has to be read as on or off, so small disturbances don't change the message. Analog signals get changed more easily."], "es": ["¿Por qué las señales digitales son más confiables que las analógicas?", "Cada pulso solo debe leerse como encendido o apagado, así que pequeñas alteraciones no cambian el mensaje. Las analógicas se alteran más fácilmente."], "ens": "On/off pulses are hard to mix up.", "ess": "Los pulsos de encendido y apagado no se confunden fácilmente.", "fig": null}, {"id": "6-27", "std": "3.2.6-8.S", "en": ["Fiber optic cable", "A thin glass or plastic cable that carries information as pulses of light."], "es": ["Cable de fibra óptica", "Un cable delgado de vidrio o plástico que lleva información como pulsos de luz."], "ens": "A cable that sends light pulses.", "ess": "Un cable que envía pulsos de luz.", "fig": null}, {"id": "6-28", "std": "3.2.6-8.S", "en": ["How does Wi-Fi send information?", "Wi-Fi devices send information as pulses of radio waves through the air."], "es": ["¿Cómo envía información el wifi?", "Los aparatos de wifi envían información como pulsos de ondas de radio por el aire."], "ens": "With pulses of radio waves.", "ess": "Con pulsos de ondas de radio.", "fig": null}]}, {"n": 7, "grade": 7, "u": 4, "color": "#1E3A8A", "ink": "#193175", "glow": "#2548ac", "title": {"en": "Space Systems", "es": "Sistemas del espacio"}, "cards": [{"id": "7-1", "std": "3.3.6-8.A", "en": ["Model (in science)", "A way to show how something works when it is too big, small, or far to study directly. Models can be physical, graphical (drawings), or conceptual (ideas)."], "es": ["Modelo (en ciencias)", "Una manera de mostrar cómo funciona algo que es muy grande, pequeño o lejano para estudiarlo directamente. Los modelos pueden ser físicos, gráficos (dibujos) o conceptuales (ideas)."], "ens": "A way to show how something works.", "ess": "Una manera de mostrar cómo funciona algo.", "fig": null}, {"id": "7-2", "std": "3.3.6-8.A", "en": ["Earth-sun-moon system", "The sun, Earth, and moon and how they move: the moon orbits Earth while Earth orbits the sun. Its motions cause moon phases, eclipses, and seasons."], "es": ["Sistema Tierra-sol-luna", "El sol, la Tierra y la luna y cómo se mueven: la luna gira alrededor de la Tierra mientras la Tierra gira alrededor del sol. Sus movimientos causan las fases de la luna, los eclipses y las estaciones."], "ens": "Sun, Earth, and moon moving together.", "ess": "El sol, la Tierra y la luna moviéndose juntos.", "fig": null}, {"id": "7-3", "std": "3.3.6-8.A", "en": ["Orbit", "The curved path one object takes around another in space. Example: Earth orbits the sun once a year, and the moon orbits Earth."], "es": ["Órbita", "El camino curvo que sigue un objeto alrededor de otro en el espacio. Ejemplo: la Tierra da una vuelta alrededor del sol cada año, y la luna gira alrededor de la Tierra."], "ens": "The path an object takes around another.", "ess": "El camino de un objeto alrededor de otro.", "fig": null}, {"id": "7-4", "std": "3.3.6-8.A", "en": ["Earth's spin axis", "An imaginary line through the North and South Poles that Earth spins around. It is tilted compared to Earth's orbit and points the same direction all year."], "es": ["Eje de giro de la Tierra", "Una línea imaginaria que pasa por los polos Norte y Sur y alrededor de la cual gira la Tierra. Está inclinado respecto a la órbita de la Tierra y apunta en la misma dirección todo el año."], "ens": "Tilted line through the poles Earth spins around.", "ess": "Línea inclinada entre los polos alrededor de la cual gira la Tierra.", "fig": null}, {"id": "7-5", "std": "3.3.6-8.A", "en": ["Why do the sun and stars seem to move across the sky?", "Because Earth spins. As Earth turns, the sun, moon, and stars appear to rise and set in patterns we can observe and predict."], "es": ["¿Por qué el sol y las estrellas parecen moverse por el cielo?", "Porque la Tierra gira. Al girar la Tierra, el sol, la luna y las estrellas parecen salir y ponerse en patrones que podemos observar y predecir."], "ens": "Because Earth spins.", "ess": "Porque la Tierra gira.", "fig": null}, {"id": "7-6", "std": "3.3.6-8.A", "en": ["Cyclic pattern", "A pattern that repeats over and over in the same order. Moon phases, eclipses, and seasons are cyclic patterns caused by motions in the Earth-sun-moon system."], "es": ["Patrón cíclico", "Un patrón que se repite una y otra vez en el mismo orden. Las fases de la luna, los eclipses y las estaciones son patrones cíclicos causados por los movimientos del sistema Tierra-sol-luna."], "ens": "A pattern that repeats in the same order.", "ess": "Un patrón que se repite en el mismo orden.", "fig": null}, {"id": "7-7", "std": "3.3.6-8.A", "en": ["Lunar phases", "The changing shapes of the moon we see. The sun always lights half the moon; as the moon orbits Earth, we see different amounts of that lit half."], "es": ["Fases de la luna", "Las formas cambiantes de la luna que vemos. El sol siempre ilumina la mitad de la luna; mientras la luna gira alrededor de la Tierra, vemos distintas partes de esa mitad iluminada."], "ens": "The moon's changing shapes as it orbits Earth.", "ess": "Las formas cambiantes de la luna al girar alrededor de la Tierra.", "fig": null}, {"id": "7-8", "std": "3.3.6-8.A", "en": ["Eclipse", "When one object in space blocks sunlight from reaching another, casting a shadow. Earth and the moon can both be part of eclipses."], "es": ["Eclipse", "Cuando un objeto en el espacio bloquea la luz del sol para que no llegue a otro y proyecta una sombra. La Tierra y la luna pueden ser parte de los eclipses."], "ens": "One object blocks sunlight from another.", "ess": "Un objeto bloquea la luz del sol a otro.", "fig": null}, {"id": "7-9", "std": "3.3.6-8.A", "en": ["Solar eclipse", "An eclipse of the sun. The moon passes between the sun and Earth, and the moon's shadow falls on Earth, blocking our view of the sun."], "es": ["Eclipse solar", "Un eclipse del sol. La luna pasa entre el sol y la Tierra, y la sombra de la luna cae sobre la Tierra y nos tapa la vista del sol."], "ens": "The moon blocks the sun from Earth.", "ess": "La luna tapa el sol visto desde la Tierra.", "fig": null}, {"id": "7-10", "std": "3.3.6-8.A", "en": ["Lunar eclipse", "An eclipse of the moon. Earth passes between the sun and the moon, and Earth's shadow falls on the moon, making it look dark or reddish."], "es": ["Eclipse lunar", "Un eclipse de la luna. La Tierra pasa entre el sol y la luna, y la sombra de la Tierra cae sobre la luna, que se ve oscura o rojiza."], "ens": "Earth's shadow covers the moon.", "ess": "La sombra de la Tierra cubre la luna.", "fig": null}, {"id": "7-11", "std": "3.3.6-8.A", "en": ["Solar eclipse vs. lunar eclipse", "Solar eclipse: the moon is in the middle, and its shadow hits Earth. Lunar eclipse: Earth is in the middle, and its shadow hits the moon."], "es": ["Eclipse solar vs. eclipse lunar", "Eclipse solar: la luna está en el medio y su sombra cae sobre la Tierra. Eclipse lunar: la Tierra está en el medio y su sombra cae sobre la luna."], "ens": "Solar: moon in middle. Lunar: Earth in middle.", "ess": "Solar: la luna en medio. Lunar: la Tierra en medio.", "fig": null}, {"id": "7-12", "std": "3.3.6-8.A", "en": ["Seasons", "The yearly cycle of spring, summer, fall, and winter. They happen because Earth's spin axis is tilted as Earth orbits the sun."], "es": ["Estaciones", "El ciclo anual de primavera, verano, otoño e invierno. Ocurren porque el eje de giro de la Tierra está inclinado mientras la Tierra gira alrededor del sol."], "ens": "Yearly cycle caused by Earth's tilt.", "ess": "Ciclo anual causado por la inclinación de la Tierra.", "fig": null}, {"id": "7-13", "std": "3.3.6-8.A", "en": ["Why is it warmer in summer than in winter?", "Because of Earth's tilt, sunlight hits our part of Earth more directly in summer, so it is more intense. In winter, the same sunlight is spread out and weaker."], "es": ["¿Por qué hace más calor en verano que en invierno?", "Por la inclinación de la Tierra, en verano la luz del sol llega más directa a nuestra parte de la Tierra, así que es más intensa. En invierno, la misma luz se reparte más y es más débil."], "ens": "Summer sunlight is more direct and intense.", "ess": "En verano la luz del sol llega más directa e intensa.", "fig": null}, {"id": "7-14", "std": "3.3.6-8.B", "en": ["Gravity", "A force of attraction that pulls objects toward each other. Gravity holds the solar system and the Milky Way galaxy together and controls orbits."], "es": ["Gravedad", "Una fuerza de atracción que jala los objetos unos hacia otros. La gravedad mantiene unidos el sistema solar y la galaxia Vía Láctea y controla las órbitas."], "ens": "A force that pulls objects toward each other.", "ess": "Una fuerza que jala los objetos unos hacia otros.", "fig": null}, {"id": "7-15", "std": "3.3.6-8.B", "en": ["Solar system", "The sun and all the objects held in orbit around it by its gravity, including planets, their moons, and asteroids."], "es": ["Sistema solar", "El sol y todos los objetos que su gravedad mantiene en órbita a su alrededor, incluidos los planetas, sus lunas y los asteroides."], "ens": "The sun and everything orbiting it.", "ess": "El sol y todo lo que gira a su alrededor.", "fig": null}, {"id": "7-16", "std": "3.3.6-8.B", "en": ["Sun", "The star at the center of our solar system. Its gravity pulls on the planets and other objects and keeps them in orbit."], "es": ["Sol", "La estrella en el centro de nuestro sistema solar. Su gravedad jala los planetas y otros objetos y los mantiene en órbita."], "ens": "The star at the center of our solar system.", "ess": "La estrella en el centro de nuestro sistema solar.", "fig": null}, {"id": "7-17", "std": "3.3.6-8.B", "en": ["Planet", "A large object that orbits the sun. Earth is one of the planets in our solar system."], "es": ["Planeta", "Un objeto grande que gira alrededor del sol. La Tierra es uno de los planetas de nuestro sistema solar."], "ens": "A large object that orbits the sun.", "ess": "Un objeto grande que gira alrededor del sol.", "fig": null}, {"id": "7-18", "std": "3.3.6-8.B", "en": ["Moon", "A natural object that orbits a planet. Earth has one moon; some planets have many moons."], "es": ["Luna", "Un objeto natural que gira alrededor de un planeta. La Tierra tiene una luna; algunos planetas tienen muchas lunas."], "ens": "A natural object that orbits a planet.", "ess": "Un objeto natural que gira alrededor de un planeta.", "fig": null}, {"id": "7-19", "std": "3.3.6-8.B", "en": ["Asteroid", "A rocky object, smaller than a planet, that orbits the sun."], "es": ["Asteroide", "Un objeto rocoso, más pequeño que un planeta, que gira alrededor del sol."], "ens": "A small rocky object orbiting the sun.", "ess": "Un objeto rocoso pequeño que gira alrededor del sol.", "fig": null}, {"id": "7-20", "std": "3.3.6-8.B", "en": ["What keeps the planets in orbit around the sun?", "The sun's gravity. It constantly pulls on the planets, bending their paths into orbits so they don't fly off into space."], "es": ["¿Qué mantiene a los planetas en órbita alrededor del sol?", "La gravedad del sol. Jala constantemente a los planetas y curva sus caminos en órbitas para que no salgan disparados al espacio."], "ens": "The sun's gravity pulls on them.", "ess": "La gravedad del sol los jala.", "fig": null}, {"id": "7-21", "std": "3.3.6-8.B", "en": ["Elliptical orbit", "An orbit shaped like a stretched circle (an oval). The orbits of planets around the sun are elliptical, though many are very close to circles."], "es": ["Órbita elíptica", "Una órbita con forma de círculo estirado (un óvalo). Las órbitas de los planetas alrededor del sol son elípticas, aunque muchas son casi circulares."], "ens": "An oval-shaped orbit.", "ess": "Una órbita con forma de óvalo.", "fig": null}, {"id": "7-22", "std": "3.3.6-8.B", "en": ["How did the solar system form?", "It appears to have formed from a spinning disk of dust and gas. Gravity pulled the material together to form the sun, planets, and other objects."], "es": ["¿Cómo se formó el sistema solar?", "Parece que se formó a partir de un disco de polvo y gas que giraba. La gravedad juntó el material para formar el sol, los planetas y otros objetos."], "ens": "Gravity pulled together a disk of dust and gas.", "ess": "La gravedad juntó un disco de polvo y gas.", "fig": null}, {"id": "7-23", "std": "3.3.6-8.B", "en": ["Galaxy", "A huge group of stars, plus gas and dust, held together by gravity."], "es": ["Galaxia", "Un grupo enorme de estrellas, además de gas y polvo, que la gravedad mantiene unido."], "ens": "A huge group of stars held by gravity.", "ess": "Un grupo enorme de estrellas unido por la gravedad.", "fig": null}, {"id": "7-24", "std": "3.3.6-8.B", "en": ["Milky Way galaxy", "The galaxy that our solar system is part of. Gravity holds its stars together, and our sun is just one of them."], "es": ["Galaxia Vía Láctea", "La galaxia de la que forma parte nuestro sistema solar. La gravedad mantiene unidas sus estrellas, y nuestro sol es solo una de ellas."], "ens": "The galaxy our solar system is in.", "ess": "La galaxia donde está nuestro sistema solar.", "fig": null}, {"id": "7-25", "std": "3.3.6-8.B", "en": ["Universe", "Everything that exists in space, including all the galaxies. The Milky Way is one of many galaxies in the universe."], "es": ["Universo", "Todo lo que existe en el espacio, incluidas todas las galaxias. La Vía Láctea es una de muchas galaxias del universo."], "ens": "Everything in space, including all galaxies.", "ess": "Todo lo que hay en el espacio, incluidas todas las galaxias.", "fig": null}, {"id": "7-26", "std": "3.3.6-8.C", "en": ["Scale", "How big or far something is compared to something else. Example: if the sun were a basketball, Earth would be smaller than a peppercorn."], "es": ["Escala", "Qué tan grande o lejano es algo comparado con otra cosa. Ejemplo: si el sol fuera una pelota de baloncesto, la Tierra sería más pequeña que un grano de pimienta."], "ens": "How big or far something is compared to another.", "ess": "Qué tan grande o lejano es algo comparado con otra cosa.", "fig": null}, {"id": "7-27", "std": "3.3.6-8.C", "en": ["Scale model", "A model that keeps the same size or distance ratios as the real thing, just smaller. Example: showing planet distances along a football field."], "es": ["Modelo a escala", "Un modelo que mantiene las mismas proporciones de tamaño o distancia que lo real, pero más pequeño. Ejemplo: mostrar las distancias de los planetas en un campo de fútbol americano."], "ens": "A smaller model with the same proportions.", "ess": "Un modelo más pequeño con las mismas proporciones.", "fig": null}, {"id": "7-28", "std": "3.3.6-8.C", "en": ["Scale properties", "Measurable features of an object in space, such as its size, the thickness of its layers, the size of surface features, and its orbital radius."], "es": ["Propiedades de escala", "Características medibles de un objeto en el espacio, como su tamaño, el grosor de sus capas, el tamaño de sus rasgos de la superficie y su radio orbital."], "ens": "Measurable sizes and distances of space objects.", "ess": "Tamaños y distancias medibles de los objetos en el espacio.", "fig": null}, {"id": "7-29", "std": "3.3.6-8.C", "en": ["Orbital radius", "The distance from an object to the object it orbits. Example: Earth's orbital radius is its distance from the sun."], "es": ["Radio orbital", "La distancia de un objeto al objeto alrededor del cual gira. Ejemplo: el radio orbital de la Tierra es su distancia al sol."], "ens": "Distance from an object to what it orbits.", "ess": "Distancia de un objeto a lo que rodea en su órbita.", "fig": null}, {"id": "7-30", "std": "3.3.6-8.C", "en": ["Crust", "The thin, solid, rocky outer layer of a rocky planet or moon, like Earth or Mars. Scientists can compare the size of this layer on different objects."], "es": ["Corteza", "La capa exterior delgada, sólida y rocosa de un planeta o una luna rocosos, como la Tierra o Marte. Los científicos pueden comparar el tamaño de esta capa en distintos objetos."], "ens": "The thin rocky outer layer of a rocky planet.", "ess": "La capa rocosa exterior y delgada de un planeta rocoso.", "fig": null}, {"id": "7-31", "std": "3.3.6-8.C", "en": ["Surface feature", "A landform on the outside of a planet or moon, such as a volcano. Scientists compare the sizes of surface features on different objects."], "es": ["Rasgo de la superficie", "Una forma del terreno en el exterior de un planeta o una luna, como un volcán. Los científicos comparan el tamaño de estos rasgos en distintos objetos."], "ens": "A landform on a planet or moon, like a volcano.", "ess": "Una forma del terreno en un planeta o luna, como un volcán.", "fig": null}, {"id": "7-32", "std": "3.3.6-8.C", "en": ["How do scientists get data about
